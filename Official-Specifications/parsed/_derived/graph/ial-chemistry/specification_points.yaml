- code: IAL_CHEMISTRY:Chemistry-15.20
  official_code: '15.20'
  official_wording: 'be able to use both low and high resolution proton NMR spectroscopy to: i predict
    the different types of proton present in a molecule, given values of chemical shift, δ ii relate relative
