  official_code: B1.1.1
  official_wording: 'Describe the characteristics of living organisms by defining: (a). movement as an
    action by an organism or part of an organism causing a change of position or place (b). respiration
    as the chemical reactions in cells that break down nutrient molecules and release energy for metabolism
    (c). sensitivity as the ability to detect and respond to changes in the internal or external environment
    (d). growth as a permanent increase in size and dry mass (e). reproduction as the processes that make
    more of the same kind of organism (f). excretion as the removal of waste products of metabolism and
    substances in excess of requirements (g). nutrition as the taking in of materials for energy, growth
    and development'
