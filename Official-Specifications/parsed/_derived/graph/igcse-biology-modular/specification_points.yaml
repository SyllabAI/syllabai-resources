- code: IGCSE_BIOLOGY_MODULAR:1.4
  official_code: '1.4'
  official_wording: 'understand the term pathogen and know that pathogens may include fungi, bacteria,
    protoctists or viruses Viruses: these are not living organisms. They are small particles, smaller
    than bacteria; they are parasitic and can reproduce only inside living cells; they infect every type
    of living organism. They have a wide variety of shapes and sizes; they have no cellular structure
    but have a protein coat and contain one type of nucleic acid, either DNA or RNA. Examples include
    the tobacco mosaic virus that causes discolouring of the leaves of tobacco plants by preventing the
    formation of chloroplasts, the influenza virus that causes ‘flu’ and the HIV virus that causes AIDS.'
