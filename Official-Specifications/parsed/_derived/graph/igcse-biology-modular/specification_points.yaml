- code: IGCSE_BIOLOGY_MODULAR:1.3
  official_code: '1.3'
  official_wording: 'describe the common features shown by prokaryotic organisms such as bacteria Bacteria:
    these are microscopic single-celled organisms; they have a cell wall, cell membrane, cytoplasm and
    plasmids; they lack a nucleus but contain a circular chromosome of DNA; some bacteria can carry out
    photosynthesis but most feed off other living or dead organisms. Examples include Lactobacillus bulgaricus
    , a rod-shaped bacterium used in the production of yoghurt from milk, and Pneumococcus , a spherical
    bacterium that acts as the pathogen causing pneumonia.'
