name: scripts-tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "graph/**"
      - ".github/workflows/scripts-tests.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "graph/**"
      - ".github/workflows/scripts-tests.yml"
  workflow_dispatch:

jobs:
  corpus-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pydantic pymupdf
      - name: kg golden-sample regression gate (T-KG-B — resources export vs vendored v75 golden; 257/257 full-set after the point_edges ratification)
        run: python3 scripts/kg_export.py --verify-golden
      - name: graph integrity (c09/c11 graph-as-code validator)
        run: python3 scripts/graph_check.py
      - name: c12 spec tagger negative tests (no network, no key)
        run: python3 scripts/c12_negative_test.py
      - name: c12 review gate tests (render + promote, sandboxed, no key)
        run: python3 scripts/c12_review_test.py
      - name: c12 promotions record integrity (if present)
        run: python3 scripts/c12_promote.py check
      - name: c12 demo decisions still pass the check gate (positive control)
        run: python3 scripts/c12_spec_tagger.py check scripts/c12_decisions/smoke-demo.agent-pass-1.yaml
      - name: sme speech transpile battery (T-RULE-T3-SUBSTRATE-1 pinned port-equivalence vs the of-record v2 ladder)
        run: python3 scripts/sme_speech_transpile_test.py
      - name: G9 aggregation-law + asset-byte-guard tests (F105 — the seven required scenarios + F104 fixtures; zero network)
        run: python3 scripts/official_examq_g9_tests.py
      - name: MS-grid strip-law tests (F115 — the F88 reconciliation, the abbreviated-footer marks tail + the 12 standing keeps; zero network)
        run: python3 scripts/official_examq_strip_law_tests.py
      - name: F116 F111-remaining-classes tests (the F47 ledger==corpus verbatim law + the F94 share_with replay + the 70 live guard pins; zero network)
        run: python3 scripts/official_examq_f116_tests.py
      - name: F117 exponent-restore gate tests (the case-robust lane gate + the 51 live class-2 pins + the 11(d) re-point of record + the zero-mint census; zero network)
        run: python3 scripts/official_examq_f117_tests.py
      - name: F118 F95 ALLOW-lead guard tests (the answer-cell M-row law + the 18-hit census + the F97 zero-flip; zero network)
        run: python3 scripts/official_examq_f118_tests.py
      - name: maths-B corpus back-sync battery (F122/run-030 — the 2,669 synced-field pins + ledger laws + C-generation cross-check; zero network)
        run: python3 scripts/official_examq_mathsb_backsync_tests.py
      - name: 4PH1 physics corpus back-sync battery (F126/run-006 — the 766 synced-field pins + ledger laws + render-determinism + nuclear-line pin; zero network)
        run: python3 scripts/official_examq_phys_backsync_tests.py
      - name: 4PH1 physics group-stem serving battery (F128/run-007 — the 421 served group-intro pins + the G-E7 physics accounting + grammar + char laws + negative control; zero network)
        run: python3 scripts/official_examq_phys_groupstem_tests.py
      - name: F104 asset-byte guard scan (every assets/ file format-truth validated + dangling references)
        run: python3 scripts/official_examq_asset_bytes.py --scan-corpus Official-ExamQuestion

  official-export-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch the hub bundles of record — two-file law (syllabai-v2 main, public)
        run: |
          curl -sfSL -o /tmp/current-questions.json \
            https://raw.githubusercontent.com/SyllabAI/syllabai-v2/main/apps/hub/content/igcse-chemistry-19/questions.json
          curl -sfSL -o /tmp/current-official-papers.json \
            https://raw.githubusercontent.com/SyllabAI/syllabai-v2/main/apps/hub/content/igcse-chemistry-19/official-papers.json
          python3 -c "import json; q=json.load(open('/tmp/current-questions.json')); p=json.load(open('/tmp/current-official-papers.json')); print('bundles of record:', len(q), 'SME sets +', len(p), 'official sets (two-file law, v2 IA 662654ade0)')"
      - name: stage the corpus topics (v0.10.0 exporter interface — topics/<series>-<paper>.json)
        run: |
          mkdir -p topics
          n=0
          for f in Official-ExamQuestion/igcse-chemistry-19/*/4CH1-*/topic.json; do
            series=$(echo "$f" | cut -d/ -f3)
            paper=$(echo "$f" | cut -d/ -f4 | sed -e 's/^4CH1-//')
            cp "$f" "topics/${series}-${paper}.json"
            n=$((n+1))
          done
          echo "topics staged: $n"
          test "$n" -eq 54
      - name: pick the chemistry-plane disclosure of record (F115 — lane-aware LATEST; a disclosure whose census sets lie wholly outside the chemistry lane is another lane's census, not this exporter's; empty-census r2-consumed forms stay eligible)
        id: pick_disclosure
        run: |
          LATEST=$(ls scripts/exporter-disclosures/*.json 2>/dev/null | sort -V | python3 -c "
          import json, sys
          elig = []
          for p in sys.stdin.read().split():
              try:
                  d = json.load(open(p))
              except Exception:
                  continue
              if not all(isinstance(d.get(k), dict) for k in ('new', 'gone', 'changed')):
                  continue
              keys = list(d.get('new', {})) + list(d.get('gone', {})) + list(d.get('changed', {}))
              if all(k.startswith('official-4ch1-') for k in keys):
                  elig.append(p)
          print(elig[-1] if elig else '')
          ")
          echo "chemistry-plane disclosure of record: ${LATEST:-none}"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
      - name: run the exporter of record (two-file interface — official-papers.json split, v2 IA 662654ade0; disclosed wave census when one is filed)
        run: |
          mkdir -p /tmp/export-stage
          LATEST="${{ steps.pick_disclosure.outputs.latest }}"
          if [ -n "$LATEST" ]; then
            echo "exporter mode: disclosed wave census ($LATEST)"
            python3 scripts/official_examq_export_hub.py /tmp/export-stage /tmp/current-questions.json \
              --current-official-papers /tmp/current-official-papers.json \
              --topics-dir topics --expected-deltas "$LATEST" --allow-new-official
          else
            echo "exporter mode: reproducibility no-op (no disclosure of record)"
            python3 scripts/official_examq_export_hub.py /tmp/export-stage /tmp/current-questions.json \
              --current-official-papers /tmp/current-official-papers.json \
              --topics-dir topics
          fi
      - name: F-187 G-E1..G-E4 verify against the two-file bundle of record (+ report + disclosure cross-check)
        run: |
          LATEST="${{ steps.pick_disclosure.outputs.latest }}"
          if [ -n "$LATEST" ]; then
            python3 scripts/official_examq_verify_export.py verify \
              --stage /tmp/export-stage/content/igcse-chemistry-19/questions.json \
              --stage-official-papers /tmp/export-stage/content/igcse-chemistry-19/official-papers.json \
              --current /tmp/current-questions.json \
              --current-official-papers /tmp/current-official-papers.json \
              --report Official-ExamQuestion/igcse-chemistry-19/MULTI-SERIES-REPORT.json \
              --disclosure "$LATEST" --allow-new-official
          else
            python3 scripts/official_examq_verify_export.py verify \
              --stage /tmp/export-stage/content/igcse-chemistry-19/questions.json \
              --stage-official-papers /tmp/export-stage/content/igcse-chemistry-19/official-papers.json \
              --current /tmp/current-questions.json \
              --current-official-papers /tmp/current-official-papers.json \
              --report Official-ExamQuestion/igcse-chemistry-19/MULTI-SERIES-REPORT.json
          fi
      - name: F-187 seed-fault negative controls (acceptance 4-of-4 refuse)
        run: |
          python3 scripts/official_examq_verify_export.py self-test \
            --stage /tmp/export-stage/content/igcse-chemistry-19/questions.json \
            --stage-official-papers /tmp/export-stage/content/igcse-chemistry-19/official-papers.json \
            --current /tmp/current-questions.json \
            --current-official-papers /tmp/current-official-papers.json \
            --allow-new-official
      - name: F119 part-label battery (the printed-part-label serving wave — law + wiring, zero network)
        run: python3 scripts/official_examq_f119_tests.py
      - name: F121 group-stem battery (the group-stem restore wave — law + wiring, zero network)
        run: python3 scripts/official_examq_f121_tests.py
