source_gaps:
  - id: GAP-SRC-001
    description: >-
      Official examiner reports for 4CH1 sessions are absent from every SyllabAI repo
      (sweep 2026-10-25: syllabai-resources full 82,234-path tree, syllabai-pastpapers,
      syllabai-experimental, syllabai-parser — zero examiner-report artifacts). Highest-value
      acquisition target; feeds MIS/MS/EXM/PED/TUT families. Do not synthesize examiner
      sentiment from mark schemes alone.
  - id: GAP-SRC-002
    description: >-
      Legacy 4CH0 specification / papers / books absent (zero path hits repo-wide). The HIS
      family is OPTIONAL until a legacy corpus is acquired; legacy material must stay
      explicitly labeled LEGACY — HISTORICAL per protocol §2.
  - id: GAP-SRC-003
    description: >-
      No standalone official periodic-table / data-sheet artifact. Evidence exists embedded:
      spec PDF (58 pp, Issue 3) and the student book's PERIODIC TABLE back-matter page; exam
      assets carry per-question periodic-table extracts. A standalone reference intake is
      optional, not blocking.
  - id: GAP-SRC-004
    description: >-
      Official teaching guide / scheme of work absent. Topic sequencing evidence currently
      limited to the student book chapter order and the validated CourseLessons spine.
backlog:
  - id: BL-001
    description: Acquire official 4CH1 examiner reports for available sessions (GAP-SRC-001);
      record session coverage + provenance in source_manifest.yaml on arrival.
  - id: BL-002
    description: Acquire 4CH0 legacy corpus (spec + representative papers) for the HIS family
      (GAP-SRC-002); classify LEGACY — HISTORICAL.
  - id: BL-003
    description: Provision NotebookLM notebook 4CH1-SIB-NOTEBOOK-001 and upload the
      CURRENT — AUTHORITATIVE / CURRENT — ASSESSMENT EVIDENCE sources; label legacy vs current
      inside the notebook per protocol §2.
  - id: BL-004
    description: First artifact wave = CUR-01..CUR-08 (generation order pass 2, protocol §4),
      grounded on SRC-SPEC-4CH1 + SRC-GRAPH-4CH1 + SRC-BOOK-4CH1-SB1.
