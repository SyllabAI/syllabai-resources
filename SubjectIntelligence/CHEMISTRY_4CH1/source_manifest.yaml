# ------------------------------------------------------------------ gaps
source_gaps:
  - id: GAP-SRC-001
    title: Official examiner reports
    detail: zero examiner-report artifacts in any SyllabAI repo (2026-10-25 sweep). Strongly recommended
      per requirements §2A — feeds MIS/MS/EXM/PED/TUT. Acquisition is backlog BL-001. Until acquired,
      examiner-sentiment artifacts (EXM-01..05) cannot pass QA on real evidence.
    severity: HIGH
  - id: GAP-SRC-002
    title: Legacy 4CH0 corpus
    detail: zero 4CH0 path hits repo-wide. HIS family evidence (requirements §2F) missing; HIS kept
      OPTIONAL in manifest.yaml. Acquisition is backlog BL-002. Any future 4CH0 material must be
      classified LEGACY — HISTORICAL.
    severity: MEDIUM
  - id: GAP-SRC-003
    title: Standalone periodic table / data sheet
    detail: no standalone official reference artifact; evidence embedded in spec PDF + SB1 back matter
      + per-question exam assets. Optional standalone intake (requirements §2D); not blocking.
    severity: LOW
  - id: GAP-SRC-004
    title: Official teaching guide / scheme of work
    detail: absent (requirements §3). Sequencing evidence limited to SB1 chapter order + validated
      lesson spine (SRC-LESSONS-4CH1). Not blocking.
    severity: LOW

# ------------------------------------------------------------------ minimum-corpus check
minimum_corpus_check:   # requirements §5 — the six groups, inventoried 2026-10-25
  - group: 1. Official 4CH1 specification + validated SpecificationPoint registry
    status: PRESENT   # SRC-SPEC-4CH1 + SRC-GRAPH-4CH1 (182 points)
  - group: 2. Current student book + official teaching/support material
    status: PARTIAL   # SRC-BOOK-4CH1-SB1 validated v3; teaching guide ABSENT (GAP-SRC-004)
  - group: 3. Complete available QP/MS corpus with paper/session identities
    status: PRESENT   # SRC-QPMS-4CH1 — 54 papers / 16 sessions / 4 variants, identities preserved
  - group: 4. Official examiner reports
    status: ABSENT    # GAP-SRC-001 — record and proceed where evidence suffices; never fabricate
  - group: 5. Validated SME revision notes + question-to-spec mappings
    status: PRESENT   # SRC-SME-NOTES-4CH1 + SRC-SPECLINKS-4CH1 (+ SRC-EXT-NOTES-4CH1, SRC-PMT-4CH1)
  - group: 6. Practical guidance, data sheets, reference material
    status: PARTIAL   # 12 Core Practicals registry (graph/igcse-chemistry/practicals.yaml) + spec practical
    detail: statements; standalone data sheet absent (GAP-SRC-003)
legacy_inventory:      # requirements §5, final line — 4CH0 as separate legacy group
  group: 4CH0 legacy
  status: ABSENT       # GAP-SRC-002
