# CHEMISTRY_4CH1 — SIB v1 source manifest (v1.0)
# Built 2026-10-25 from a full read-only inventory of the SyllabAI repos.
# Law (SOURCE_REQUIREMENTS_4CH1.md §4): source files stay in their canonical
# repositories; this manifest POINTS at them with stable identifiers, repository
# paths, versions, session metadata and checksums where available. Nothing is
# duplicated into this library for its own sake.
#
# Classification vocabulary (requirements §4):
#   CURRENT — AUTHORITATIVE | CURRENT — ASSESSMENT EVIDENCE | SUPPLEMENTARY |
#   LEGACY — HISTORICAL | RESEARCH / INFERRED
#
# Identifier law: `tree_sha` / `blob_sha` are git object ids pinned at
# syllabai-resources @ f42033e01de382f8962af4944df10655c21baf9a (verifiable with
# `git cat-file`); of-record sha256/sha1 values are quoted from the repo's own
# ledgers (books/CATALOG.md, Official-Specifications/igcse-chemistry/spec.json).

manifest_version: "1.0"
