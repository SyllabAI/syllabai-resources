# SOURCES — GradeBoundaries source registry (T-GRADE-1)

schema: syllabai.grade-boundaries.sources/1
maintained_by: GradeBoundaries/scripts (fetch_pearson.py / fetch_cie.py)

pearson:
  landing: https://qualifications.pearson.com/en/support/support-topics/results-certification/grade-boundaries.html
  base: https://qualifications.pearson.com/content/dam/pdf/Support/Grade-boundaries
  families:
    pearson-int-gcse-linear:
      path: International-GCSE
      slug_matrix:
        - "grade-boundaries-{s}-int-gcse.pdf"                       # 2024-2026 era
        - "grade-boundaries-{s}-international-gcse.pdf"             # 2026 canonical
        - "{ym}-ig-9-1-subject-grade-boundaries.pdf"                # 2019-2023 era
        - "{ym}-int-gcse-grade-boundaries.pdf"
        - "{ym}_intGCSE_(9-1)_Subject_Grade_Boundaries_V1.pdf"      # e.g. 2201 Jan 2022
        - "{ym}-intgcse-9-1-subject-grade-boundaries.pdf"           # e.g. 2306 Jun 2023
        - "{ym}-international-gcse-subject-grade-boundaries.pdf"    # e.g. 2511 Nov 2025
        - "{ym}-int-gcse-subject-grade-boundaries.pdf"
      covers: all linear International GCSE (9-1) subjects incl. tier rows
    pearson-int-gcse-modular:
      path: International-GCSE
      slug_matrix:
        - "grade-boundaries-{s}-international-gcse-modular.pdf"
        - "grade-boundaries-{s}-int-gcse-modular.pdf"
      covers: 4X modular suites (units raw+UMS, 9-1 cash-in UMS); first docs 2024
    pearson-ial:
      path: International-A-level
      slug_matrix:
        - "grade-boundaries-{s}-international-advanced-level.pdf"
        - "grade-boundaries-{s}-ial.pdf"
        - "{ym}-ial-grade-boundaries.pdf"                           # e.g. 2001 Jan 2020
        - "{ym}-int-a-level-grade-boundaries.pdf"
      covers: IAL units (raw+UMS) + X/Y cash-ins (UMS A*..E)
  verification: "%PDF magic + final URL must not be /en/campaigns/404.html"

cambridge:
  listing: https://www.cambridgeinternational.org/programmes-and-qualifications/cambridge-upper-secondary/cambridge-igcse/grade-threshold-tables (+ cambridge-advanced/...)
  note: T-GRADE-2 correction — the per-session listing pages ARE server-rendered; fetch_cie.py crawls them (8 pages per run) and harvests /Images/<id>-…-grade-threshold-table.pdf links for the wanted syllabi. CIE_IDS remains as a verified known-ID fallback seed.
  base: https://www.cambridgeinternational.org/Images
  sessions: June 2026, June 2025, November 2025, November 2024 (both programme levels)
  wanted_codes: the 31 course-map syllabi (see scripts/fetch_cie.py WANTED_CODES)
  honest_absences:
    "0490": "no June 2025/June 2026 award in CIE listings; November 2024/November 2025 present"
    "0264": "first assessment March 2027 (official CIE syllabus page) — no boundary documents exist yet"

structure_metadata:
  file: curated/aggregation.json
  sources:
    - https://qualifications.pearson.com/content/dam/pdf/Support/Information-manual/4-ial-2025-2026.pdf (IAL cash-in compositions)
    - https://qualifications.pearson.com/en/support/support-topics/results-certification/understanding-marks-and-grades/understanding-your-results-information-for-students/edexcel-international-advanced-level-results-explained.html (A* rules)
    - https://qualifications.pearson.com/content/dam/pdf/International%20GCSE/Science%20(Double%20Award)/2024/specification-and-sample-assessments/international-gcse-science-da-modular-specification.pdf (4XSD1 unit structure)
  law: composition/structure metadata only; boundary values always document-sourced

