    learning_objective: "Understand how ions are formed by electron loss or gain; Know the charges of these ions: metals in Groups 1, 2 and 3; non-metals in Groups 5, 6 and 7; Ag⁺, Cu²⁺, Fe²⁺, Fe³⁺, Pb²⁺, Zn²⁺; hydrogen (H⁺), hydroxide (OH⁻), ammonium (NH₄⁺), carbonate (CO₃²⁻), nitrate (NO₃⁻), sulfate (SO₄²⁻); Write formulae for compounds formed between the ions listed above; Draw dot-and-cross diagrams to show the formation of ionic compounds by electron transfer, limited to combinations of elements from Groups 1, 2, 3, 5, 6 and 7 (only outer electrons need be shown); Understand ionic bonding in terms of electrostatic attractions; Understand why compounds with giant ionic lattices have high melting and boiling points; Know that ionic compounds do not conduct electricity when solid, but do conduct electricity when molten and in aqueous solution"
