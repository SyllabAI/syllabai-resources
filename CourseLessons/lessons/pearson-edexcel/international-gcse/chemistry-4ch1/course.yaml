    learning_objective: "Understand the three states of matter in terms of the arrangement, movement and energy of the particles; Understand the interconversions between the three states of matter in terms of: the names of the interconversions; how they are achieved; the changes in arrangement, movement and energy of the particles; Know what is meant by the terms: solvent; solute; solution; saturated solution; CHEMISTRY ONLY — Know what is meant by the term solubility in the units g per 100 g of solvent; Understand how the results of experiments involving the dilution of coloured solutions and diffusion of gases can be explained"
