# glossary — u1:c09 (ms layer: every entry needs ms_accepts; definition ≤40 words)
# All sources are chunkRefs into the parse of record (chunks_v3) — provenance law.
- term: metallic bonding
  slug: metallic-bonding
  definition: "The electrostatic forces of attraction between the positive ions and the delocalised electrons, which hold the giant metallic lattice together."
  ms_accepts: ["electrostatic forces/attraction between positive ions and delocalised electrons", "attraction between the lattice of positive ions and the sea of delocalised electrons"]
  ms_avoids: ["sharing of electron pairs between metal atoms", "a bond between two metal ions", "electrons transferred between ions"]
  aliases: ["metallic bond"]
  source: "chem_v3_u1_c9_pdf108_0397"
- term: delocalised electron
  slug: delocalised-electron
  definition: "An outer-shell electron that is no longer attached to any particular atom or bond and can move freely throughout the whole metallic structure."
  ms_accepts: ["electrons free to move through the whole structure", "not attached to any particular atom or pair of atoms"]
  ms_avoids: ["electrons shared between two atoms", "electrons that have left the metal", "free electrons (as a definition — name them delocalised)"]
  aliases: ["delocalised electrons"]
  source: "chem_v3_u1_c9_pdf107_0396"
- term: lattice
  slug: lattice
  definition: "A regular arrangement of particles repeated in three dimensions. A metallic lattice is a regular arrangement of positive ions with delocalised electrons between them."
  ms_accepts: ["regular arrangement of particles", "regular repeating arrangement of ions in three dimensions"]
  ms_avoids: ["a random arrangement of ions", "a lattice made of electrons", "any fixed shape"]
  aliases: ["giant lattice", "metallic lattice"]
  source: "chem_v3_u1_c9_pdf107_0396"
- term: malleable
  slug: malleable
  definition: "Can be hammered or bent into different shapes without shattering. Metals are malleable because layers of positive ions slide over each other while the bonding stays intact."
  ms_accepts: ["can be hammered into shape", "layers of ions slide over each other without the bonding breaking"]
  ms_avoids: ["can be drawn into wires (that is ductile)", "weak or soft", "the bonding breaks when bent"]
  aliases: ["malleability"]
  source: "chem_v3_u1_c9_pdf108_0401"
- term: ductile
  slug: ductile
  definition: "Can be drawn out into wires. The explanation is the same as for malleability — the layers of ions slide past each other while the delocalised electrons keep the bonding intact."
  ms_accepts: ["can be drawn out into wires", "same sliding-layers explanation as malleability"]
  ms_avoids: ["the same property as malleability with no explanation", "can be melted and poured into moulds"]
  aliases: ["ductility"]
  source: "chem_v3_u1_c9_pdf109_0402"
