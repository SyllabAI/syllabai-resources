learning_objective: 'describe experiments to investigate the effects of changes in
  surface area of a solid, concentration of a solution, temperature and the use of
  a catalyst on the rate of a reaction; describe the effects of changes in surface
  area of a solid, concentration of a solution, pressure of a gas, temperature and
  the use of a catalyst on the rate of a reaction; explain the effects of changes
  in surface area of a solid, concentration of a solution, pressure of a gas and temperature
  on the rate of a reaction in terms of particle collision theory; know that a catalyst
  is a substance that increases the rate of a reaction, but is chemically unchanged
  at the end of the reaction; know that a catalyst works by providing an alternative
  pathway with lower activation energy; draw and explain reaction profile diagrams
  showing Δ H and activation energy; practical: investigate the effect of changing
  the surface area of marble chips and of changing the concentration of hydrochloric
  acid on the rate of reaction between marble chips and dilute hydrochloric acid;
  practical: investigate the effect of different solids on the catalytic decomposition
  of hydrogen peroxide solution.'
