learning_objective: 'know that chemical reactions in which heat energy is given out
  are described as exothermic, and those in which heat energy is taken in are described
  as endothermic; describe simple calorimetry experiments for reactions such as combustion,
  displacement, dissolving and neutralisation; calculate the heat energy change from
  a measured temperature change using the expression Q = m c Δ T; calculate the molar
  enthalpy change (ΔH) from the heat energy change, Q; draw and explain energy level
  diagrams to represent exothermic and endothermic reactions; know that bond-breaking
  is an endothermic process and that bond-making is an exothermic process; use bond
  energies to calculate the enthalpy change during a chemical reaction; practical:
  investigate temperature changes accompanying some of the following types of change:
  • salts dissolving in water • neutralisation reactions • displacement reactions
  • combustion reactions.'
