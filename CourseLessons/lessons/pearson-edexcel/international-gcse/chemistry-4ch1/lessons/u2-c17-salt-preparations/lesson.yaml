learning_objective: 'Know the general rules for predicting the solubility of ionic
  compounds in water: • common sodium, potassium and ammonium compounds are soluble
  • all nitrates are soluble • common chlorides are soluble, except those of silver
  and lead(II) • common sulfates are soluble, except for those of barium, calcium
  and lead(II) • common carbonates are insoluble, except for those of sodium, potassium
  and ammonium • common hydroxides are insoluble except for those of sodium, potassium
  and calcium (calcium hydroxide is slightly soluble).; Understand acids and bases
  in terms of proton transfer; Understand that an acid is a proton donor and a base
  is a proton acceptor; Describe the reactions of hydrochloric acid, sulfuric acid
  and nitric acid with metals, bases and metal carbonates (excluding the reactions
  between nitric acid and metals) to form salts; Know that metal oxides, metal hydroxides
  and ammonia can act as bases, and that alkalis are bases that are soluble in water;
  Describe an experiment to prepare a pure, dry sample of a soluble salt, starting
  from an insoluble reactant; Describe an experiment to prepare a pure, dry sample
  of a soluble salt, starting from an acid and alkali; Describe an experiment to prepare
  a pure, dry sample of an insoluble salt, starting from two soluble reactants; practical:
  prepare a sample of pure, dry hydrated copper(II) sulfate crystals starting from
  copper(II) oxide; practical: prepare a sample of pure, dry lead(II) sulfate'
