# glossary — u2:c17 (ms layer: every entry needs ms_accepts; definition ≤40 words)
# All sources are chunkRefs into the parse of record (chunks_v3) — provenance law.
- term: salt
  slug: salt
  definition: "The compound formed when the hydrogen in an acid is replaced by a metal or by the ammonium ion. Magnesium sulfate, zinc chloride and potassium nitrate are all salts; each acid names its own salt family."
  ms_accepts: ["compound formed when acid hydrogen is replaced by a metal/ammonium", "acid + base reaction product containing the acid's anion and a metal or ammonium cation"]
  ms_avoids: ["restricting 'salt' to sodium chloride — table salt is one member of a huge family", "saying a salt always contains a metal — ammonium salts do not"]
  aliases: ["salts"]
  source: "chem_v3_u2_c17_pdf182_0688"
- term: ammonium salt
  slug: ammonium-salt
  definition: "A salt in which the acid's hydrogen has been replaced by the ammonium ion NH₄⁺ — for example ammonium chloride, NH₄Cl, and ammonium sulfate, (NH₄)₂SO₄. No metal atom is present."
  ms_accepts: ["salt containing the NH₄⁺ ion", "NH₄Cl and (NH₄)₂SO₄ as examples"]
  ms_avoids: ["writing ammonium as NH₃ — the ion carries four hydrogens and a positive charge", "calling ammonium a metal"]
  aliases: ["ammonium salts"]
  source: "chem_v3_u2_c17_pdf183_0694"
- term: base
  slug: base
  definition: "A substance that neutralises an acid by combining with its hydrogen ions to produce water. In this specification: metal oxides, metal hydroxides and ammonia; in proton-transfer terms, a proton acceptor."
  ms_accepts: ["proton acceptor", "neutralises acids; metal oxides, hydroxides and ammonia act as bases"]
  ms_avoids: ["listing carbonates among the specification's bases", "using 'base' and 'alkali' interchangeably — an alkali is a soluble base"]
  aliases: ["bases"]
  source: "chem_v3_u2_c17_pdf185_0703"
- term: metal oxide
  slug: metal-oxide
  definition: "An ionic compound of a metal with the oxide ion O²⁻; a base. Reacts with acids to give a salt and water — copper(II) oxide with hot dilute sulfuric acid gives blue copper(II) sulfate solution."
  ms_accepts: ["metal oxide + acid → salt + water", "contains the O²⁻ ion which accepts H⁺ to form water"]
  ms_avoids: ["saying metal oxides dissolve in water generally — most are insoluble", "forgetting that most oxide–acid reactions need heating"]
  aliases: ["metal oxides"]
  source: "chem_v3_u2_c17_pdf185_0703"
- term: alkali
  slug: alkali
  definition: "A base that is soluble in water; a solution that is a source of hydroxide (OH⁻) ions. Sodium hydroxide, potassium hydroxide, calcium hydroxide (slightly) and ammonia solution are the alkalis to know."
  ms_accepts: ["soluble base", "source of hydroxide ions in solution"]
  ms_avoids: ["calling copper(II) oxide an alkali — it is a base that does not dissolve", "saying all bases are alkalis"]
  aliases: ["alkalis"]
  source: "chem_v3_u2_c17_pdf185_0704"
- term: ammonia solution
  slug: ammonia-solution
  definition: "Dissolved ammonia acting as an alkali: NH₃ reacts reversibly with water to form ammonium ions and hydroxide ions, NH₃ + H₂O ⇌ NH₄⁺ + OH⁻, so the solution is weakly alkaline."
  ms_accepts: ["NH₃(aq) + H₂O(l) ⇌ NH₄⁺(aq) + OH⁻(aq)", "weak alkali because only some ammonia reacts with water"]
  ms_avoids: ["writing ammonia solution as NH₄OH", "omitting the reversible arrow — the reaction is an equilibrium"]
  aliases: ["ammonia solution", "solution of ammonia"]
  source: "chem_v3_u2_c17_pdf185_0704"
- term: neutralisation
  slug: neutralisation
  definition: "The reaction between an acid and a base (or alkali) in which hydrogen ions meet hydroxide ions to form water: H⁺(aq) + OH⁻(aq) → H₂O(l). A salt is the other product."
  ms_accepts: ["H⁺ + OH⁻ → H₂O as the ionic equation for all acid–alkali neutralisations", "acid + base → salt + water"]
  ms_avoids: ["giving the full equation when the ionic equation is asked for", "saying neutralisation always needs heating — acid/alkali reactions are instant"]
  aliases: ["neutralisation reaction", "neutralisation reactions"]
  source: "chem_v3_u2_c17_pdf186_0708"
- term: ionic equation
  slug: ionic-equation
  definition: "An equation showing only the ions that actually take part in a reaction, with spectator ions and unchanged species left out. State symbols are still required for the species shown."
  ms_accepts: ["equation with spectator ions omitted", "shows only reacting species with state symbols"]
  ms_avoids: ["including spectator ions in the final ionic equation", "dropping the state symbols — (aq) and (s) carry marks"]
  aliases: ["ionic equations"]
  source: "chem_v3_u2_c17_pdf184_0700"
- term: spectator ion
  slug: spectator-ion
  definition: "An ion present in a reaction mixture that is unchanged by it — it appears identically on both sides of the full equation and is omitted from the ionic equation."
  ms_accepts: ["ion not changed by the reaction", "same ion on both sides of the full equation; excluded from the ionic equation"]
  ms_avoids: ["calling spectators products or reactants", "striking out an ion that changes state or formula"]
  aliases: ["spectator ions"]
  source: "chem_v3_u2_c17_pdf184_0700"
- term: reactivity series
  slug: reactivity-series
  definition: "The ranking of metals by reactivity that predicts acid behaviour: metals above hydrogen react with dilute acids to give hydrogen, the higher the more vigorous; metals below hydrogen do not react."
  ms_accepts: ["position decides whether a metal reacts with dilute acid", "above hydrogen → salt + hydrogen; below → no reaction"]
  ms_avoids: ["mixing sodium or potassium with acid in a described method — far too violent", "saying copper reacts slowly with dilute acids"]
  aliases: ["reactivity series of metals"]
  source: "chem_v3_u2_c17_pdf183_0695"
- term: soluble
  slug: soluble
  definition: "Describes a substance that dissolves in water. Guaranteed soluble: all sodium, potassium and ammonium compounds, and all nitrates — the two rules that anchor every salt-preparation method."
  ms_accepts: ["dissolves in water", "all Na/K/NH₄ compounds and all nitrates are soluble"]
  ms_avoids: ["saying 'dissolves in anything' — the rules are about water", "forgetting that soluble reactants rule out the excess-solid method"]
  aliases: ["solubility"]
  source: "chem_v3_u2_c17_pdf187_0714"
- term: insoluble
  slug: insoluble
  definition: "Describes a substance that does not (appreciably) dissolve in water. Common carbonates and most hydroxides are insoluble; silver and lead(II) chlorides and barium, calcium and lead(II) sulfates are the key exceptions to otherwise soluble families."
  ms_accepts: ["does not dissolve in water (or dissolves only very slightly)", "chlorides except Ag/Pb(II); sulfates except Ba/Ca/Pb(II); most carbonates and hydroxides insoluble"]
  ms_avoids: ["claiming absolutely nothing dissolves — 'almost insoluble' substances leave a trace", "missing calcium hydroxide's slight solubility"]
  aliases: ["insolubility"]
  source: "chem_v3_u2_c17_pdf187_0714"
- term: excess
  slug: excess
  definition: "More than enough of a reactant to use the other one up. In salt preparations the insoluble reactant is added in excess; the visible leftover proves all the acid has reacted and is removed by filtration."
  ms_accepts: ["added in excess to ensure all the acid reacts", "leftover solid shows the acid has been neutralised"]
  ms_avoids: ["adding exactly equal amounts — you cannot judge it and unreacted acid ruins purity", "using 'excess' for the acid side in the excess-solid method"]
  aliases: ["excess solid", "in excess"]
  source: "chem_v3_u2_c17_pdf188_0717"
- term: filtration
  slug: filtration
  definition: "Separating an insoluble solid from a liquid by pouring through filter paper. Used twice in salt preparations: to remove excess solid before crystallising, and to collect precipitated or crystallised product."
  ms_accepts: ["residue stays on the paper; filtrate passes through", "separates insoluble solid from solution"]
  ms_avoids: ["filtering a true solution to remove dissolved salt — solutions pass straight through", "confusing residue (wanted solid on the paper) with filtrate"]
  aliases: ["filter", "filtering"]
  source: "chem_v3_u2_c17_pdf188_0717"
- term: titration
  slug: titration
  definition: "The technique for finding exactly what volumes of two solutions neutralise each other, using an indicator; the same volumes are then mixed again without the indicator to make the salt."
  ms_accepts: ["measure reacting volumes with an indicator, then repeat without it", "used when both reactants are solutions (Na/K/NH₄ salts)"]
  ms_avoids: ["leaving the indicator in the preparation — it would contaminate the product", "using the excess-solid method when both reactants dissolve"]
  aliases: ["titrations"]
  source: "chem_v3_u2_c17_pdf190_0725"
- term: endpoint
  slug: endpoint
  definition: "The point at which an indicator changes colour during a titration. Close to — but not identical with — exact neutralisation, because the pH swings so steeply that a single drop completes the change."
  ms_accepts: ["indicator colour-change point", "marks the neutralisation volume to within a drop"]
  ms_avoids: ["equating endpoint with exact neutrality", "using universal indicator to find an endpoint — no single sharp change"]
  aliases: ["end-point"]
  source: "chem_v3_u2_c17_pdf190_0724"
- term: methyl orange
  slug: methyl-orange
  definition: "Indicator that is red in acidic solutions and yellow in alkaline ones; between pH 3.1 and 4.4 it shows a red-yellow mixture (orange), which is the titration endpoint colour when acid is added to alkali."
  ms_accepts: ["red in acid, yellow in alkali, orange at the endpoint", "usable for titrations involving acid added to alkali"]
  ms_avoids: ["saying it gives a pH value — it sorts acid from alkali", "expecting the colour flip exactly at pH 7"]
  aliases: ["methyl orange indicator"]
  source: "chem_v3_u2_c17_pdf190_0724"
- term: water of crystallisation
  slug: water-of-crystallisation
  definition: "Water chemically bound into a salt's crystal lattice as the crystals form, written after a dot in the formula — CuSO₄·5H₂O carries five waters per formula unit."
  ms_accepts: ["water chemically bonded into the crystal structure", "shown as ·nH₂O in the formula"]
  ms_avoids: ["treating the waters as damp on the outside — they are part of the lattice", "copying n between different salts — each salt has its own number"]
  aliases: ["waters of crystallisation"]
  source: "chem_v3_u2_c17_pdf189_0720"
- term: hydrated
  slug: hydrated
  definition: "Describes a salt that contains water of crystallisation — the blue crystals of copper(II) sulfate pentahydrate, CuSO₄·5H₂O, are the chapter's example."
  ms_accepts: ["salt containing water of crystallisation", "CuSO₄·5H₂O is the hydrated form"]
  ms_avoids: ["spelling it 'hydrous'", "confusing hydrated salts with wet crystals — the water is chemically bound"]
  aliases: ["hydrated salt", "pentahydrate"]
  source: "chem_v3_u2_c17_pdf189_0720"
- term: anhydrous
  slug: anhydrous
  definition: "Describes a salt with no water of crystallisation — 'without water'. Evaporating a copper(II) sulfate solution to dryness gives white anhydrous CuSO₄ instead of blue hydrated crystals."
  ms_accepts: ["without water of crystallisation", "white CuSO₄ is the anhydrous form"]
  ms_avoids: ["using anhydrous to mean simply 'dry on the outside'", "heating hydrated crystals to dryness and still calling them the blue hydrated salt"]
  aliases: []
  source: "chem_v3_u2_c17_pdf189_0718"
- term: precipitation reaction
  slug: precipitation-reaction
  definition: "A reaction that produces a precipitate — for salt preparation, mixing two soluble salt solutions so the insoluble salt forms as a solid while the spectator ions stay dissolved."
  ms_accepts: ["reaction producing an insoluble solid from two solutions", "metal part as nitrate + non-metal part as Na/K salt"]
  ms_avoids: ["calling any gas-producing reaction a precipitation", "using an acid plus a carbonate and calling the fizz a precipitate"]
  aliases: ["precipitation reactions"]
  source: "chem_v3_u2_c17_pdf192_0731"
- term: precipitate
  slug: precipitate
  definition: "A solid formed by a chemical reaction involving liquids or gases; in insoluble-salt preparation it appears when two clear solutions are mixed — a fine white, yellow or coloured solid in the liquid."
  ms_accepts: ["insoluble solid formed on mixing solutions", "name and colour both required — e.g. white precipitate of silver chloride"]
  ms_avoids: ["omitting the colour when asked to describe observations", "thinking the solid was dissolved in one of the starting solutions"]
  aliases: ["precipitates"]
  source: "chem_v3_u2_c17_pdf192_0731"
- term: proton transfer
  slug: proton-transfer
  definition: "The acid–base model used at this level: an acid donates a proton (a hydrogen ion, H⁺) and a base accepts one. Reading reactions this way classifies species water cannot classify by its ions alone."
  ms_accepts: ["acid = proton donor, base = proton acceptor", "follow the H⁺: who gives it, who takes it"]
  ms_avoids: ["naming the theories when only the definitions are required", "saying a base must contain hydroxide — ammonia accepts protons without any"]
  aliases: ["proton donor", "proton acceptor"]
  source: "chem_v3_u2_c17_pdf195_0743"
- term: hydroxonium ion
  slug: hydroxonium-ion
  definition: "The H₃O⁺ ion formed when a water molecule accepts a proton from an acid; the ion usually written simply as H⁺(aq). Its formation bond is a dative covalent bond from the oxygen."
  ms_accepts: ["H₃O⁺ — water plus a proton", "what H⁺(aq) really means in solution"]
  ms_avoids: ["being unable to write H₃O⁺ when H⁺(aq) is accepted too", "thinking the name must be memorised — it need not be"]
  aliases: ["hydroxonium", "oxonium ion"]
  source: "chem_v3_u2_c17_pdf195_0742"
- term: dative covalent bond
  slug: dative-covalent-bond
  definition: "A covalent bond in which both shared electrons come from one atom — the O→H bond in H₃O⁺. Also called a co-ordinate bond; once formed it behaves exactly like any other covalent bond."
  ms_accepts: ["bond where both electrons in the shared pair come from one atom", "O donates its lone pair to H⁺ in H₃O⁺"]
  ms_avoids: ["drawing it with one electron from each atom", "treating it as weaker or different once formed"]
  aliases: ["co-ordinate covalent bond", "co-ordinate bond"]
  source: "chem_v3_u2_c17_pdf195_0741"
- term: Bronsted-Lowry theory
  slug: bronsted-lowry-theory
  definition: "The general acid–base theory defining an acid as a proton donor and a base as a proton acceptor; unlike the ion-in-water model, it applies beyond aqueous solution."
  ms_accepts: ["acid donates a proton, base accepts a proton", "applies to reactions outside aqueous solution"]
  ms_avoids: ["believing the theory name itself is examinable — it is not required", "confusing the donor/acceptor assignments in a given equation"]
  aliases: ["Bronsted-Lowry", "proton transfer theory"]
  source: "chem_v3_u2_c17_pdf195_0743"
