# glossary — u4:c24 Alkanes (ms layer: every entry needs ms_accepts; definition ≤40 words)
# All sources are chunkRefs into the parse of record (chunks_v3) — provenance law.
- term: alkane
  slug: alkane
  definition: "A saturated hydrocarbon whose molecules contain only carbon-carbon and carbon-hydrogen single bonds. The simplest homologous series, with general formula CnH2n+2."
  ms_accepts: ["saturated hydrocarbon", "only single bonds", "general formula CnH2n+2"]
  ms_avoids: ["calling them unsaturated", "omitting the single-bond condition", "saying they never react"]
  aliases: ["alkanes", "the alkane family"]
  source: "chem_v3_u4_c24_pdf286_1079"
- term: hydrocarbon
  slug: hydrocarbon
  definition: "A compound that contains carbon and hydrogen only. The word only is load-bearing: a third element such as oxygen disqualifies the compound."
  ms_accepts: ["compound of carbon and hydrogen only", "contains no other elements", "made of just carbon and hydrogen"]
  ms_avoids: ["omitting the exclusivity word only", "calling carbon dioxide a hydrocarbon", "saying contains carbon and hydrogen without exclusivity"]
  aliases: ["hydrocarbons"]
  source: "chem_v3_u4_c24_pdf286_1081"
- term: saturated hydrocarbon
  slug: saturated-hydrocarbon
  definition: "A hydrocarbon with only single bonds between its atoms — no double (C=C) or triple (C≡C) bonds anywhere in the molecule. Alkanes are the saturated family."
  ms_accepts: ["contains only single bonds", "no C=C or C≡C double or triple bonds", "maximum hydrogen for the carbon count"]
  ms_avoids: ["saying full of hydrogen instead of bonding language", "confusing saturation with low reactivity meaning no reactions", "omitting the no-double-bond clause"]
  aliases: ["saturated"]
  source: "chem_v3_u4_c24_pdf286_1081"
- term: general formula
  slug: general-formula
  definition: "One algebraic expression that gives the molecular formula of every member of a homologous series. For alkanes it is CnH2n+2: n carbons carry 2n + 2 hydrogens."
  ms_accepts: ["CnH2n+2 for alkanes", "one formula describing all family members", "hydrogens equal twice the carbons plus two"]
  ms_avoids: ["calling it an empirical formula", "mixing up n with a fixed atom count", "applying CnH2n+2 to alkenes"]
  aliases: ["CnH2n+2"]
  source: "chem_v3_u4_c24_pdf287_1086"
- term: homologous series
  slug: homologous-series
  definition: "A series of compounds with the same functional group, similar chemical properties, a trend (gradation) in physical properties, one general formula, and consecutive members differing by a -CH2- unit."
  ms_accepts: ["same functional group", "similar chemical properties because same functional group", "members differ by CH2 units"]
  ms_avoids: ["listing the bullets as unrelated facts", "omitting the functional-group clause", "confusing the series with a periodic-table group"]
  aliases: ["homologous series of compounds"]
  source: "chem_v3_u4_c24_pdf287_1086"
- term: functional group
  slug: functional-group
  definition: "The atom or bond arrangement that gives an organic family its characteristic reactions. Alkanes have no reactive group beyond their C-C and C-H single-bond skeleton."
  ms_accepts: ["the reactive part of the molecule", "determines the family's chemical properties", "alkanes lack one beyond the single-bond skeleton"]
  ms_avoids: ["saying alkanes have a C=C functional group", "omitting that it dictates reactions", "confusing it with the whole molecule"]
  aliases: ["functional groups"]
  source: "chem_v3_u4_c24_pdf287_1086"
- term: isomer
  slug: isomer
  definition: "A compound with the same molecular formula as another compound but a different structural formula. Butane and pentane have branched-chain isomers; methane, ethane and propane have none."
  ms_accepts: ["same molecular formula different structural formula", "same atoms arranged differently", "butane has a branched isomer"]
  ms_avoids: ["saying different molecular formulae", "calling two rotated drawings isomers", "omitting the same-formula half"]
  aliases: ["isomers", "isomerism"]
  source: "chem_v3_u4_c24_pdf287_1085"
- term: molecular formula
  slug: molecular-formula
  definition: "A formula that counts the atoms of each element in one molecule — C3H8 says 3 carbons and 8 hydrogens — without showing how they are joined."
  ms_accepts: ["counts atoms of each element", "C3H8 for propane", "shows what but not how joined"]
  ms_avoids: ["confusing it with the displayed formula", "omitting subscript counts", "saying it shows bond order"]
  aliases: ["formula"]
  source: "chem_v3_u4_c24_pdf286_1082"
- term: structural formula
  slug: structural-formula
  definition: "A formula that shows the order in which atoms are joined along the chain — CH3CH2CH3 for propane — without drawing every bond as a line."
  ms_accepts: ["shows atom order in the chain", "CH3CH2CH3 for propane", "chain order without full bond drawing"]
  ms_avoids: ["confusing it with the molecular formula", "omitting the CH3 group notation", "saying it shows every bond as a line"]
  aliases: ["condensed structural formula"]
  source: "chem_v3_u4_c24_pdf286_1082"
- term: displayed formula
  slug: displayed-formula
  definition: "A drawing that shows every atom and every covalent bond as an explicit line, including all hydrogen atoms. Each carbon shows exactly four bonds."
  ms_accepts: ["every atom and every bond drawn", "all C-H bonds shown as lines", "four bonds per carbon visible"]
  ms_avoids: ["omitting hydrogen atoms", "leaving a carbon with fewer or more than four bonds", "confusing it with the structural formula"]
  aliases: ["full structural formula", "displayed structural formula"]
  source: "chem_v3_u4_c24_pdf286_1082"
- term: unbranched chain
  slug: unbranched-chain
  definition: "A carbon chain in which every carbon sits at an end or in the running line of the chain, with no carbon attached to the middle of another. Also called a straight chain."
  ms_accepts: ["no carbon branches off the middle", "all carbons in one continuous line", "straight-chain arrangement"]
  ms_avoids: ["saying the chain is literally straight", "confusing with branched isomers", "omitting the middle-carbon-attachment test"]
  aliases: ["straight chain", "straight-chain alkane"]
  source: "chem_v3_u4_c24_pdf287_1085"
- term: boiling point
  slug: boiling-point
  definition: "The temperature at which a liquid's vapour pressure equals atmospheric pressure and the liquid boils. For alkanes it rises regularly as molecule size increases."
  ms_accepts: ["temperature at which a liquid boils", "increases with molecule size for alkanes", "regular gradation across the series"]
  ms_avoids: ["saying bonds break during boiling", "omitting the size trend", "confusing with melting point"]
  aliases: ["boiling temperature"]
  source: "chem_v3_u4_c24_pdf288_1088"
- term: intermolecular forces
  slug: intermolecular-forces
  definition: "Forces of attraction between neighbouring molecules. They strengthen as alkane molecules get bigger, which is why larger members boil higher and solids appear at about C18H38."
  ms_accepts: ["attractions between molecules", "stronger in larger molecules", "more energy needed to overcome them"]
  ms_avoids: ["confusing them with covalent bonds inside molecules", "saying covalent bonds break on boiling", "omitting the between-molecules scope"]
  aliases: ["forces of attraction between molecules"]
  source: "chem_v3_u4_c24_pdf288_1088"
- term: complete combustion
  slug: complete-combustion
  definition: "Burning in a plentiful supply of oxygen, giving carbon dioxide and water only — for example CH4 + 2O2 giving CO2 + 2H2O."
  ms_accepts: ["plenty of oxygen", "products carbon dioxide and water", "hydrogen always ends as water"]
  ms_avoids: ["listing carbon monoxide as a complete-combustion product", "omitting the oxygen condition", "forgetting the water product"]
  aliases: ["complete burning"]
  source: "chem_v3_u4_c24_pdf288_1090"
- term: incomplete combustion
  slug: incomplete-combustion
  definition: "Burning when oxygen is insufficient: carbon monoxide and/or carbon (soot) form instead of some or all of the carbon dioxide, with water still produced."
  ms_accepts: ["limited oxygen supply", "carbon monoxide or soot formed", "water still obtained"]
  ms_avoids: ["saying water is not formed", "omitting the limited-oxygen condition", "confusing with complete combustion products"]
  aliases: ["incomplete burning"]
  source: "chem_v3_u4_c24_pdf288_1090"
- term: carbon monoxide
  slug: carbon-monoxide
  definition: "A colourless, odourless, toxic gas (CO) formed in incomplete combustion. It reduces the blood's capacity to carry oxygen, which is why it is dangerous to humans."
  ms_accepts: ["colourless and odourless", "toxic", "reduces blood's oxygen-carrying capacity"]
  ms_avoids: ["confusing with carbon dioxide", "saying it smells or is visible", "omitting the blood-oxygen mechanism"]
  aliases: ["CO"]
  source: "chem_v3_u4_c24_pdf288_1090"
- term: soot
  slug: soot
  definition: "Carbon in the form of black particles, deposited when a hydrocarbon burns in severely insufficient oxygen — the carbon that never reached any oxide."
  ms_accepts: ["carbon formed in very limited oxygen", "black deposit", "appears when oxygen is most scarce"]
  ms_avoids: ["confusing with carbon monoxide", "saying soot is an oxide", "omitting the severe-oxygen-shortage condition"]
  aliases: ["carbon (soot)"]
  source: "chem_v3_u4_c24_pdf288_1090"
- term: substitution reaction
  slug: substitution-reaction
  definition: "A reaction in which one atom (or group) is replaced by another. Alkanes undergo substitution with halogens in the presence of ultraviolet radiation."
  ms_accepts: ["one atom replaced by another", "halogen replaces a hydrogen atom", "requires UV light for alkanes"]
  ms_avoids: ["calling it addition", "omitting the UV condition", "saying two atoms are replaced"]
  aliases: ["substitution"]
  source: "chem_v3_u4_c24_pdf289_1092"
- term: ultraviolet radiation
  slug: ultraviolet-radiation
  definition: "The electromagnetic radiation (UV light) that supplies the energy alkanes' halogen substitution needs — sunlight is the everyday source. Without it the halogen stays as molecules."
  ms_accepts: ["UV light condition", "sunlight as the example source", "provides energy to split halogen molecules"]
  ms_avoids: ["substituting heat or a catalyst as the condition", "omitting the condition entirely", "confusing with visible light"]
  aliases: ["UV light", "ultraviolet light"]
  source: "chem_v3_u4_c24_pdf289_1092"
- term: halogenoalkane
  slug: halogenoalkane
  definition: "A substitution product of an alkane and a halogen, named in the format x-haloalkane, where x gives the position of the halogen atom on the longest carbon chain — for example 1-bromopropane and 2-bromopropane."
  ms_accepts: ["alkane with a halogen atom replacing a hydrogen", "named x-haloalkane by position", "1- and 2-bromopropane example"]
  ms_avoids: ["omitting the position number", "calling it a halogenated addition product", "confusing with halogens themselves"]
  aliases: ["haloalkane", "x-haloalkane"]
  source: "chem_v3_u4_c24_pdf289_1093"
- term: mono-substitution
  slug: mono-substitution
  definition: "Substitution in which only one hydrogen atom of the alkane is replaced by a halogen atom. Even mono-substitution of propane yields two isomeric products."
  ms_accepts: ["only one hydrogen replaced", "one halogen per molecule", "propane gives two isomeric monosubstitution products"]
  ms_avoids: ["saying it means one product only", "confusing with multi-substitution", "omitting the isomer possibility"]
  aliases: ["monosubstitution"]
  source: "chem_v3_u4_c24_pdf289_1093"
- term: free radical
  slug: free-radical
  definition: "An atom or species with an unpaired electron, formed when UV light splits a halogen molecule. Free radicals are very reactive and attack the otherwise unreactive alkanes."
  ms_accepts: ["unpaired electron species", "formed when UV splits halogen molecules", "very reactive"]
  ms_avoids: ["confusing with ions", "saying free electrons (delocalised electrons is the bonding term)", "omitting the UV formation step"]
  aliases: ["radicals"]
  source: "chem_v3_u4_c24_pdf289_1093"
- term: natural gas
  slug: natural-gas
  definition: "The gaseous fossil fuel whose major component is methane, with smaller quantities of ethane and propane. Burned for heating and cooking."
  ms_accepts: ["methane is the major component", "contains ethane and propane in small quantities", "gaseous fuel"]
  ms_avoids: ["saying it is pure methane", "confusing with LPG", "omitting the methane majority"]
  aliases: ["fossil gas"]
  source: "chem_v3_u4_c24_pdf286_1081"
- term: liquefied petroleum gas
  slug: liquefied-petroleum-gas
  definition: "LPG: a fuel mixture of propane and other small alkanes, stored as liquid under pressure, obtained as a constituent of crude oil distillation."
  ms_accepts: ["propane-based stored fuel", "from crude oil distillation", "liquefied under pressure"]
  ms_avoids: ["confusing with natural gas", "saying it contains methane as major component", "omitting the distillation source"]
  aliases: ["LPG"]
  source: "chem_v3_u4_c24_pdf286_1081"
