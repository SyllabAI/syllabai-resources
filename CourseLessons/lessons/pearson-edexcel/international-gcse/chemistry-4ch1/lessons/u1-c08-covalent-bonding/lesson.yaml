learning_objective: 'Know that a covalent bond is formed between atoms by the sharing of a pair of electrons; Understand
  covalent bonds in terms of electrostatic attractions; Understand how to use dot-and-cross diagrams to represent
  covalent bonds in: diatomic molecules, including hydrogen, oxygen, nitrogen, halogens and hydrogen halides; inorganic
  molecules, including water, ammonia and carbon dioxide; organic molecules containing up to two carbon atoms, including
  methane, ethane, ethene and those containing halogen atoms; Explain why substances with a simple molecular structure
  are gases or liquids, or solids with low melting and boiling points; Understand that the term intermolecular forces
  of attraction can be used to represent all forces between molecules; Explain why the melting and boiling points
  of substances with simple molecular structures increase, in general, with increasing relative molecular mass;
  Explain why substances with giant covalent structures are solids with high melting and boiling points; Explain
  how the structures of diamond, graphite and C₆₀ fullerene influence their physical properties, including electrical
  conductivity and hardness; Know that covalent compounds do not usually conduct electricity'
