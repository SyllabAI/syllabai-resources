# glossary — u1:c08 (ms layer: every entry needs ms_accepts; definition ≤40 words)
# All sources are chunkRefs into the parse of record (chunks_v3) — provenance law.
- term: covalent bond
  slug: covalent-bond
  definition: "A bond formed between two atoms when the two atoms share a pair of electrons. The shared pair is attracted to the nucleus of both atoms."
  ms_accepts: ["a shared pair of electrons between two atoms", "bond formed by sharing one or more pairs of electrons"]
  ms_avoids: ["electrons transferred between atoms", "a bond between two ions", "sharing of protons"]
  aliases: ["shared pair of electrons"]
  source: "chem_v3_u1_c8_pdf094_0350"
- term: electrostatic attraction
  slug: electrostatic-attraction
  definition: "The attraction between opposite charges. In a covalent bond it is the attraction between the shared pair of electrons (negative) and the nuclei (positive) of both bonded atoms."
  ms_accepts: ["attraction between the shared electron pair and both nuclei", "opposite charges attract"]
  ms_avoids: ["attraction between two electrons", "a force between molecules only"]
  aliases: ["electrostatic force"]
  source: "chem_v3_u1_c8_pdf094_0350"
- term: molecule
  slug: molecule
  definition: "A group of a fixed number of atoms joined together by covalent bonds — from two atoms (diatomic) up to many thousands (proteins, DNA)."
  ms_accepts: ["a fixed number of atoms joined by covalent bonds", "two or more atoms chemically bonded together by sharing electrons"]
  ms_avoids: ["any group of atoms", "a giant array of ions", "an atom of a compound"]
  aliases: []
  source: "chem_v3_u1_c8_pdf095_0354"
- term: diatomic
  slug: diatomic
  definition: "Made of molecules that each contain exactly two atoms — H₂, Cl₂, O₂, N₂, HCl, CO."
  ms_accepts: ["molecules containing two atoms", "two atoms per molecule"]
  ms_avoids: ["two elements present", "two bonds in the molecule"]
  aliases: ["diatomic molecule"]
  source: "chem_v3_u1_c8_pdf096_0359"
- term: dot-and-cross diagram
  slug: dot-and-cross-diagram
  definition: "A diagram of covalent bonding showing outer-shell electrons only, with one atom's electrons drawn as dots and the other atom's as crosses to show where each electron came from."
  ms_accepts: ["outer shell electrons only", "dots and crosses show the origin of each electron", "shared pairs drawn between the two atoms"]
  ms_avoids: ["all shells drawn unless asked", "different-coloured electrons in reality", "arrows for electron transfer"]
  aliases: ["dot and cross"]
  source: "chem_v3_u1_c8_pdf095_0354"
- term: isoelectronic
  slug: isoelectronic
  definition: "Having the same number of electrons. In covalent bonding, atoms end up isoelectronic with a noble gas: hydrogen with 2 outer electrons, other atoms with 8."
  ms_accepts: ["same number of electrons as a noble gas atom", "same electron count as helium or another noble gas"]
  ms_avoids: ["same number of neutrons", "the atom has become a noble gas"]
  aliases: []
  source: "chem_v3_u1_c8_pdf095_0353"
- term: lone pair
  slug: lone-pair
  definition: "A pair of electrons in the outer shell of an atom in a molecule that is not involved in covalent bonding. Water's oxygen carries two lone pairs."
  ms_accepts: ["pair of outer-shell electrons not used in bonding", "electron pair that does not form a covalent bond"]
  ms_avoids: ["electrons shared between two atoms", "electrons that have been lost"]
  aliases: ["non-bonding pair"]
  source: "chem_v3_u1_c8_pdf098_0364"
- term: double bond
  slug: double-bond
  definition: "A covalent bond made of two shared pairs of electrons — four electrons shared between the two bonded atoms, for example O₂ and CO₂."
  ms_accepts: ["two shared pairs of electrons", "four shared electrons between two atoms"]
  ms_avoids: ["two separate single bonds side by side", "a bond that is twice as long"]
  aliases: ["double covalent bond"]
  source: "chem_v3_u1_c8_pdf098_0366"
- term: triple bond
  slug: triple-bond
  definition: "A covalent bond made of three shared pairs of electrons — six shared electrons between the two bonded atoms, for example N₂."
  ms_accepts: ["three shared pairs of electrons", "six shared electrons between two atoms"]
  ms_avoids: ["three separate single bonds", "a bond made of three molecules"]
  aliases: ["triple covalent bond"]
  source: "chem_v3_u1_c8_pdf099_0368"
- term: tetrahedral
  slug: tetrahedral
  definition: "Shaped like a tetrahedron — a triangular-based pyramid — with one atom at the centre and four atoms at the corners, as in methane. Electron pairs spread as far apart as possible."
  ms_accepts: ["four electron pairs arranged as far apart as possible", "triangular-based pyramid arrangement, bond angle 109.5°"]
  ms_avoids: ["a flat square arrangement", "the atoms are at 90° to each other"]
  aliases: ["tetrahedron"]
  source: "chem_v3_u1_c8_pdf097_0362"
- term: polar
  slug: polar
  definition: "Having a slightly positive end and a slightly negative end. Water is polar because the shared electrons are attracted more strongly towards the oxygen atom."
  ms_accepts: ["has a δ− and a δ+ end", "unequal sharing of the electron pair"]
  ms_avoids: ["the molecule is fully charged", "the molecule is an ion"]
  aliases: ["polarity"]
  source: "chem_v3_u1_c8_pdf098_0364"
- term: intermolecular forces
  slug: intermolecular-forces
  definition: "The weak forces of attraction between molecules — literally 'between molecules'. They are broken — not the covalent bonds — when a molecular substance melts or boils."
  ms_accepts: ["weak forces between molecules", "broken when a simple molecular substance melts or boils"]
  ms_avoids: ["bonds within molecules", "covalent bonds between molecules", "strong bonds"]
  aliases: ["intermolecular forces of attraction"]
  source: "chem_v3_u1_c8_pdf101_0374"
- term: simple molecular structure
  slug: simple-molecular-structure
  definition: "A structure made of separate molecules with weak intermolecular forces between them. Substances with this structure are gases, liquids or low-melting solids and usually do not conduct electricity."
  ms_accepts: ["molecules with weak forces between them", "low melting and boiling points because intermolecular forces are broken"]
  ms_avoids: ["a structure of one giant molecule", "molecules held by strong covalent bonds between them"]
  aliases: ["simple molecular", "covalent molecular structure"]
  source: "chem_v3_u1_c8_pdf101_0374"
- term: giant covalent structure
  slug: giant-covalent-structure
  definition: "A structure in which atoms are joined by strong covalent bonds continuously in three dimensions — not a molecule, because the number of atoms varies with the size of the crystal. Diamond, graphite and silicon dioxide."
  ms_accepts: ["millions of atoms joined by strong covalent bonds", "regular 3D network of covalent bonds", "high melting point because covalent bonds must be broken"]
  ms_avoids: ["a giant molecule", "held together by intermolecular forces"]
  aliases: ["giant covalent lattice", "network solid"]
  source: "chem_v3_u1_c8_pdf102_0382"
- term: delocalised electron
  slug: delocalised-electron
  definition: "An outer-shell electron that is not fixed in a covalent bond and can move freely through a structure. Graphite's fourth electron per carbon is delocalised within each layer."
  ms_accepts: ["electrons free to move through the structure", "not tied to any one bond — carry charge through the layer"]
  ms_avoids: ["free electrons (say delocalised)", "electrons that have left their shells permanently"]
  aliases: ["delocalised electrons"]
  source: "chem_v3_u1_c8_pdf104_0387"
- term: allotrope
  slug: allotrope
  definition: "One of two or more different forms of the same element in the same physical state. Diamond, graphite and C₆₀ fullerene are all allotropes of carbon."
  ms_accepts: ["different structural forms of the same element", "same element, different arrangement of atoms"]
  ms_avoids: ["different compounds of the same element", "different isotopes"]
  aliases: ["allotropes"]
  source: "chem_v3_u1_c8_pdf104_0388"
