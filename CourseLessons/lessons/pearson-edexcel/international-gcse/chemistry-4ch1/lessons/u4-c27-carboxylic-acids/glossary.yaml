# glossary — u4:c27 Carboxylic acids (ms layer: every entry needs ms_accepts; definition ≤40 words)
# All sources are chunkRefs into the parse of record (chunks_v3) — provenance law.
# Equations print-verified at 300 dpi (f-0026/f-0028 gates); "-CoOH" l/I garble repaired to -COOH.
- term: carboxylic acid
  slug: carboxylic-acid
  definition: "An organic compound whose molecules carry the carboxyl group -COOH on an end carbon. A homologous series of weak acids formed by oxidising alcohols."
  ms_accepts: ["contains the -COOH functional group", "weak organic acid from alcohol oxidation", "homologous series with the carboxyl group"]
  ms_avoids: ["calling -OH the carboxylic-acid group", "omitting the end-carbon position", "treating 'carboxylic acid' as one substance"]
  aliases: ["carboxylic acids", "the carboxylic acid family"]
  source: "chem_v3_u4_c27_pdf302_1143"
- term: functional group
  slug: functional-group
  definition: "The atom or bond arrangement that gives an organic family its characteristic reactions. For the carboxylic acids it is -COOH; for the alcohols it was -OH."
  ms_accepts: ["the reactive arrangement determining chemical properties", "-COOH for carboxylic acids", "carboxyl group"]
  ms_avoids: ["omitting that it dictates reactions", "giving -OH as the acid family's group"]
  aliases: ["functional groups"]
  source: "chem_v3_u4_c27_pdf302_1143"
- term: carboxyl group
  slug: carboxyl-group
  definition: "The -COOH arrangement: a carbonyl C=O and a hydroxyl O-H sharing the same end carbon atom. Always terminal, which is why no locant appears in acid names."
  ms_accepts: ["C=O and O-H on the same carbon", "written -COOH", "always at the end of the chain"]
  ms_avoids: ["drawing only one of the two bonds", "placing the group mid-chain"]
  aliases: ["-COOH", "carboxyl"]
  source: "chem_v3_u4_c27_pdf302_1143"
- term: ethanoic acid
  slug: ethanoic-acid
  definition: "The carboxylic acid CH3COOH (C2H4O2): vinegar's acid, the family's representative, and the oxidation product of ethanol."
  ms_accepts: ["CH3COOH", "C2H4O2", "the acid in vinegar properly called ethanoic acid"]
  ms_avoids: ["calling it 'acetic' only when the systematic name is asked", "writing C2H6O (the alcohol formula)"]
  aliases: ["acetic acid"]
  source: "chem_v3_u4_c27_pdf302_1143"
- term: vinegar
  slug: vinegar
  definition: "An aqueous solution containing ethanoic acid — the everyday representative of the carboxylic acid family, sour to taste and below pH 7."
  ms_accepts: ["aqueous solution of ethanoic acid", "ethanoic acid dissolved in water", "a dilute solution of ethanoic acid"]
  ms_avoids: ["calling vinegar a pure compound", "saying vinegar is ethanol or a different acid"]
  aliases: []
  source: "chem_v3_u4_c27_pdf302_1143"
- term: methanoic acid
  slug: methanoic-acid
  definition: "The one-carbon carboxylic acid HCOOH (CH2O2): the family's smallest member, carried in nettle stings."
  ms_accepts: ["HCOOH", "CH2O2", "one-carbon carboxylic acid"]
  ms_avoids: ["counting zero carbons (the carboxyl carbon is the one carbon)", "writing CH3OOH"]
  aliases: ["formic acid"]
  source: "chem_v3_u4_c27_pdf303_1148"
- term: propanoic acid
  slug: propanoic-acid
  definition: "The three-carbon carboxylic acid CH3CH2COOH (C3H6O2): 'prop' counts the two chain carbons plus the carboxyl carbon."
  ms_accepts: ["CH3CH2COOH", "C3H6O2", "three carbons in total"]
  ms_avoids: ["counting only the CH3CH2- part (two carbons)", "adding a locant number to the name"]
  aliases: ["propionic acid"]
  source: "chem_v3_u4_c27_pdf303_1145"
- term: butanoic acid
  slug: butanoic-acid
  definition: "The four-carbon carboxylic acid CH3CH2CH2COOH (C4H8O2): the largest member the specification requires."
  ms_accepts: ["CH3CH2CH2COOH", "C4H8O2", "four carbons in total"]
  ms_avoids: ["drawing a three-carbon chain", "confusing with but-1-ene or butanol"]
  aliases: ["butyric acid"]
  source: "chem_v3_u4_c27_pdf303_1148"
- term: molecular formula
  slug: molecular-formula
  definition: "A formula counting the atoms of each element in one molecule — C2H4O2 for ethanoic acid — without showing how they are joined."
  ms_accepts: ["counts atoms of each element", "C2H4O2 for ethanoic acid", "shows what but not how joined"]
  ms_avoids: ["confusing with the displayed formula", "omitting the second oxygen of the acid family"]
  aliases: ["formula"]
  source: "chem_v3_u4_c27_pdf303_1148"
- term: structural formula
  slug: structural-formula
  definition: "A condensed formula showing the order of atoms unambiguously — CH3CH2COOH — without drawing every bond."
  ms_accepts: ["shows atom order in condensed form", "CH3CH2COOH for propanoic acid", "unambiguous but not fully drawn"]
  ms_avoids: ["confusing with molecular formula", "drawing all bonds when condensed form is asked"]
  aliases: ["condensed formula"]
  source: "chem_v3_u4_c27_pdf303_1148"
- term: displayed formula
  slug: displayed-formula
  definition: "A drawing showing every atom and every bond as an explicit line. For carboxylic acids the COOH end must show both the C=O and the O-H."
  ms_accepts: ["all atoms and bonds drawn", "the C=O and O-H of COOH both explicit", "every carbon shows four bonds"]
  ms_avoids: ["writing the condensed COOH when a display is asked", "omitting the C=O double bond"]
  aliases: ["displayed structural formula", "full displayed formula"]
  source: "chem_v3_u4_c27_pdf303_1144"
- term: homologous series
  slug: homologous-series
  definition: "A family of compounds with the same functional group, similar chemical properties, and consecutive members differing by a -CH2- unit — here the carboxylic acids."
  ms_accepts: ["same functional group", "similar chemical properties", "members differ by CH2 units"]
  ms_avoids: ["confusing with a periodic-table group", "omitting the functional-group thread"]
  aliases: ["homologous series of compounds"]
  source: "chem_v3_u4_c27_pdf303_1146"
- term: weak acid
  slug: weak-acid
  definition: "An acid that dissociates only partially in water — ethanoic acid ionises about 1 molecule in 75 — giving fewer H+ ions and slower reactions than strong acids at equal concentration."
  ms_accepts: ["partially dissociated in water", "only some molecules ionise", "lower H+ concentration than a strong acid at the same concentration"]
  ms_avoids: ["defining weak as dilute", "saying weak acids do not react"]
  aliases: ["weakly ionised"]
  source: "chem_v3_u4_c27_pdf303_1150"
- term: strong acid
  slug: strong-acid
  definition: "An acid that dissociates completely into ions in water — hydrochloric or sulfuric acid — so its solution holds mostly ions and hardly any intact molecules."
  ms_accepts: ["completely dissociated into ions", "mostly H+ and anions in solution", "hydrochloric and sulfuric acids"]
  ms_avoids: ["equating strong with concentrated", "omitting the completeness of ionisation"]
  aliases: ["fully dissociated acid"]
  source: "chem_v3_u4_c27_pdf304_1153"
- term: dissociation
  slug: dissociation
  definition: "The splitting of an acid molecule into ions when it dissolves in water. Complete for strong acids, partial for weak ones — the measure behind the strength label."
  ms_accepts: ["splitting into ions in water", "complete for strong acids, partial for weak", "produces H+ ions and the anion"]
  ms_avoids: ["confusing with dissolving", "omitting the ion products"]
  aliases: ["ionisation", "ionise"]
  source: "chem_v3_u4_c27_pdf304_1153"
- term: concentrated acid
  slug: concentrated-acid
  definition: "A solution holding a large amount of acid per unit volume — a concentration statement, independent of whether the acid is strong or weak."
  ms_accepts: ["large amount of acid per volume", "independent of strength", "dilute means the opposite"]
  ms_avoids: ["equating concentrated with strong", "confusing with dissociation"]
  aliases: ["concentration"]
  source: "chem_v3_u4_c27_pdf304_1153"
- term: salt
  slug: salt
  definition: "The ionic compound formed when an acid's H+ is replaced by a metal ion — here a metal ethanoate, built from the metal cation and the ethanoate anion."
  ms_accepts: ["ionic compound from acid plus metal or carbonate", "metal cation plus ethanoate anion", "formed with hydrogen gas from metals or CO2 from carbonates"]
  ms_avoids: ["calling CO2 part of the salt", "writing the salt formula without charge balancing"]
  aliases: ["salts", "metal ethanoate"]
  source: "chem_v3_u4_c27_pdf303_1150"
- term: ethanoate ion
  slug: ethanoate-ion
  definition: "The singly-charged negative ion CH3COO-, the carboxylic-acid molecule with its acidic hydrogen removed; the anion of every ethanoate salt."
  ms_accepts: ["CH3COO-", "single negative charge", "the anion in metal ethanoates"]
  ms_avoids: ["writing CH3COO with no charge", "giving it a 2- charge (two ions balance Mg2+)"]
  aliases: ["acetate ion", "ethanoate"]
  source: "chem_v3_u4_c27_pdf304_1151"
- term: ionic compound
  slug: ionic-compound
  definition: "A compound of oppositely charged ions held by electrostatic attraction — magnesium ethanoate holds Mg2+ attracted to the negative oxygens of two ethanoate ions."
  ms_accepts: ["positive and negative ions attracted together", "charge balance sets the formula", "metal ethanoates are ionic"]
  ms_avoids: ["treating the salt as covalent molecules", "ignoring the charge arithmetic"]
  aliases: ["ionic salt"]
  source: "chem_v3_u4_c27_pdf304_1151"
- term: reactivity series
  slug: reactivity-series
  definition: "The ranking of metals by reactivity. Metals above hydrogen react with acids giving salt plus hydrogen; metals below hydrogen — copper, silver — do not react."
  ms_accepts: ["metals above hydrogen react with acids", "below hydrogen no reaction", "orders sodium above zinc above hydrogen above copper"]
  ms_avoids: ["saying all metals react with acids", "omitting the hydrogen reference line"]
  aliases: ["reactivity series of metals"]
  source: "chem_v3_u4_c27_pdf304_1152"
- term: metal carbonate
  slug: metal-carbonate
  definition: "An ionic compound bearing the doubly-charged carbonate ion CO32-. Reacts with acids to give a salt, carbon dioxide and water."
  ms_accepts: ["contains CO3 2-", "acid + carbonate gives salt + CO2 + water", "needs two protons per carbonate ion"]
  ms_avoids: ["omitting the carbon dioxide product", "balancing with one acid molecule per carbonate"]
  aliases: ["carbonate", "carbonates"]
  source: "chem_v3_u4_c27_pdf304_1153"
