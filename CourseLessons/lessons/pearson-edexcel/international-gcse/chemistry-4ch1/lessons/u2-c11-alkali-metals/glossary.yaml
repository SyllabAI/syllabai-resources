# glossary — u2:c11 (ms layer: every entry needs ms_accepts; definition ≤40 words)
# All sources are chunkRefs into the parse of record (chunks_v3) — provenance law.
- term: alkali metal
  slug: alkali-metal
  definition: "One of the Group 1 metals (lithium, sodium, potassium, rubidium, caesium, francium) — soft, low-density metals that react with water to give strongly alkaline hydroxide solutions."
  ms_accepts: ["a Group 1 metal that reacts with water forming an alkaline hydroxide solution and hydrogen", "soft reactive metal stored under oil"]
  ms_avoids: ["any metal in Group 2 or the transition block", "metals that simply do not react with water"]
  aliases: ["alkali metals"]
  source: "chem_v3_u2_c11_pdf133_0467"
- term: electronic configuration
  slug: electronic-configuration
  definition: "The arrangement of an atom's electrons among its shells, written as numbers per shell — e.g. sodium 2,8,1. The outermost number controls the atom's chemistry."
  ms_accepts: ["the number of electrons in each shell (e.g. 2,8,1)", "how electrons are arranged in shells around the nucleus"]
  ms_avoids: ["just the total number of electrons", "a diagram of protons and neutrons"]
  aliases: ["electron configuration", "configurations"]
  source: "chem_v3_u2_c11_pdf134_0470"
- term: hydroxide
  slug: hydroxide
  definition: "A negative ion, OH⁻, carrying a 1− charge. Alkali metals form hydroxides with the formula MOH, whose aqueous solutions are strongly alkaline."
  ms_accepts: ["OH⁻ ion; metal compounds with formula MOH giving alkaline solutions", "the ion made of one oxygen and one hydrogen with a 1− charge"]
  ms_avoids: ["calling it a negative metal ion", "confusing it with water H₂O or oxide O²⁻"]
  aliases: ["hydroxides", "OH⁻", "metal hydroxide"]
  source: "chem_v3_u2_c11_pdf134_0471"
- term: oxide
  slug: oxide
  definition: "A compound of a metal with oxygen. Alkali metals react with oxygen in the air to form oxide coatings such as M₂O."
  ms_accepts: ["a compound of the metal with oxygen (e.g. Na₂O)", "the coating formed when an alkali metal reacts with air"]
  ms_avoids: ["the oxide as a positive ion", "confusing with hydroxide (which contains hydrogen as well)"]
  aliases: ["oxides", "metal oxide"]
  source: "chem_v3_u2_c11_pdf133_0467"
- term: halogen
  slug: halogen
  definition: "A Group 7 non-metal (fluorine, chlorine, bromine, iodine), written X in family equations. Alkali metals react with halogens to form salts with the formula MX."
  ms_accepts: ["a Group 7 element; reacts with an alkali metal to give an ionic salt MX"]
  ms_avoids: ["placing halogens in Group 1", "saying halogens are metals"]
  aliases: ["halogens"]
  source: "chem_v3_u2_c11_pdf134_0469"
- term: ion
  slug: ion
  definition: "A charged particle formed when an atom gains or loses electrons. Group 1 atoms lose their single outer electron to form 1+ ions (M⁺), which are colourless."
  ms_accepts: ["an atom that has lost or gained electrons so it carries a charge", "Group 1 metals form 1+ ions by losing the outer electron"]
  ms_avoids: ["an atom changing its proton count", "ions formed by sharing electrons"]
  aliases: ["ions", "M⁺", "cation"]
  source: "chem_v3_u2_c11_pdf136_0486"
- term: alkaline
  slug: alkaline
  definition: "Having a pH greater than 7 — the property of a solution of a soluble base (an alkali). Alkali metal hydroxide solutions are strongly alkaline."
  ms_accepts: ["pH above 7; turns universal indicator blue/purple", "the solution contains hydroxide ions and is a strong base"]
  ms_avoids: ["describing the metal itself as alkaline", "confusing alkaline with acidic (pH below 7)"]
  aliases: ["alkali", "strongly alkaline"]
  source: "chem_v3_u2_c11_pdf133_0467"
- term: tarnish
  slug: tarnish
  definition: "To lose shininess because the fresh metal surface reacts with oxygen in the air, growing a dull oxide coating. Tarnishing speed ranks the Group 1 reactivity trend."
  ms_accepts: ["the shiny surface goes dull as it reacts with oxygen forming an oxide layer", "freshly cut metal dulls in seconds/minutes in air"]
  ms_avoids: ["calling it rusting (that is iron-specific)", "saying the metal melts or dissolves in air"]
  aliases: ["tarnishes", "tarnishing"]
  source: "chem_v3_u2_c11_pdf136_0485"
- term: molten
  slug: molten
  definition: "Melted by heat into a liquid state. Sodium in its water reaction is momentarily molten — the reaction's own heat melts it into a ball — though the equation keeps (s)."
  ms_accepts: ["the metal has melted to a liquid because of the heat released", "sodium ball on water is molten sodium"]
  ms_avoids: ["confusing molten with dissolved in water", "writing state symbol (l) for sodium in this equation (examiners expect (s))"]
  aliases: ["melted"]
  source: "chem_v3_u2_c11_pdf135_0473"
- term: density
  slug: density
  definition: "Mass per unit volume (g/cm³). Lithium, sodium and potassium are less dense than water so float; densities rise only irregularly down Group 1."
  ms_accepts: ["mass per unit volume; Li/Na/K float on water because their density is below 1 g/cm³"]
  ms_avoids: ["confusing density with weight", "claiming density rises smoothly down the group (it is irregular)"]
  aliases: ["densities", "less dense"]
  source: "chem_v3_u2_c11_pdf133_0465"
- term: radioactive
  slug: radioactive
  definition: "Giving out radiation from an unstable nucleus that decays over time. Francium is extremely radioactive and short-lived, so it is never seen as a visible sample."
  ms_accepts: ["unstable nucleus that decays emitting radiation", "francium decays so fast that only ~20–30 g exist in the crust at any time"]
  ms_avoids: ["saying radioactivity is a chemical reaction", "confusing radioactive with reactive"]
  aliases: ["radioactivity"]
  source: "chem_v3_u2_c11_pdf132_0464"
- term: isotope
  slug: isotope
  definition: "One of the forms of an element with the same proton number but different neutron numbers. Uranium-235 decay produces a francium isotope."
  ms_accepts: ["atoms of the same element with different numbers of neutrons", "same protons, different mass number"]
  ms_avoids: ["saying isotopes are different elements", "defining isotopes by electron count"]
  aliases: ["isotopes"]
  source: "chem_v3_u2_c11_pdf132_0464"
