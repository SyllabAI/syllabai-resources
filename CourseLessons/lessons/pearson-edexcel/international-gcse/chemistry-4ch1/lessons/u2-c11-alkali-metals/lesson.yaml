learning_objective: Understand how the similarities in the reactions of these elements
  with water provide evidence for their recognition as a family of elements; Understand
  how the differences between the reactions of these elements with air and water provide
  evidence for the trend in reactivity in Group 1; Use knowledge of trends in Group
  1 to predict the properties of other alkali metals; Explain the trend in reactivity
  in Group 1 in terms of electronic configurations
