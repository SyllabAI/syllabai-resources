learning_objective: 'Understand why covalent compounds do not conduct electricity;
  Understand why ionic compounds conduct electricity only when molten or in aqueous
  solution; Know that anion and cation are terms used to refer to negative and positive
  ions, respectively; Describe experiments to investigate electrolysis, using inert
  electrodes, of molten compounds (including lead(II) bromide) and aqueous solutions
  (including sodium chloride, dilute sulfuric acid and copper(II) sulfate) and to
  predict the products; Write ionic half-equations representing the reactions at the
  electrodes during electrolysis and understand why these reactions are classified
  as oxidation or reduction; Practical: Investigate the electrolysis of aqueous solutions'
safety_note: '3 safety chunks in the c10 census (0425/0443/0445 — the identical chlorine
  note: eye protection, no smelling, asthma hazard, switch off when chlorine detected)
  carried as 2 :::safety boxes (s06 aqueous practical + s10 quantitative/close span;
  0445 attaches to the s10 table area) — one hazard, two placements, disclosed in
  receipt'
