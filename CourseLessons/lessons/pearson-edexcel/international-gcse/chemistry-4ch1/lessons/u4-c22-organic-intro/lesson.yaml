learning_objective: know that a hydrocarbon is a compound of hydrogen and carbon only;
  understand how to represent organic molecules using empirical formulae, molecular
  formulae, general formulae, structural formulae and displayed formulae; know what
  is meant by the terms homologous series, functional group and isomerism; understand
  how to name compounds relevant to this specification using the rules of International
  Union of Pure and Applied Chemistry (IUPAC) nomenclature students will be expected
  to name compounds containing up to six carbon atoms; understand how to write the
  possible structural and displayed formulae of an organic molecule given its molecular
  formula; understand how to classify reactions of organic compounds as substitution,
  addition and combustion knowledge of reaction mechanisms is not required
