learning_objective: Describe the use of litmus, phenolphthalein and methyl orange
  to distinguish between acidic and alkaline solutions; Understand how the pH scale,
  from 0–14, can be used to classify solutions as strongly acidic (0-3), weakly acidic
  (4–6), neutral (7), weakly alkaline (8–10) and strongly alkaline (11–14); Describe
  the use of universal indicator to measure the approximate pH value of an aqueous
  solution; Know that acids in aqueous solution are a source of hydrogen ions and
  alkalis in a aqueous solution are a source of hydroxide ions; Know that alkalis
  can neutralise acids; Describe how to carry out an acid-alkali titration
