learning_objective: 'Write word equations and balanced chemical equations (including
  state symbols): for reactions studied in this course; for unfamiliar reactions where
  suitable information is provided; Calculate relative formula masses (including relative
  molecular masses) (Mᵣ) from relative atomic masses (Aᵣ); Calculate percentage yield;
  Understand how the formulae of simple compounds can be obtained experimentally,
  including metal oxides, water and salts containing water of crystallisation; Know
  what is meant by the terms empirical formula and molecular formula; Know that the
  mole (mol) is the unit for the amount of a substance; Calculate empirical and molecular
  formulae from experimental data; Understand how to carry out calculations involving
  amount of substance, relative atomic mass (Aᵣ) and relative formula mass (Mᵣ); Practical:
  Know how to determine the formula of a metal oxide by combustion (e.g. magnesium
  oxide) or by reduction (e.g. copper(II) oxide); Calculate reacting masses using
  experimental data and chemical equations'
