# glossary — u4:c26 Alcohols (ms layer: every entry needs ms_accepts; definition ≤40 words)
# All sources are chunkRefs into the parse of record (chunks_v3) — provenance law.
# Equations restored/verified per the f-0026 recipe (print OCR + atom balance); the
# dichromate (Vl) glyph class is repaired to (VI) throughout.
- term: alcohol
  slug: alcohol
  definition: "An organic compound whose molecules carry the hydroxyl (–OH) functional group covalently bonded to a carbon chain. A homologous series, not a single substance."
  ms_accepts: ["contains the –OH functional group", "OH bonded to a carbon chain", "a homologous series of compounds"]
  ms_avoids: ["treating alcohol as one substance", "omitting the carbon-chain attachment", "confusing with alkene C=C"]
  aliases: ["alcohols", "the alcohol family"]
  source: "chem_v3_u4_c26_pdf296_1118"
- term: functional group
  slug: functional-group
  definition: "The atom or bond arrangement that gives an organic family its characteristic reactions. For the alcohols it is the –OH group; for the alkenes it was C=C."
  ms_accepts: ["the reactive part determining chemical properties", "–OH for alcohols", "hydroxyl group"]
  ms_avoids: ["omitting that it dictates reactions", "giving C=C as the alcohol group"]
  aliases: ["functional groups"]
  source: "chem_v3_u4_c26_pdf296_1118"
- term: homologous series
  slug: homologous-series
  definition: "A family of compounds with the same functional group, similar chemical properties, a trend in physical properties, one general formula, and consecutive members differing by a -CH2- unit."
  ms_accepts: ["same functional group", "similar chemical properties", "members differ by CH2 units"]
  ms_avoids: ["listing bullets without the functional-group thread", "confusing with a periodic-table group"]
  aliases: ["homologous series of compounds"]
  source: "chem_v3_u4_c26_pdf296_1118"
- term: ethanol
  slug: ethanol
  definition: "The alcohol CH3CH2OH (molecular formula C2H6O): the 'alcohol' of everyday speech, the family's representative, and the product of both industrial routes."
  ms_accepts: ["CH3CH2OH", "C2H5OH", "the alcohol in drinks properly called ethanol"]
  ms_avoids: ["calling ethanol 'alcohol' as if it were the only member", "writing C2H6O only when the structure is asked"]
  aliases: ["ethyl alcohol"]
  source: "chem_v3_u4_c26_pdf296_1118"
- term: methanol
  slug: methanol
  definition: "The simplest alcohol, CH3OH (molecular formula CH4O): one carbon bearing the –OH group. First member of the series."
  ms_accepts: ["CH3OH", "one-carbon alcohol", "CH4O molecular formula"]
  ms_avoids: ["confusing with methane", "omitting the O from the formula"]
  aliases: ["methyl alcohol"]
  source: "chem_v3_u4_c26_pdf297_1122"
- term: molecular formula
  slug: molecular-formula
  definition: "A formula counting the atoms of each element in one molecule — C2H6O for ethanol — without showing how they are joined."
  ms_accepts: ["counts atoms of each element", "C2H6O for ethanol", "shows what but not how joined"]
  ms_avoids: ["confusing with the displayed formula", "omitting the O in alcohol formulae"]
  aliases: ["formula"]
  source: "chem_v3_u4_c26_pdf297_1122"
- term: displayed formula
  slug: displayed-formula
  definition: "A drawing showing every atom and every bond as an explicit line. For alcohols the O–H bond must be shown — an oxygen with no H drawn is the classic lost mark."
  ms_accepts: ["all atoms and bonds drawn", "the O–H bond shown explicitly", "every carbon shows four bonds"]
  ms_avoids: ["omitting the O–H bond", "omitting hydrogen atoms", "leaving the oxygen dangling"]
  aliases: ["displayed formulae"]
  source: "chem_v3_u4_c26_pdf297_1119"
- term: isomer
  slug: isomer
  definition: "A compound with the same molecular formula as another but a different structure. Propan-1-ol and propan-2-ol are isomers: the –OH sits on a different carbon."
  ms_accepts: ["same molecular formula different structure", "propan-1-ol and propan-2-ol as an isomer pair", "OH on a different carbon"]
  ms_avoids: ["saying different molecular formulae", "treating the locant as a drawing convention only"]
  aliases: ["isomers", "structural isomers"]
  source: "chem_v3_u4_c26_pdf297_1123"
- term: complete combustion
  slug: complete-combustion
  definition: "Burning in plenty of oxygen. Ethanol burns to carbon dioxide and water only: C2H5OH(l) + 3O2(g) -> 2CO2(g) + 3H2O(l)."
  ms_accepts: ["carbon dioxide and water", "burning in plenty of oxygen", "CO2 + H2O as products"]
  ms_avoids: ["listing CO or soot for complete combustion", "omitting one product", "wrong state symbols for ethanol (it is a liquid)"]
  aliases: ["burning in air"]
  source: "chem_v3_u4_c26_pdf297_1124"
- term: biofuel
  slug: biofuel
  definition: "A fuel made from biological sources, such as sugar cane or corn, rather than from fossil crude oil. Ethanol used in petrol mixtures in Brazil is the standard example."
  ms_accepts: ["fuel from biological sources", "made from sugar cane or corn", "renewable alternative to fossil fuels"]
  ms_avoids: ["saying biofuels burn to different products", "saying they contain no carbon", "confusing renewability with different combustion chemistry"]
  aliases: ["biofuels"]
  source: "chem_v3_u4_c26_pdf297_1124"
- term: microbial oxidation
  slug: microbial-oxidation
  definition: "Oxidation of ethanol by oxygen in the air with the help of microorganisms (bacteria or yeast), forming ethanoic acid — the wine-turns-to-vinegar reaction."
  ms_accepts: ["oxidised by air with microbes/bacteria/yeast", "forms ethanoic acid", "reaction with oxygen in the air (microbial oxidation)"]
  ms_avoids: ["omitting the microorganisms", "saying direct air oxidation needs no living help", "giving the wrong product"]
  aliases: ["microbial oxidation of ethanol"]
  source: "chem_v3_u4_c26_pdf298_1128"
- term: ethanoic acid
  slug: ethanoic-acid
  definition: "The carboxylic acid CH3COOH, the product of all three ethanol oxidations. Old name: acetic acid. Member of the carboxylic acid family."
  ms_accepts: ["CH3COOH", "product of oxidising ethanol", "acetic acid (old name)"]
  ms_avoids: ["writing C2H5OH", "confusing with ethanol", "omitting the COOH group"]
  aliases: ["acetic acid"]
  source: "chem_v3_u4_c26_pdf298_1128"
- term: oxidising agent
  slug: oxidising-agent
  definition: "The substance that oxidises another by taking electrons from it. In the lab oxidation of ethanol: potassium dichromate(VI) plus dilute sulfuric acid, written [O] in equations."
  ms_accepts: ["potassium dichromate(VI) with dilute sulfuric acid", "K2Cr2O7 / H2SO4 mixture", "[O] in equations as shorthand"]
  ms_avoids: ["omitting the acid from the reagent pair", "calling [O] a real species", "naming potassium dichromate without (VI)"]
  aliases: ["[O]", "acidified dichromate"]
  source: "chem_v3_u4_c26_pdf298_1128"
- term: reflux
  slug: reflux
  definition: "Heating with a condenser placed vertically so vapours condense and run back into the flask instead of escaping — keeps volatile reactants in the reaction."
  ms_accepts: ["condenser vertical, vapours condensed and returned", "heat under reflux keeps volatile ethanol in", "condition for the dichromate oxidation"]
  ms_avoids: ["confusing with distillation (vapours collected)", "omitting what the condenser does", "saying reflux collects the product"]
  aliases: ["heating under reflux"]
  source: "chem_v3_u4_c26_pdf299_1131"
- term: fermentation
  slug: fermentation
  definition: "Yeast enzymes converting sugar (glucose) into ethanol and carbon dioxide, in the absence of air at about 30 degrees C: C6H12O6 -> 2C2H5OH + 2CO2."
  ms_accepts: ["enzymes in yeast convert glucose to ethanol + CO2", "anaerobic, ~30 degrees C, several days", "C6H12O6 -> 2C2H5OH + 2CO2"]
  ms_avoids: ["omitting the anaerobic condition", "saying heat is the catalyst", "naming pure ethanol as the product"]
  aliases: ["fermenting"]
  source: "chem_v3_u4_c26_pdf299_1132"
- term: glucose
  slug: glucose
  definition: "The sugar C6H12O6 that yeast enzymes convert into ethanol and carbon dioxide during fermentation; obtained from sugar cane, maize (corn), wheat and other starchy materials."
  ms_accepts: ["C6H12O6", "the sugar fermented to ethanol", "from sugar cane or starch"]
  ms_avoids: ["confusing with sucrose (C12H22O11)", "omitting the formula when asked"]
  aliases: ["sugar"]
  source: "chem_v3_u4_c26_pdf299_1133"
- term: enzyme
  slug: enzyme
  definition: "A biological catalyst — a protein — that speeds a reaction without being consumed. Yeast enzymes convert sugar to ethanol; they denature above about 40 degrees C."
  ms_accepts: ["biological catalyst", "protein in yeast", "denatured above ~40 degrees C"]
  ms_avoids: ["calling it a chemical catalyst like phosphoric acid", "omitting the denaturing temperature", "saying enzymes are used up"]
  aliases: ["enzymes", "biological catalysts"]
  source: "chem_v3_u4_c26_pdf299_1132"
- term: yeast
  slug: yeast
  definition: "The microorganism whose enzymes carry out fermentation; supplies the biological catalysts, is killed above about 15% alcohol, and works only in the absence of air for ethanol production."
  ms_accepts: ["supplies enzymes for fermentation", "killed by >~15% alcohol", "needs anaerobic conditions"]
  ms_avoids: ["saying yeast is the catalyst itself (its enzymes are)", "omitting the alcohol ceiling", "saying yeast works with air"]
  aliases: ["yeast cells"]
  source: "chem_v3_u4_c26_pdf299_1132"
- term: anaerobic
  slug: anaerobic
  definition: "In the absence of air. Fermentation must be anaerobic: with air (aerobic conditions), yeast enzymes produce carbon dioxide and water instead of ethanol."
  ms_accepts: ["absence of air", "aerobic conditions give CO2 + water instead", "required for the ethanol pathway"]
  ms_avoids: ["saying air speeds fermentation", "omitting the aerobic alternative products", "confusing with low temperature"]
  aliases: ["anaerobic conditions", "absence of air"]
  source: "chem_v3_u4_c26_pdf299_1132"
- term: hydration
  slug: hydration
  definition: "The addition of water (steam) across a double bond: ethene plus steam makes ethanol at ~300 degrees C, ~60-70 atm, over a phosphoric acid catalyst."
  ms_accepts: ["ethene + steam -> ethanol", "addition reaction", "300 degrees C, 60-70 atm, phosphoric acid"]
  ms_avoids: ["confusing with hydrogenation (adds H2)", "omitting the conditions", "saying it needs fermentation"]
  aliases: ["hydration of ethene"]
  source: "chem_v3_u4_c26_pdf300_1136"
- term: catalyst
  slug: catalyst
  definition: "A substance that speeds a reaction without being consumed. Phosphoric acid (H3PO4) catalyses ethene hydration; enzymes catalyse fermentation."
  ms_accepts: ["speeds the reaction, not consumed", "H3PO4 for hydration", "enzymes for fermentation"]
  ms_avoids: ["saying it is used up", "omitting the formula when asked", "swapping the two catalysts between routes"]
  aliases: ["catalysts", "phosphoric acid"]
  source: "chem_v3_u4_c26_pdf300_1136"
- term: batch process
  slug: batch-process
  definition: "A process run in discrete lots: everything is mixed in a vessel, left (for fermentation, several days), then removed and a new batch set up. Inefficient but simple."
  ms_accepts: ["discrete batches mixed then removed", "several days per batch", "inefficient compared with continuous flow"]
  ms_avoids: ["confusing with continuous flow", "omitting the inefficiency", "saying it runs non-stop"]
  aliases: ["batch"]
  source: "chem_v3_u4_c26_pdf300_1138"
- term: continuous process
  slug: continuous-process
  definition: "A process where a stream of reactants constantly flows over the catalyst without stopping — more efficient than a batch process. Ethene hydration runs this way."
  ms_accepts: ["constant flow over catalyst", "more efficient than batch", "no stopping between lots"]
  ms_avoids: ["saying it is slower", "confusing with batch", "omitting the efficiency point"]
  aliases: ["continuous flow process"]
  source: "chem_v3_u4_c26_pdf300_1138"
- term: fractional distillation
  slug: fractional-distillation
  definition: "Separation of a liquid mixture using boiling-point differences. Needed after fermentation because yeast dies above ~15% alcohol: ethanol (78 degrees C) separates from water (100 degrees C)."
  ms_accepts: ["separates by boiling point", "ethanol 78 C vs water 100 C", "purifies fermentation ethanol"]
  ms_avoids: ["confusing with reflux (vapours returned)", "omitting the two boiling points", "saying fermentation alone gives pure ethanol"]
  aliases: ["fractional distillation of ethanol/water"]
  source: "chem_v3_u4_c26_pdf300_1136"
