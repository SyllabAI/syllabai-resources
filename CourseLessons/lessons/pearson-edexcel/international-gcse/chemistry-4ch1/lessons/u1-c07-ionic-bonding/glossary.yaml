# glossary — u1:c07 (ms layer: every entry needs ms_accepts; definition ≤40 words)
# All sources are chunkRefs into the parse of record (chunks_v3) — provenance law.
- term: ion
  slug: ion
  definition: "A charged particle formed when an atom, or a group of atoms, loses or gains electrons. Ions can carry a positive or a negative charge."
  ms_accepts: ["a charged particle formed by electron loss or gain", "an atom or group of atoms with an overall charge"]
  ms_avoids: ["any particle inside a compound", "a particle that changes its protons"]
  aliases: []
  source: "chem_v3_u1_c7_pdf085_0307"
- term: cation
  slug: cation
  definition: "A positive ion, formed when an atom loses electrons — for example Na⁺. All metal ions are cations."
  ms_accepts: ["a positively charged ion", "formed by losing electrons"]
  ms_avoids: ["an ion that has gained protons", "always a non-metal ion"]
  aliases: ["positive ion"]
  source: "chem_v3_u1_c7_pdf085_0307"
- term: anion
  slug: anion
  definition: "A negative ion, formed when an atom gains electrons — for example Cl⁻."
  ms_accepts: ["a negatively charged ion", "formed by gaining electrons"]
  ms_avoids: ["an ion that has lost electrons", "an ion with more protons than electrons"]
  aliases: ["negative ion"]
  source: "chem_v3_u1_c7_pdf085_0307"
- term: electrostatic attraction
  slug: electrostatic-attraction
  definition: "The attraction between positively and negatively charged particles — the force that holds oppositely charged ions together throughout an ionic lattice."
  ms_accepts: ["positive and negative charges attract", "the attraction between oppositely charged ions"]
  ms_avoids: ["sharing of electrons", "a force between ions of the same charge"]
  aliases: ["electrostatic force"]
  source: "chem_v3_u1_c7_pdf085_0307"
- term: dot-and-cross diagram
  slug: dot-and-cross-diagram
  definition: "A diagram of ionic bonding showing outer-shell electrons only, with one atom's electrons as dots and the other's as crosses, and the charges on the ions shown."
  ms_accepts: ["outer electrons only", "dots and crosses show which atom each electron came from"]
  ms_avoids: ["all shells drawn", "dots and crosses are different types of electron"]
  aliases: ["dot and cross"]
  source: "chem_v3_u1_c7_pdf085_0308"
- term: isoelectronic
  slug: isoelectronic
  definition: "Having the same number of electrons: the sodium ion [2, 8] is isoelectronic with the neon atom [2, 8]."
  ms_accepts: ["same number of electrons", "same electronic configuration"]
  ms_avoids: ["same number of protons", "same number of neutrons"]
  aliases: []
  source: "chem_v3_u1_c7_pdf086_0310"
- term: lattice
  slug: lattice
  definition: "A regular, repeating array of particles; an ionic lattice packs positive and negative ions together in a repeating three-dimensional pattern."
  ms_accepts: ["a regular repeating arrangement of particles", "repeating pattern of ions"]
  ms_avoids: ["a random mixture of ions", "a single unit of the compound"]
  aliases: ["crystal lattice"]
  source: "chem_v3_u1_c7_pdf090_0336"
- term: giant ionic lattice
  slug: giant-ionic-lattice
  definition: "A structure in which vast numbers of oppositely charged ions are held by electrostatic attraction extending in all directions; there are no individual molecules."
  ms_accepts: ["giant structure of oppositely charged ions", "no individual molecules — attraction extends throughout"]
  ms_avoids: ["a very large molecule", "a lattice of atoms sharing electrons"]
  aliases: ["giant ionic structure"]
  source: "chem_v3_u1_c7_pdf091_0339"
- term: complex ion
  slug: complex-ion
  definition: "An ion made of more than one atom — for example NO₃⁻, CO₃²⁻, SO₄²⁻, OH⁻ and NH₄⁺. Brackets are written when a formula needs more than one of them."
  ms_accepts: ["an ion containing more than one atom", "brackets needed when more than one appears in a formula"]
  ms_avoids: ["any metal ion", "an ion that is always singly charged"]
  aliases: ["polyatomic ion"]
  source: "chem_v3_u1_c7_pdf089_0332"
- term: molten
  slug: molten
  definition: "Melted — the solid has been heated until it is a liquid."
  ms_accepts: ["melted", "in the liquid state after heating"]
  ms_avoids: ["dissolved in water (that is aqueous)", "evaporated"]
  aliases: []
  source: "chem_v3_u1_c7_pdf092_0344"
- term: aqueous solution
  slug: aqueous-solution
  definition: "A substance dissolved in water; its state symbol is (aq)."
  ms_accepts: ["dissolved in water", "solution with water as the solvent"]
  ms_avoids: ["melted", "dissolved in an organic solvent"]
  aliases: ["aqueous"]
  source: "chem_v3_u1_c7_pdf092_0347"
