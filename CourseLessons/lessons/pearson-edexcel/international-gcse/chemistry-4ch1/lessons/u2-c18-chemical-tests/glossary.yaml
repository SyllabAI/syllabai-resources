# glossary — u2:c18 (ms layer: every entry needs ms_accepts; definition ≤40 words)
# All sources are chunkRefs into the parse of record (chunks_v3) — provenance law.
- term: chemical test
  slug: chemical-test
  definition: "A procedure with one observable result caused by exactly one substance: add the reagent, watch for the positive result, name the ion or gas it proves."
  ms_accepts: ["procedure whose positive result identifies a specific ion or gas", "reagent + observation + conclusion"]
  ms_avoids: ["calling any colour change a test without naming the reagent and the conclusion", "tests that identify a whole compound at once"]
  aliases: ["chemical tests"]
  source: "chem_v3_u2_c18_pdf199_0753"
- term: cation
  slug: cation
  definition: "A positive ion, formed when an atom loses electrons. Every salt contains at least one cation and one anion; the flame test and sodium hydroxide tests identify the cation."
  ms_accepts: ["positive ion", "metal or ammonium ion attracted to the cathode in electrolysis"]
  ms_avoids: ["saying cations gain electrons", "confusing the charge with the flame colour"]
  aliases: ["cations", "positive ion", "positive ions"]
  source: "chem_v3_u2_c18_pdf201_0766"
- term: anion
  slug: anion
  definition: "A negative ion, formed when an atom gains electrons. Chloride, bromide, iodide, sulfate and carbonate are the anions tested with acid-plus-reagent scripts."
  ms_accepts: ["negative ion", "non-metal ion tested by precipitation or gas-evolution reactions"]
  ms_avoids: ["saying anions lose electrons", "calling the halide test a cation test"]
  aliases: ["anions", "negative ion", "negative ions"]
  source: "chem_v3_u2_c18_pdf201_0766"
- term: limewater
  slug: limewater
  definition: "Calcium hydroxide solution, Ca(OH)₂(aq) — an alkali. Turns milky with carbon dioxide because insoluble calcium carbonate precipitates."
  ms_accepts: ["calcium hydroxide solution", "reagent in the carbon dioxide test giving a white precipitate of CaCO₃"]
  ms_avoids: ["confusing limewater with lime juice or plain water", "saying limewater turns CO₂ milky — the limewater is what turns milky"]
  aliases: []
  source: "chem_v3_u2_c18_pdf200_0759"
- term: hydrogencarbonate
  slug: hydrogencarbonate
  definition: "The HCO₃⁻ ion. Calcium hydrogencarbonate, Ca(HCO₃)₂, is soluble — which is why continued bubbling of CO₂ dissolves the white calcium carbonate precipitate."
  ms_accepts: ["soluble product formed when excess CO₂ reacts with calcium carbonate", "explains the milkiness disappearing"]
  ms_avoids: ["calling it hydrogen carbonate inconsistently — one name per answer", "saying the precipitate evaporates"]
  aliases: ["hydrogencarbonates", "calcium hydrogencarbonate", "hydrogen carbonate"]
  source: "chem_v3_u2_c18_pdf200_0755"
- term: bleach
  slug: bleach
  definition: "To strip the colour from a substance chemically. Chlorine bleaches damp litmus paper white; the dye is destroyed, not flipped to the other colour."
  ms_accepts: ["chlorine turns damp litmus white by destroying the dye", "a chemical decolourising, distinct from an indicator colour flip"]
  ms_avoids: ["calling the red-to-white change an acid-base indicator result", "saying dry litmus bleaches as readily"]
  aliases: ["bleaches", "bleaching"]
  source: "chem_v3_u2_c18_pdf200_0760"
- term: alkali
  slug: alkali
  definition: "A soluble base; a source of hydroxide ions in water. Ammonia is the only alkaline gas on the course — it turns damp red litmus blue."
  ms_accepts: ["ammonia identified as the only alkaline gas at this level", "gas turning damp red litmus or universal indicator paper blue"]
  ms_avoids: ["calling chlorine alkaline — its solution is acidic then bleaching", "forgetting the paper must be damp"]
  aliases: ["alkaline", "alkaline gas"]
  source: "chem_v3_u2_c18_pdf201_0764"
- term: anhydrous
  slug: anhydrous
  definition: "Containing no water of crystallisation. Anhydrous copper(II) sulfate is a white powder that turns blue when water is added to it."
  ms_accepts: ["white anhydrous copper(II) sulfate as the water-presence test reagent", "without water of crystallisation"]
  ms_avoids: ["saying anhydrous means dry of all liquid generally — the term is about crystallisation water", "reversing the colour change (white to blue on adding water)"]
  aliases: []
  source: "chem_v3_u2_c18_pdf201_0765"
- term: water of crystallisation
  slug: water-of-crystallisation
  definition: "Water molecules built into a crystal's structure in fixed ratio — CuSO₄·5H₂O. Removing it leaves the anhydrous salt; restoring it turns the white solid blue."
  ms_accepts: ["water molecules in fixed ratio within the crystal lattice", "anhydrous copper(II) sulfate regaining it and turning blue"]
  ms_avoids: ["saying the crystals are merely wet", "writing the dot formula without the ratio"]
  aliases: ["waters of crystallisation"]
  source: "chem_v3_u2_c18_pdf201_0765"
- term: hydrated
  slug: hydrated
  definition: "Containing water of crystallisation — hydrated copper(II) sulfate is CuSO₄·5H₂O and is blue, the colour the water test produces."
  ms_accepts: ["blue hydrated copper(II) sulfate as the product of the water test", "salt plus water of crystallisation"]
  ms_avoids: ["confusing hydrated with simply containing liquid water", "omitting the 5H₂O ratio in the formula"]
  aliases: ["hydration"]
  source: "chem_v3_u2_c18_pdf201_0765"
- term: flame test
  slug: flame-test
  definition: "Cation test: dip a platinum or nichrome wire in concentrated hydrochloric acid, then the sample salt, hold in a non-luminous flame, read the colour."
  ms_accepts: ["acid-cleaned wire, sample, non-luminous flame, colour read as the cation", "identifies metal ions by their emission colour"]
  ms_avoids: ["omitting the wire cleaning", "using the yellow luminous flame, whose colour drowns the result"]
  aliases: ["flame tests"]
  source: "chem_v3_u2_c18_pdf201_0766"
- term: non-luminous flame
  slug: non-luminous-flame
  definition: "The blue roaring Bunsen flame with the air hole open. Used for flame tests because it adds no colour of its own; the yellow safety flame would."
  ms_accepts: ["air hole open, blue roaring flame", "chosen so the flame itself contributes no colour"]
  ms_avoids: ["calling it the safety flame", "saying the yellow flame is used because it is brighter"]
  aliases: ["roaring flame"]
  source: "chem_v3_u2_c18_pdf201_0763"
- term: precipitate
  slug: precipitate
  definition: "An insoluble solid formed in a solution reaction; the solution goes cloudy. Precipitate colour is the evidence in the sodium hydroxide and silver nitrate tests."
  ms_accepts: ["insoluble solid formed when two solutions react", "colour of the precipitate identifies the ion"]
  ms_avoids: ["calling any solid a precipitate — solids present before the reaction are not", "testing on a solid sample where the precipitate would be invisible"]
  aliases: ["precipitates", "precipitation"]
  source: "chem_v3_u2_c18_pdf202_0773"
- term: ionic equation
  slug: ionic-equation
  definition: "An equation showing only the species that actually react — for example Fe³⁺(aq) + 3OH⁻(aq) → Fe(OH)₃(s). Preferred for precipitation reactions."
  ms_accepts: ["spectator ions omitted", "charges and state symbols included"]
  ms_avoids: ["omitting the charges on aqueous ions", "writing the full equation when the ionic one is asked for"]
  aliases: ["ionic equations"]
  source: "chem_v3_u2_c18_pdf202_0771"
- term: insoluble
  slug: insoluble
  definition: "Does not dissolve in water. Most metal hydroxides are insoluble — the fact that makes the sodium hydroxide cation tests produce precipitates."
  ms_accepts: ["metal hydroxide precipitates because the hydroxide is insoluble", "silver and barium halides/sulfates of the anion tests"]
  ms_avoids: ["saying 'not very soluble' when the mark wants insoluble", "confusing insoluble with immiscible"]
  aliases: ["insolubility"]
  source: "chem_v3_u2_c18_pdf202_0773"
- term: ammonium ion
  slug: ammonium-ion
  definition: "NH₄⁺ — the positive ion formed by ammonia accepting a proton. Sodium hydroxide releases ammonia gas from it: NH₄⁺ + OH⁻ → NH₃ + H₂O."
  ms_accepts: ["ammonia gas evolved with NaOH, identified on damp red litmus", "the proton-transfer from NH₄⁺ to OH⁻"]
  ms_avoids: ["writing NH₃ for the ammonium ion — the ion has four hydrogens and a positive charge", "expecting a precipitate — ammonium hydroxide is not insoluble"]
  aliases: ["ammonium"]
  source: "chem_v3_u2_c18_pdf203_0779"
- term: carbonate
  slug: carbonate
  definition: "The CO₃²⁻ ion. Fizzes with dilute hydrochloric acid giving CO₂, confirmed by limewater turning milky; most carbonates are insoluble solids."
  ms_accepts: ["acid + fizzing + limewater confirmation identifies a carbonate", "CO₃²⁻ + 2H⁺ → CO₂ + H₂O as the general ionic equation"]
  ms_avoids: ["claiming fizzing alone proves carbonate — metals fizz with hydrogen", "forgetting the limewater confirmation half"]
  aliases: ["carbonates"]
  source: "chem_v3_u2_c18_pdf203_0781"
- term: sulfate
  slug: sulfate
  definition: "The SO₄²⁻ ion. Identified by adding dilute hydrochloric acid then barium chloride solution — a white precipitate of barium sulfate, BaSO₄."
  ms_accepts: ["acid first then barium chloride, white precipitate", "sulfuric acid banned because it carries sulfate ions itself"]
  ms_avoids: ["omitting the acid-first interference-removal step", "acidifying with sulfuric acid in this test"]
  aliases: ["sulfates"]
  source: "chem_v3_u2_c18_pdf204_0787"
- term: halide ion
  slug: halide-ion
  definition: "The −1 ions of Group 7: chloride, bromide, iodide. Acidify with nitric acid, add silver nitrate: AgCl white, AgBr cream, AgI yellow."
  ms_accepts: ["Group 7 −1 ions named collectively as halides", "the three silver halide colours in specification words"]
  ms_avoids: ["including fluoride in the tested set — only Cl/Br/I are examined", "acidifying with any hydrohalic acid, which adds halide ions of its own"]
  aliases: ["halides", "halide ions"]
  source: "chem_v3_u2_c18_pdf204_0788"
- term: acidified
  slug: acidified
  definition: "Made acidic before the reagent is added — dilute nitric acid for the halide test, dilute hydrochloric acid for the sulfate test, always before the precipitating reagent."
  ms_accepts: ["acid added before the reagent to remove interfering anions", "nitric acid chosen for halide tests because nitrates stay soluble"]
  ms_avoids: ["swapping the acid and reagent order", "using an acid whose anion is the ion under test"]
  aliases: ["acidify", "acidifying"]
  source: "chem_v3_u2_c18_pdf205_0790"
