learning_objective: 'describe tests for these gases: • hydrogen • oxygen • carbon
  dioxide • ammonia • chlorine.; describe how to carry out a flame test; know the
  colours formed in flame tests for these cations: • Li + is red • Na + is yellow
  • K + is lilac • Ca 2+ is orange-red • Cu 2+ is blue-green.; describe tests for
  these cations: • NH 4 + using sodium hydroxide solution and identifying the gas
  evolved • Cu 2+ , Fe 2+ and Fe 3+ using sodium hydroxide solution.; describe tests
  for these anions: • Cl – , Br – and I – using acidified silver nitrate solution
  • SO 4 2– using acidified barium chloride solution • CO 3 2– using hydrochloric
  acid and identifying the gas evolved.; describe a test for the presence of water
  using anhydrous copper(II) sulfate; describe a physical test to show whether a sample
  of water is pure'
