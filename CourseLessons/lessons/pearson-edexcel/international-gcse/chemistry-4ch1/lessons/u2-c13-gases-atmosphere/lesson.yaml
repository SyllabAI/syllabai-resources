learning_objective: 'Know the approximate percentages by volume of the four most abundant
  gases in dry air; Understand how to determine the percentage by volume of oxygen
  in air using experiments involving the reactions of metals (e.g. iron) and non-metals
  (e.g. phosphorus) with air; Describe the combustion of elements in oxygen, including
  magnesium, hydrogen and sulfur; Describe the formation of carbon dioxide from the
  thermal decomposition of metal carbonates, including copper(II) carbonate; Know
  that carbon dioxide is a greenhouse gas and that increasing amounts in the atmosphere
  may contribute to climate change; Practical: Determine the approximate percentage
  by volume of oxygen in air using a metal or a non-metal'
safety_note: '3 safety chunks in the c13 census (0528 — eye protection + careful heating
  to avoid cracking the glass syringe, plunger discipline -> s02; 0535 — iron filings
  irritate skin and eyes -> s03; 0540 — phosphorus demo protocol: goggles/face shield,
  ventilation, hold the bell jar down as pressure rises, sink the basin so unreacted
  phosphorus cannot re-ignite -> s03) carried as 3 :::safety boxes — one hazard, one
  placement each'
