# glossary — u2:c13 (ms layer: every entry needs ms_accepts; definition ≤40 words)
# All sources are chunkRefs into the parse of record (chunks_v3) — provenance law.
- term: percentage by volume
  slug: percentage-by-volume
  definition: "A way of expressing how much of a mixture one component takes up, as a share of the total volume. Nitrogen is about 78% of dry air by volume."
  ms_accepts: ["(volume of the gas / total volume) × 100%", "share of total volume, e.g. 21 cm³ of oxygen in every 100 cm³ of air"]
  ms_avoids: ["confusing with percentage by mass", "expecting the percentages to add to exactly 100.00%"]
  aliases: ["percentages by volume", "% by volume"]
  source: "chem_v3_u2_c13_pdf146_0525"
- term: dry air
  slug: dry-air
  definition: "Air with all water vapour excluded. The standard composition figures — about 78% nitrogen, 21% oxygen, 0.9% argon, 0.04% carbon dioxide — apply only to dry, unpolluted air."
  ms_accepts: ["air from which water vapour has been excluded", "the basis for the 78/21/1/0.04 composition figures"]
  ms_avoids: ["quoting the composition figures for ordinary humid air", "listing water vapour among the four most abundant gases"]
  aliases: ["dry, unpolluted air", "unpolluted dry air"]
  source: "chem_v3_u2_c13_pdf146_0527"
- term: gas syringe
  slug: gas-syringe
  definition: "A gas-tight syringe that measures and transfers accurate gas volumes. Pairs of gas syringes push air back and forth over heated copper in the oxygen-percentage experiment."
  ms_accepts: ["gas-tight syringe used to measure and move known volumes of gas", "plungers pushed in sequence so air passes over the heated copper"]
  ms_avoids: ["treating it as a container that cannot leak gases in or out", "using one to measure liquid volumes"]
  aliases: ["gas syringes"]
  source: "chem_v3_u2_c13_pdf147_0531"
- term: excess
  slug: excess
  definition: "More than enough of a reactant to use up the other reactant completely. The copper, iron or phosphorus in the oxygen-percentage experiments must be in excess so that all the oxygen reacts."
  ms_accepts: ["more than enough to react with all of the other reactant", "ensures the oxygen is the reactant that runs out first"]
  ms_avoids: ["confusing the excess reactant with the limiting reactant", "saying the excess reactant is fully used up"]
  aliases: ["in excess"]
  source: "chem_v3_u2_c13_pdf147_0529"
- term: rusting
  slug: rusting
  definition: "The corrosion of iron in the presence of both oxygen and water, forming rust. Rusting uses up oxygen, which is why damp iron filings can measure the oxygen content of air."
  ms_accepts: ["iron reacting with oxygen and water to form rust", "oxygen is consumed as iron rusts in damp air"]
  ms_avoids: ["saying iron rusts in dry air alone", "using rusting loosely for the corrosion of any metal"]
  aliases: ["rust", "rusts"]
  source: "chem_v3_u2_c13_pdf148_0536"
- term: combustion
  slug: combustion
  definition: "A reaction in which a substance burns in oxygen, releasing energy. Elements burn more brightly and rapidly in pure oxygen than in air, which is only 21% oxygen."
  ms_accepts: ["burning; reaction with oxygen releasing energy, e.g. Mg, H₂ or S in O₂", "oxygen is a reactant in the equation"]
  ms_avoids: ["describing combustion without oxygen as a reactant", "restricting the word to burning fuels like coal"]
  aliases: ["burning", "combustion reactions"]
  source: "chem_v3_u2_c13_pdf149_0541"
- term: sulfurous acid
  slug: sulfurous-acid
  definition: "The acid formed when sulfur dioxide dissolves in water, H₂SO₃ — not sulfuric acid (H₂SO₄). Sulfur dioxide is also called sulfur(IV) oxide."
  ms_accepts: ["H₂SO₃ formed when SO₂ dissolves in water", "the '-ous' acid paired with the '- dioxide' gas"]
  ms_avoids: ["writing H₂SO₄ as the product of SO₂ dissolving in water", "confusing sulfur dioxide with sulfuric acid"]
  aliases: ["H₂SO₃", "sulfuric(IV) acid"]
  source: "chem_v3_u2_c13_pdf150_0543"
- term: oxide
  slug: oxide
  definition: "A compound of one element with oxygen. Metal oxides are ionic and usually basic; non-metal oxides are covalent and usually acidic."
  ms_accepts: ["compound containing oxygen bonded to one other element", "e.g. MgO, CuO, SO₂, CO₂"]
  ms_avoids: ["calling dissolved oxygen gas an oxide", "mixing up oxides with carbonates"]
  aliases: ["oxides"]
  source: "chem_v3_u2_c13_pdf150_0546"
- term: basic oxide
  slug: basic-oxide
  definition: "A metal oxide that reacts with acids to form salts. Usually insoluble in water; the soluble ones dissolve to give alkaline solutions containing OH⁻ ions."
  ms_accepts: ["metal oxide reacting with an acid to give a salt (and water)", "MgO or CaO dissolving slightly in water to give an alkaline solution"]
  ms_avoids: ["saying all metal oxides dissolve in water", "classifying non-metal oxides as basic"]
  aliases: ["basic oxides", "metal oxide"]
  source: "chem_v3_u2_c13_pdf150_0546"
- term: acidic oxide
  slug: acidic-oxide
  definition: "A non-metal oxide that reacts with alkalis and bases to form salts. Often soluble in water, giving acidic solutions containing H⁺ ions — CO₂ and SO₂ both behave this way."
  ms_accepts: ["non-metal oxide that reacts with alkalis to form salts", "dissolves in water to give an acidic solution, e.g. CO₂"]
  ms_avoids: ["saying all non-metal oxides are insoluble in water", "classifying metal oxides as acidic"]
  aliases: ["acidic oxides", "non-metal oxide"]
  source: "chem_v3_u2_c13_pdf151_0549"
- term: thermal decomposition
  slug: thermal-decomposition
  definition: "Breaking a compound into simpler substances using heat alone. Most metal carbonates thermally decompose to the metal oxide and carbon dioxide — copper(II) carbonate is the classic example."
  ms_accepts: ["splitting one compound into two or more products using heat", "CuCO₃ → CuO + CO₂ on heating"]
  ms_avoids: ["calling combustion a decomposition", "writing heat as a reactant in the equation"]
  aliases: ["decomposes on heating", "thermal decomposition"]
  source: "chem_v3_u2_c13_pdf151_0549"
- term: hydrocarbon
  slug: hydrocarbon
  definition: "A molecule containing carbon and hydrogen only. Petrol is a mixture of hydrocarbons; burning them produces carbon dioxide and water."
  ms_accepts: ["compound of carbon and hydrogen atoms only", "e.g. octane C₈H₁₈, a component of petrol"]
  ms_avoids: ["including oxygen among a hydrocarbon's elements", "calling CO₂ or H₂O a hydrocarbon"]
  aliases: ["hydrocarbons"]
  source: "chem_v3_u2_c13_pdf151_0549"
- term: greenhouse gas
  slug: greenhouse-gas
  definition: "A gas that absorbs infrared radiation emitted by the Earth's surface and re-emits it in all directions, warming the atmosphere. Carbon dioxide and water vapour are greenhouse gases; nitrogen and oxygen are not."
  ms_accepts: ["absorbs infrared (IR) radiation and re-emits it in all directions", "its vibrations change the molecule's polarity, enabling IR absorption"]
  ms_avoids: ["defining it vaguely as a gas that traps heat with no IR mechanism", "listing nitrogen or oxygen as greenhouse gases"]
  aliases: ["greenhouse gases"]
  source: "chem_v3_u2_c13_pdf152_0551"
- term: infrared radiation
  slug: infrared-radiation
  definition: "The radiation a warm surface emits. UV and visible light from the Sun warm the Earth; the surface then radiates infrared, which greenhouse-gas molecules absorb and re-emit in all directions."
  ms_accepts: ["radiation emitted by the warm Earth's surface that CO₂ absorbs", "re-emission of IR in all directions warms the atmosphere"]
  ms_avoids: ["saying the Sun's incoming radiation is the IR that CO₂ absorbs", "saying 'heat' without naming infrared radiation"]
  aliases: ["IR", "IR radiation", "infrared"]
  source: "chem_v3_u2_c13_pdf152_0551"
- term: polar molecule
  slug: polar-molecule
  definition: "A molecule with one end slightly negative and the other slightly positive, because one atom attracts the shared electrons more strongly. Water is polar; a vibrating CO₂ molecule becomes polar for an instant."
  ms_accepts: ["one end δ+, the other δ−, due to unequal sharing of electrons", "polarity also depends on the shape of the molecule"]
  ms_avoids: ["calling a polar molecule an ion", "saying polarity requires a full charge separation"]
  aliases: ["polarity", "non-polar", "non-polar molecule"]
  source: "chem_v3_u2_c13_pdf152_0553"
- term: electronegativity
  slug: electronegativity
  definition: "The strength with which an atom attracts the electrons in a covalent bond. Oxygen attracts bonding electrons more strongly than carbon or hydrogen do — the origin of polarity in water and in carbon dioxide's bonds."
  ms_accepts: ["an atom's ability to attract the shared electrons in a bond", "O is more electronegative than C and H, so bond dipoles arise"]
  ms_avoids: ["confusing electronegativity with ionic charge", "using the idea for bonds between identical atoms"]
  aliases: ["electronegative"]
  source: "chem_v3_u2_c13_pdf152_0553"
