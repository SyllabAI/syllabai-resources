- term: ester
  slug: ester
  definition: "An organic compound formed when an alcohol reacts with a carboxylic acid, releasing water. Members carry the -COO- functional group; small ones are volatile with distinctive smells."
  ms_accepts: ["formed from an alcohol and a carboxylic acid", "contains the -COO- functional group", "water is eliminated when it forms"]
  ms_avoids: ["calling it an alcohol or an acid", "omitting one of the two parent families", "writing -COOH as the ester group"]
  aliases: ["esters", "the ester family"]
  source: "chem_v3_u4_c28_pdf306_1158"
- term: functional group
  slug: functional-group
  definition: "The atom arrangement that gives an organic family its characteristic reactions. The ester group is -COO-: a carbon double-bonded to one oxygen and single-bonded to another."
  ms_accepts: ["the reactive arrangement determining chemical properties", "-COO- for esters", "carbon with C=O and C-O"]
  ms_avoids: ["omitting that it dictates reactions", "giving -COOH (the acid group) for esters"]
  aliases: ["functional groups", "ester functional group"]
  source: "chem_v3_u4_c28_pdf306_1158"
- term: carboxylic acid
  slug: carboxylic-acid
  definition: "The family of weak organic acids carrying -COOH; one of the two parents of every ester. Made by oxidising the corresponding alcohol."
  ms_accepts: ["contains the -COOH functional group", "weak organic acid formed from alcohol oxidation", "reacts with an alcohol to give an ester"]
  ms_avoids: ["confusing the acid's -COOH with the ester's -COO-", "calling it the ester's product rather than parent"]
  aliases: ["carboxylic acids"]
  source: "chem_v3_u4_c28_pdf306_1157"
- term: alcohol
  slug: alcohol
  definition: "The family of organic compounds carrying the hydroxyl group -OH; the other parent of every ester, naming the alkyl part of the ester's name."
  ms_accepts: ["contains the -OH functional group", "reacts with a carboxylic acid to give an ester", "provides the alkyl part of the ester name"]
  ms_avoids: ["omitting the -OH group", "confusing with the alkane family"]
  aliases: ["alcohols"]
  source: "chem_v3_u4_c28_pdf306_1157"
- term: esterification
  slug: esterification
  definition: "The reaction of an alcohol with a carboxylic acid to form an ester and water, run over a concentrated sulfuric acid catalyst with heat. Reversible."
  ms_accepts: ["alcohol plus carboxylic acid gives ester plus water", "concentrated sulfuric acid catalyst", "heated conditions"]
  ms_avoids: ["omitting the catalyst or the heat", "writing the catalyst into the equation", "omitting water as the second product"]
  aliases: ["esterification reaction"]
  source: "chem_v3_u4_c28_pdf307_1162"
- term: condensation reaction
  slug: condensation-reaction
  definition: "A reaction in which two molecules join together while a small molecule, here water, is released. Esterification is the chapter's example."
  ms_accepts: ["two molecules join with loss of a small molecule", "water released as the molecules join", "esterification described as condensation"]
  ms_avoids: ["omitting the small-molecule loss", "confusing with addition, where nothing is expelled"]
  aliases: ["condensation reactions", "condensation"]
  source: "chem_v3_u4_c28_pdf307_1162"
- term: catalyst
  slug: catalyst
  definition: "A substance that speeds a reaction without being consumed. Concentrated sulfuric acid catalyses esterification, so it is named in the conditions but never written into the equation."
  ms_accepts: ["speeds up the reaction", "not consumed / unchanged at the end", "not included in the equation"]
  ms_avoids: ["describing it as used up", "balancing it into the equation", "omitting it from the conditions"]
  aliases: ["catalysts", "concentrated sulfuric acid catalyst"]
  source: "chem_v3_u4_c28_pdf307_1162"
- term: glacial ethanoic acid
  slug: glacial-ethanoic-acid
  definition: "Pure, water-free ethanoic acid. Used in ester synthesis so no water is added to the equilibrium mixture, protecting the ester yield."
  ms_accepts: ["pure ethanoic acid", "water-free ethanoic acid", "used to keep water out of the equilibrium"]
  ms_avoids: ["calling it dilute acid", "omitting why purity protects the yield"]
  aliases: ["glacial ethanoic acid (pure CH3COOH)"]
  source: "chem_v3_u4_c28_pdf307_1162"
- term: reversible reaction
  slug: reversible-reaction
  definition: "A reaction running in both directions at once, reaching a position of equilibrium. Esterification is reversible, so water added to the mixture shifts the position left and lowers the ester yield."
  ms_accepts: ["reacts in both directions", "reaches equilibrium", "added water shifts the position left, reducing ester"]
  ms_avoids: ["treating the yield as fixed", "saying the equilibrium 'wants' anything (teleology)", "omitting the shift direction"]
  aliases: ["reversibility", "reversible"]
  source: "chem_v3_u4_c28_pdf307_1162"
- term: ethyl ethanoate
  slug: ethyl-ethanoate
  definition: "The ester CH3COOCH2CH3, made from ethanol and ethanoic acid over an acid catalyst; the chapter's representative ester and a nail-polish solvent."
  ms_accepts: ["CH3COOCH2CH3", "C4H8O2", "ester of ethanol and ethanoic acid"]
  ms_avoids: ["writing CH3COOC2H5's parents the wrong way round", "omitting a formula level when drawing is asked", "calling it ethyl acetic"]
  aliases: ["ethyl ethanoate (CH3COOC2H5)"]
  source: "chem_v3_u4_c28_pdf307_1162"
- term: structural formula
  slug: structural-formula
  definition: "The unambiguous condensed formula showing atom arrangement without every bond drawn, such as CH3COOCH2CH3 for ethyl ethanoate."
  ms_accepts: ["condensed formula showing arrangement", "CH3COOCH2CH3 as the structural formula", "bonds not all drawn out"]
  ms_avoids: ["confusing with the molecular formula C4H8O2", "drawing every bond when condensed is asked"]
  aliases: ["structural formulae", "condensed formula"]
  source: "chem_v3_u4_c28_pdf307_1163"
- term: displayed formula
  slug: displayed-formula
  definition: "The drawing that shows every bond explicitly, including the C=O and C-O of the ester group. Required when a question says 'displayed'."
  ms_accepts: ["all bonds shown", "C=O and C-O both drawn", "every atom and bond explicit"]
  ms_avoids: ["giving the condensed formula instead", "omitting the double-bonded oxygen", "omitting hydrogens on carbon"]
  aliases: ["displayed formulae", "full structural formula"]
  source: "chem_v3_u4_c28_pdf307_1163"
- term: alkyl group
  slug: alkyl-group
  definition: "The fragment of an ester that came from the alcohol, named by the 'yl' word: methyl, ethyl, propyl, butyl. It bonds through its spare oxygen to the alkanoate part."
  ms_accepts: ["the 'yl' part names the alcohol it came from", "alkyl = fragment from the alcohol", "methyl means methanol was the parent"]
  ms_avoids: ["reading the 'yl' word as the acid", "omitting the oxygen link between the fragments"]
  aliases: ["alkyl", "'yl' part"]
  source: "chem_v3_u4_c28_pdf308_1166"
- term: alkanoate
  slug: alkanoate
  definition: "The fragment of an ester that came from the carboxylic acid, named by the 'oate' word and always containing the C=O carbon: methanoate, ethanoate, propanoate, butanoate."
  ms_accepts: ["the 'oate' part names the carboxylic acid", "the C=O carbon is in the alkanoate part", "ethanoate means ethanoic acid was the parent"]
  ms_avoids: ["reading the 'oate' word as the alcohol", "miscounting carbons by excluding the carbonyl carbon"]
  aliases: ["alkanoate part", "'oate' part"]
  source: "chem_v3_u4_c28_pdf307_1161"
- term: volatile
  slug: volatile
  definition: "Turns to vapour easily. Volatility is why esters work as flavourings and perfumes: the molecules leave the liquid and carry their smells through the air."
  ms_accepts: ["evaporates / turns to vapour easily", "low boiling point implied", "links volatility to the smell reaching the nose"]
  ms_avoids: ["defining it as flammable or unstable", "naming the use without the volatility link"]
  aliases: ["volatility"]
  source: "chem_v3_u4_c28_pdf308_1168"
- term: hydrogen bond
  slug: hydrogen-bond
  definition: "The intermolecular force between an O-H group and water. Alcohols and carboxylic acids hydrogen-bond and dissolve; esters have no O-H and so hardly dissolve."
  ms_accepts: ["attraction between O-H and water molecules", "explains solubility of small alcohols and acids", "esters lack O-H so form weak interactions with water"]
  ms_avoids: ["calling it a covalent bond", "claiming esters dissolve because they contain oxygen"]
  aliases: ["hydrogen bonding", "hydrogen bonds"]
  source: "chem_v3_u4_c28_pdf309_1170"
- term: solvent
  slug: solvent
  definition: "The liquid something dissolves in. Small esters such as ethyl ethanoate are used as solvents, for example in nail polish and nail polish remover."
  ms_accepts: ["dissolves other substances", "ethyl ethanoate as a solvent in nail polish", "small esters used as solvents"]
  ms_avoids: ["confusing with the solute", "omitting the nail-polish example when asked for a use"]
  aliases: ["solvents"]
  source: "chem_v3_u4_c28_pdf307_1159"
- term: sodium carbonate
  slug: sodium-carbonate
  definition: "The 0.5 mol/dm3 solution the ester mixture is poured into after cooling; it reacts with the excess acid (effervescence) so the ester's smell is no longer masked."
  ms_accepts: ["reacts with / neutralises the excess acid", "effervescence is acid plus carbonate", "so the ester can be smelled better"]
  ms_avoids: ["saying it catalyses the esterification", "saying it reacts with the ester", "omitting the smell-masking reason"]
  aliases: ["Na2CO3 solution", "carbonate solution"]
  source: "chem_v3_u4_c28_pdf309_1171"
