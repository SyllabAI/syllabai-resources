# glossary — u2:c12 (ms layer: every entry needs ms_accepts; definition ≤40 words)
# All sources are chunkRefs into the parse of record (chunks_v3) — provenance law.
- term: halogen
  slug: halogen
  definition: "A Group 7 non-metal (fluorine, chlorine, bromine, iodine, astatine) with 7 electrons in its outer shell, written X in family equations. The name means salt-forming."
  ms_accepts: ["a Group 7 non-metal with 7 outer-shell electrons", "reactive non-metal that forms salts containing X⁻ ions"]
  ms_avoids: ["placing halogens among the metals", "saying halogens are Group 17 with no mention of outer electrons"]
  aliases: ["halogens", "Group 7 elements"]
  source: "chem_v3_u2_c12_pdf139_0496"
- term: diatomic
  slug: diatomic
  definition: "Made of molecules containing exactly two atoms. The halogens exist as diatomic molecules — F₂, Cl₂, Br₂, I₂ — so astatine is predicted to form At₂ molecules too."
  ms_accepts: ["molecule made of two atoms (e.g. Cl₂)", "exists as X₂ molecules"]
  ms_avoids: ["confusing with an ion made of two elements", "saying it means 'two bonds'"]
  aliases: ["diatomic molecule", "diatomic molecules"]
  source: "chem_v3_u2_c12_pdf139_0496"
- term: salt
  slug: salt
  definition: "An ionic compound formed when a metal reacts with a halogen (or an acid). Halogen salts — NaCl, KBr, CaF₂, AgBr — all contain the halide ion X⁻."
  ms_accepts: ["ionic compound of a metal with a halogen, containing X⁻ ions", "compound made when a metal replaces the hydrogen of an acid"]
  ms_avoids: ["calling covalent molecular HCl a salt", "any compound with no ions"]
  aliases: ["salts", "ionic salt"]
  source: "chem_v3_u2_c12_pdf139_0496"
- term: intermolecular forces
  slug: intermolecular-forces
  definition: "The forces of attraction between separate molecules. Melting or boiling a molecular substance overcomes only these forces — no covalent bonds break."
  ms_accepts: ["forces of attraction between molecules, overcome on melting/boiling", "weaker than covalent bonds; stronger down the halogen group as Mr rises"]
  ms_avoids: ["calling them covalent bonds between molecules", "claiming covalent bonds break on melting"]
  aliases: ["intermolecular forces of attraction", "forces between molecules"]
  source: "chem_v3_u2_c12_pdf140_0500"
- term: hydrogen halide
  slug: hydrogen-halide
  definition: "A covalent molecular compound of hydrogen with a halogen, HX (HF, HCl, HBr, HI). All are acidic, poisonous gases that dissolve in water to give acidic solutions."
  ms_accepts: ["covalent HX gas that forms an acidic solution in water", "e.g. hydrogen chloride gas dissolving to give hydrochloric acid"]
  ms_avoids: ["describing HX as ionic in the gas state", "confusing the gas HCl with the solution HCl(aq)"]
  aliases: ["hydrogen halides", "HX"]
  source: "chem_v3_u2_c12_pdf140_0503"
- term: fume cupboard
  slug: fume-cupboard
  definition: "A ventilated enclosure that safely extracts poisonous gases. All halogen vapours are extremely poisonous, so halogen experiments are carried out inside one."
  ms_accepts: ["enclosure with extraction used for toxic vapours", "why halogen demonstrations are done in one"]
  ms_avoids: ["calling it a safety screen or a hood that heats things", "claiming it makes toxic gases safe to breathe"]
  aliases: ["fume hood"]
  source: "chem_v3_u2_c12_pdf140_0502"
- term: displacement reaction
  slug: displacement-reaction
  definition: "A reaction in which a more reactive halogen pushes a less reactive halogen out of its salt solution, taking its place — chlorine displaces bromine from potassium bromide solution."
  ms_accepts: ["more reactive halogen displaces a less reactive halogen from its halide solution", "evidence for the decreasing reactivity down Group 7"]
  ms_avoids: ["saying the halogen displaces the metal's other partner 'bromide' element-style", "reversing the direction (less reactive cannot displace more reactive)"]
  aliases: ["displacement reactions", "displaces"]
  source: "chem_v3_u2_c12_pdf141_0508"
- term: halide ion
  slug: halide-ion
  definition: "The negative ion of a halogen, X⁻ (F⁻, Cl⁻, Br⁻, I⁻). Formed when a halogen atom gains one electron; present in halogen salts and their aqueous solutions."
  ms_accepts: ["a halogen atom that has gained one electron, charge 1−", "e.g. Cl⁻ in potassium chloride solution"]
  ms_avoids: ["confusing the ion Cl⁻ with the molecule Cl₂", "wrong charge such as 2− or 1+"]
  aliases: ["halide ions", "X⁻"]
  source: "chem_v3_u2_c12_pdf141_0508"
- term: ionic equation
  slug: ionic-equation
  definition: "An equation showing only the particles that actually change, written with their charges and state symbols; unchanging spectator ions are left out."
  ms_accepts: ["equation without spectator ions showing only reacting species with charges", "e.g. Cl₂(aq) + 2I⁻(aq) → 2Cl⁻(aq) + I₂(aq)"]
  ms_avoids: ["including the metal ion in a net ionic equation", "omitting charges or state symbols"]
  aliases: ["net ionic equation"]
  source: "chem_v3_u2_c12_pdf142_0512"
- term: spectator ion
  slug: spectator-ion
  definition: "An ion present in a reaction solution that does not take part — it is unchanged on both sides. K⁺ is the spectator ion in halogen displacement reactions."
  ms_accepts: ["ion that appears unchanged on both sides of the equation", "K⁺ or Na⁺ during halogen displacement"]
  ms_avoids: ["claiming the metal ion is displaced", "counting spectators among the reactants"]
  aliases: ["spectator ions"]
  source: "chem_v3_u2_c12_pdf142_0512"
- term: oxidising agent
  slug: oxidising-agent
  definition: "The substance that oxidises another by taking electrons away from it. It accepts electrons and is itself reduced. Chlorine oxidises bromide and iodide ions."
  ms_accepts: ["electron acceptor that is reduced itself", "chlorine/bromine acting on halide ions in displacement reactions"]
  ms_avoids: ["saying the oxidising agent is oxidised", "swapping the definitions with reducing agent"]
  aliases: ["oxidising agents", "oxidant"]
  source: "chem_v3_u2_c12_pdf142_0512"
- term: reducing agent
  slug: reducing-agent
  definition: "The substance that reduces another by giving electrons to it. It gives away electrons and is itself oxidised. Halide ions act as reducing agents towards reactive halogens."
  ms_accepts: ["electron donor that is oxidised itself", "bromide/iodide ions losing electrons to chlorine"]
  ms_avoids: ["saying the reducing agent is reduced", "claiming metals are never reducing agents"]
  aliases: ["reducing agents", "reductant"]
  source: "chem_v3_u2_c12_pdf142_0512"
- term: redox reaction
  slug: redox-reaction
  definition: "A reaction in which oxidation and reduction happen together: electrons are transferred, so one species loses them (oxidised) while another gains them (reduced)."
  ms_accepts: ["simultaneous oxidation and reduction with electron transfer", "halogen displacement described as redox"]
  ms_avoids: ["oxidation occurring without reduction", "defining redox only by oxygen transfer"]
  aliases: ["redox"]
  source: "chem_v3_u2_c12_pdf142_0512"
