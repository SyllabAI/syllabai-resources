  in physical properties of the halogens; Use knowledge of trends in Group 7 to predict
  the properties of other halogens; Understand how displacement reactions involving
  halogens and halides provide evidence for the trend in reactivity in Group 7; CHEMISTRY
  ONLY — Explain the trend in reactivity in Group 7 in terms of electronic configurations
