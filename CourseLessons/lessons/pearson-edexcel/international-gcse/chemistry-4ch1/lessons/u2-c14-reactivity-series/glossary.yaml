# glossary — u2:c14 (ms layer: every entry needs ms_accepts; definition ≤40 words)
# All sources are chunkRefs into the parse of record (chunks_v3) — provenance law.
- term: reactivity series
  slug: reactivity-series
  definition: "The list of metals arranged in order of their reactivity, from potassium down to gold. Carbon and hydrogen are included as non-metals because they are useful reference points for displacement and extraction."
  ms_accepts: ["metals arranged in order of reactivity, most reactive at the top", "K, Na, Li, Ca, Mg, Al, (C), Zn, Fe, (H), Cu, Ag, Au"]
  ms_avoids: ["omitting carbon and hydrogen from the reference series", "listing the metals in alphabetical order"]
  aliases: ["activity series"]
  source: "chem_v3_u2_c14_pdf155_0560"
- term: redox reaction
  slug: redox-reaction
  definition: "A reaction in which reduction and oxidation are happening at the same time. If one substance loses oxygen (or gains electrons), another must gain oxygen (or lose electrons) — the two always occur together."
  ms_accepts: ["a reaction where oxidation and reduction happen simultaneously", "electron transfer between one substance and another"]
  ms_avoids: ["describing only the oxidation or only the reduction half", "using redox for reactions with no oxygen or electron transfer"]
  aliases: ["redox reactions", "redox"]
  source: "chem_v3_u2_c14_pdf156_0569"
- term: displacement reaction
  slug: displacement-reaction
  definition: "A reaction in which a more reactive element takes the place of a less reactive element in its compound. Any metal higher in the reactivity series will displace one lower down."
  ms_accepts: ["a more reactive metal taking the place of a less reactive metal in its compound", "e.g. magnesium displacing copper from copper(II) oxide"]
  ms_avoids: ["saying the less reactive metal displaces the more reactive one", "confusing displacement with neutralisation"]
  aliases: ["displaces", "displacement reactions"]
  source: "chem_v3_u2_c14_pdf155_0566"
- term: competition reaction
  slug: competition-reaction
  definition: "The name for reactions between metals and metal oxides: the two metals compete for the oxygen, and the more reactive metal wins it. Heating magnesium with copper(II) oxide is the classic example."
  ms_accepts: ["metals competing for oxygen in a metal oxide", "the more reactive metal takes the oxygen from the less reactive metal's oxide"]
  ms_avoids: ["using competition for reactions in solution", "implying both metals end up sharing the oxygen"]
  aliases: ["competition reactions"]
  source: "chem_v3_u2_c14_pdf155_0560"
- term: oxidation
  slug: oxidation
  definition: "Gain of oxygen by a substance — or, in the electron definition, loss of electrons. Magnesium is oxidised when it takes oxygen from copper(II) oxide, and when its atoms lose electrons to form Mg²⁺ ions."
  ms_accepts: ["gain of oxygen / loss of electrons (OILRIG)", "identified from the equation by watching oxygen or electrons move"]
  ms_avoids: ["defining oxidation as adding oxygen to the other reactant", "saying oxidation means the substance gains electrons"]
  aliases: ["oxidised", "oxidise"]
  source: "chem_v3_u2_c14_pdf156_0569"
- term: reduction
  slug: reduction
  definition: "Loss of oxygen by a substance — or, in the electron definition, gain of electrons. Copper(II) oxide is reduced to copper when magnesium takes its oxygen away."
  ms_accepts: ["loss of oxygen / gain of electrons (OILRIG)", "the oxide losing oxygen to become the metal"]
  ms_avoids: ["saying reduction means the substance loses electrons", "mixing the oxygen and electron definitions within one answer inconsistently"]
  aliases: ["reduced", "reduce"]
  source: "chem_v3_u2_c14_pdf156_0569"
- term: oxidising agent
  slug: oxidising-agent
  definition: "The substance that oxidises something else by giving it oxygen — in electron terms, by taking electrons away. An oxidising agent always gets reduced itself. Copper(II) oxide oxidises magnesium."
  ms_accepts: ["the substance giving oxygen (or accepting electrons), and being reduced itself", "accepts electrons so its own oxidation state falls"]
  ms_avoids: ["saying the oxidising agent is oxidised", "naming the reduced product as the agent"]
  aliases: ["oxidising agents"]
  source: "chem_v3_u2_c14_pdf158_0576"
- term: reducing agent
  slug: reducing-agent
  definition: "The substance that reduces something else by taking its oxygen away — in electron terms, by giving electrons to it. A reducing agent always gets oxidised itself. Magnesium reduces copper(II) oxide."
  ms_accepts: ["the substance taking oxygen (or donating electrons), and being oxidised itself", "donates electrons so its own oxidation state rises"]
  ms_avoids: ["saying the reducing agent is reduced", "naming the oxidised product as the agent"]
  aliases: ["reducing agents"]
  source: "chem_v3_u2_c14_pdf158_0577"
- term: spectator ion
  slug: spectator-ion
  definition: "An ion present in a reaction solution that does not change at all — identical on both sides of the equation and left out of the ionic equation. Sulfate is the spectator when zinc displaces copper."
  ms_accepts: ["an ion that is unchanged during the reaction, so it is omitted from the ionic equation", "same ions on both sides of the full equation"]
  ms_avoids: ["calling the reacting ions spectators", "removing spectator ions from the full equation instead of the ionic one"]
  aliases: ["spectator ions"]
  source: "chem_v3_u2_c14_pdf157_0574"
- term: ionic equation
  slug: ionic-equation
  definition: "The version of an equation that shows only the particles that actually change, with spectator ions removed. Charges and state symbols must balance — e.g. Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s)."
  ms_accepts: ["equation showing only the reacting species with charges balanced", "spectator ions removed from the full equation"]
  ms_avoids: ["omitting state symbols or charges", "balancing atoms but not charges"]
  aliases: ["ionic equations"]
  source: "chem_v3_u2_c14_pdf157_0574"
- term: salt
  slug: salt
  definition: "A compound made when the hydrogen of an acid is replaced by a metal. Copper(II) sulfate, silver nitrate and sodium chloride are salts. Metal + acid → salt + hydrogen."
  ms_accepts: ["compound formed when acid hydrogen is replaced by a metal", "e.g. zinc chloride from zinc and hydrochloric acid"]
  ms_avoids: ["calling every ionic compound a salt regardless of origin", "naming the acid itself as the salt"]
  aliases: ["salts"]
  source: "chem_v3_u2_c14_pdf157_0574"
- term: tri-iron tetroxide
  slug: tri-iron-tetroxide
  definition: "The dark grey oxide formed when iron reacts with steam, Fe₃O₄ — a compound containing both Fe²⁺ and Fe³⁺ ions. Note the different formula from rust or ordinary iron oxides."
  ms_accepts: ["Fe₃O₄ formed when iron reacts with steam", "mixed iron(II)/iron(III) oxide"]
  ms_avoids: ["writing rust as Fe₃O₄", "balancing the equation wrong: 3Fe + 4H₂O → Fe₃O₄ + 4H₂"]
  aliases: ["Fe₃O₄"]
  source: "chem_v3_u2_c14_pdf160_0587"
- term: valid test
  slug: valid-test
  definition: "A comparison experiment in which every variable except the one being tested is controlled. Comparing metals by temperature change needs the same moles of metal, the same acid volume and concentration, and the same surface area."
  ms_accepts: ["control all variables except the one investigated", "same amount in moles, not grams, of each metal"]
  ms_avoids: ["changing the metal's mass and reactivity at the same time", "calling the test 'fair' without naming the controlled variables"]
  aliases: ["fair test", "fair"]
  source: "chem_v3_u2_c14_pdf161_0593"
- term: rusting
  slug: rusting
  definition: "The corrosion of iron that needs both oxygen and water. The product is hydrated iron(III) oxide, approximately Fe₂O₃·xH₂O. Rusting is redox: the iron is oxidised."
  ms_accepts: ["iron corroding in the presence of both oxygen and water", "salt speeds rusting up; dry or air-free conditions prevent it"]
  ms_avoids: ["saying iron rusts in dry air alone", "using 'rusting' for the corrosion of copper or zinc"]
  aliases: ["rust", "rusts", "corrosion of iron"]
  source: "chem_v3_u2_c14_pdf165_0619"
- term: barrier method
  slug: barrier-method
  definition: "A way of preventing rusting by keeping oxygen and water physically away from the iron: paint, oil or grease, plastic, or a coating of a less reactive metal such as tin for cans."
  ms_accepts: ["coat the iron to exclude oxygen and water", "painting/oiling/plating named as barriers"]
  ms_avoids: ["claiming a barrier method protects iron once the coating breaks", "listing galvanising purely as a barrier without its sacrificial role"]
  aliases: ["barrier methods"]
  source: "chem_v3_u2_c14_pdf165_0619"
- term: galvanising
  slug: galvanising
  definition: "Coating iron or steel with a layer of zinc. The zinc acts as a barrier while unscratched, and even when scratched it corrodes in place of the iron because zinc is more reactive — barrier plus sacrificial protection in one."
  ms_accepts: ["galvanised iron is zinc-coated iron", "the zinc oxidises preferentially, supplying electrons that keep iron from ionising"]
  ms_avoids: ["saying galvanised iron rusts once the zinc is scratched", "treating galvanising as only a barrier method"]
  aliases: ["galvanised iron", "galvanised steel"]
  source: "chem_v3_u2_c14_pdf165_0619"
- term: sacrificial protection
  slug: sacrificial-protection
  definition: "Attaching a block of a more reactive metal (zinc, magnesium or aluminium) to iron or steel so that the block corrodes instead of the iron. Used on ship hulls; the blocks are replaced when used up."
  ms_accepts: ["more reactive metal oxidises in preference to the iron", "the sacrificial anode must be more reactive than iron and replaced periodically"]
  ms_avoids: ["using a less reactive metal as the sacrificial anode", "saying the iron is coated in this method"]
  aliases: ["sacrificial anode", "sacrificial anodes"]
  source: "chem_v3_u2_c14_pdf166_0622"
