learning_objective: 'Understand how metals can be arranged in a reactivity series
  based on their reactions with: water; dilute hydrochloric or sulfuric acid; Understand
  how metals can be arranged in a reactivity series based on their displacement reactions
  between: metals and metal oxides; metals and aqueous solutions of metal salts; Know
  the order of reactivity of these metals: potassium, sodium, lithium, calcium, magnesium,
  aluminium, zinc, iron, copper, silver, gold; Know the conditions under which iron
  rusts; Understand how the rusting of iron may be prevented by: barrier methods;
  galvanising; sacrificial protection; Understand the terms: oxidation; reduction;
  redox; oxidising agent; reducing agent in terms of gain or loss of oxygen and loss
  or gain of electrons; Practical: Investigate reactions between dilute hydrochloric
  and sulfuric acids and metals (e.g. magnesium, zinc and iron)'
