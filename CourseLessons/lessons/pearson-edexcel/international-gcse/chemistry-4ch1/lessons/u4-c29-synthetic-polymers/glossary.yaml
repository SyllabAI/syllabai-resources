- term: polymer
  slug: polymer
  definition: "A giant molecule made of many repeating units joined together. Natural examples include proteins and starch; synthetic ones include poly(ethene) and PVC."
  ms_accepts: ["large molecule of many repeating units", "built from many small monomer molecules", "natural (protein, starch) and synthetic (plastics) examples"]
  ms_avoids: ["omitting the repeating-unit structure", "calling it just a big molecule with no monomer link"]
  aliases: ["polymers", "giant molecule"]
  source: "chem_v3_u4_c29_pdf311_1175"
- term: monomer
  slug: monomer
  definition: "A small molecule that joins with many others to make a polymer. Addition monomers carry C=C; condensation monomers carry two reactive end groups."
  ms_accepts: ["small molecule joined into a polymer", "many monomers make one polymer", "alkene monomers for addition"]
  ms_avoids: ["confusing with the polymer itself", "saying only one monomer is needed in condensation"]
  aliases: ["monomers"]
  source: "chem_v3_u4_c29_pdf312_1182"
- term: addition polymerisation
  slug: addition-polymerisation
  definition: "Polymerisation in which monomers carrying C=C simply add onto each other, opening the double bond, with nothing else formed and nothing lost."
  ms_accepts: ["monomers add without anything lost", "C=C double bond opens to join", "one monomer type repeats"]
  ms_avoids: ["omitting that nothing is expelled", "saying a small molecule is lost", "confusing with condensation"]
  aliases: ["addition polymerization"]
  source: "chem_v3_u4_c29_pdf312_1182"
- term: condensation polymerisation
  slug: condensation-polymerisation
  definition: "Polymerisation in which two different monomers join alternately, expelling a small molecule — usually water, sometimes hydrogen chloride — at every junction."
  ms_accepts: ["small molecule lost when monomers join", "two monomer types alternate", "water or hydrogen chloride eliminated"]
  ms_avoids: ["omitting the eliminated small molecule", "confusing with addition, where nothing is lost"]
  aliases: ["condensation polymerization"]
  source: "chem_v3_u4_c29_pdf317_1196"
- term: polyester
  slug: polyester
  definition: "A condensation polymer built from a diol and a dicarboxylic acid, stitched by ester groups. Examples: Terylene and PET; biodegradable members are biopolyesters."
  ms_accepts: ["condensation polymer of diol plus dicarboxylic acid", "contains ester linkages in the chain", "water eliminated as it forms"]
  ms_avoids: ["making it by addition polymerisation", "omitting one of the two monomer families"]
  aliases: ["polyesters"]
  source: "chem_v3_u4_c29_pdf317_1196"
- term: repeat unit
  slug: repeat-unit
  definition: "The structural fragment inside the brackets of a polymer formula that repeats along the chain; its bonds extend outside the brackets to the next units."
  ms_accepts: ["part of the polymer that repeats", "drawn in square brackets with subscript n", "continuation bonds extend outside the brackets"]
  ms_avoids: ["confusing with the monomer before the double bond is restored", "omitting the continuation bonds"]
  aliases: ["repeating unit", "repeating units"]
  source: "chem_v3_u4_c29_pdf312_1181"
- term: initiator
  slug: initiator
  definition: "The substance used to start addition polymerisation. It is consumed in the reaction, so it must not be called a catalyst."
  ms_accepts: ["starts the polymerisation", "used up / consumed in the reaction", "not a catalyst"]
  ms_avoids: ["calling it a catalyst", "saying it speeds the reaction without being consumed"]
  aliases: ["initiators"]
  source: "chem_v3_u4_c29_pdf312_1179"
- term: poly(ethene)
  slug: polyethene
  definition: "The addition polymer of ethene, commonly called polythene. Actually an alkane-like saturated chain that will not decolourise bromine water; LDPE bags, HDPE bottles."
  ms_accepts: ["addition polymer of ethene", "saturated, does not decolourise bromine water", "low-density for films and bags, high-density for bottles"]
  ms_avoids: ["saying it still contains C=C", "calling it an alkene"]
  aliases: ["polyethene", "polythene", "LDPE", "HDPE"]
  source: "chem_v3_u4_c29_pdf312_1183"
- term: saturated
  slug: saturated
  definition: "Carrying only single bonds, with no double bond left to react. Addition polymers are saturated because the monomers' C=C bonds are spent in the joining."
  ms_accepts: ["only single carbon bonds", "will not decolourise bromine water", "C=C consumed during polymerisation"]
  ms_avoids: ["applying it to the alkene monomer", "saying saturated molecules are unreactive in every way"]
  aliases: ["saturation"]
  source: "chem_v3_u4_c29_pdf312_1182"
- term: poly(propene)
  slug: polypropene
  definition: "The addition polymer of propene, formerly called polypropylene. Stronger than poly(ethene); used for ropes and crates; recycling mark PP."
  ms_accepts: ["addition polymer of propene", "stronger than poly(ethene)", "used for ropes and crates"]
  ms_avoids: ["omitting the CH3 side-group on the repeat unit", "confusing with poly(ethene)"]
  aliases: ["polypropene", "polypropylene", "PP"]
  source: "chem_v3_u4_c29_pdf314_1187"
- term: poly(chloroethene)
  slug: polychloroethene
  definition: "The addition polymer of chloroethene, better known as PVC (polyvinylchloride). Strong and rigid for pipes and windows; plasticisers make it flexible; an electrical insulator."
  ms_accepts: ["addition polymer of chloroethene", "PVC", "rigid for pipes; plasticisers add flexibility; insulator"]
  ms_avoids: ["omitting the chlorine atom on the repeat unit", "saying plasticisers are part of the polymer chain"]
  aliases: ["PVC", "polyvinylchloride", "polychloroethene"]
  source: "chem_v3_u4_c29_pdf314_1187"
- term: plasticiser
  slug: plasticiser
  definition: "An additive that makes a rigid polymer such as PVC flexible, opening uses such as sheet floor coverings and clothing."
  ms_accepts: ["makes PVC flexible", "an additive mixed with the polymer", "enables flexible uses like floor coverings"]
  ms_avoids: ["calling it part of the polymer chain", "saying it changes the repeat unit"]
  aliases: ["plasticisers"]
  source: "chem_v3_u4_c29_pdf314_1188"
- term: poly(tetrafluoroethene)
  slug: ptfe
  definition: "The addition polymer of tetrafluoroethene (CF2=CF2), known as PTFE or Teflon. Very unreactive because of strong carbon-fluorine bonds; non-stick coatings and chemical-resistant linings."
  ms_accepts: ["addition polymer of tetrafluoroethene", "PTFE / Teflon", "unreactive due to strong C-F bonds", "non-stick and chemical-lining uses"]
  ms_avoids: ["saying fluorine's element reactivity transfers to the polymer", "omitting the strong C-F bond reason"]
  aliases: ["PTFE", "Teflon", "polytetrafluoroethene"]
  source: "chem_v3_u4_c29_pdf315_1190"
- term: non-biodegradable
  slug: non-biodegradable
  definition: "Unable to be broken down by bacteria in the environment. Addition polymers are non-biodegradable because their strong covalent bonds make them essentially inert."
  ms_accepts: ["bacteria cannot break it down", "strong covalent bonds make it inert", "persists in the environment"]
  ms_avoids: ["saying it rots slowly like paper", "omitting the inertness reason"]
  aliases: ["nonbiodegradable"]
  source: "chem_v3_u4_c29_pdf316_1193"
- term: landfill
  slug: landfill
  definition: "Disposal by burial in large holes in the ground. Cheap and free of toxic gases from the plastics, but ugly, smelly, space-hungry and the waste stays unchanged for thousands of years."
  ms_accepts: ["burying waste in the ground", "cheap, no gases produced from plastics", "waste remains for thousands of years; uses large areas"]
  ms_avoids: ["claiming plastic degrades in landfill", "omitting the long-term persistence"]
  aliases: ["landfill sites"]
  source: "chem_v3_u4_c29_pdf316_1193"
- term: incineration
  slug: incineration
  definition: "Disposal by burning. Requires little space and the heat can generate electricity, but it produces greenhouse gases, releases toxic gases such as CO and HCl, and leaves ash for landfill."
  ms_accepts: ["burning plastic waste", "heat used to generate electricity", "produces CO2 and toxic gases; ash still landfilled"]
  ms_avoids: ["calling it a clean solution", "omitting the toxic gases"]
  aliases: ["incinerate", "burning plastics"]
  source: "chem_v3_u4_c29_pdf316_1193"
- term: diol
  slug: diol
  definition: "An alcohol molecule with one -OH group at each end. Ethane-1,2-diol (CH2OHCH2OH) and propane-1,3-diol are the chapter's examples; one of the two polyester monomers."
  ms_accepts: ["alcohol with two -OH groups", "one at each end of the molecule", "condensation monomer for polyesters"]
  ms_avoids: ["confusing with a mono-ol such as propan-1-ol", "omitting the two-end structure"]
  aliases: ["diols", "ethane-1,2-diol", "propane-1,3-diol"]
  source: "chem_v3_u4_c29_pdf317_1196"
- term: dicarboxylic acid
  slug: dicarboxylic-acid
  definition: "A carboxylic molecule with one -COOH group at each end. Ethanedioic acid (HOOCCOOH) and hexane-1,6-dioic acid are the chapter's examples; the other polyester monomer."
  ms_accepts: ["molecule with two -COOH groups", "one at each end", "condensation monomer for polyesters"]
  ms_avoids: ["confusing with an ordinary monocarboxylic acid", "omitting the two-end structure"]
  aliases: ["dicarboxylic acids", "ethanedioic acid", "hexane-1,6-dioic acid"]
  source: "chem_v3_u4_c29_pdf318_1198"
- term: ester link
  slug: ester-link
  definition: "The -COO- group formed wherever a diol and a dicarboxylic acid join in condensation polymerisation, with water expelled; the same group that defines esters."
  ms_accepts: ["-COO- group joining the monomers", "formed with loss of water", "repeats along the polyester chain"]
  ms_avoids: ["leaving -COOH inside the repeat unit", "confusing with the unreacted acid group"]
  aliases: ["ester group", "ester linkage", "ester links"]
  source: "chem_v3_u4_c29_pdf318_1198"
- term: biopolyester
  slug: biopolyester
  definition: "A biodegradable polyester: a condensation polymer whose ester links let it break down much more quickly than ordinary polymers. PLA is the flagship example."
  ms_accepts: ["biodegradable polyester", "breaks down much more quickly", "PLA is an example"]
  ms_avoids: ["saying it decomposes instantly", "confusing with ordinary addition polymers"]
  aliases: ["biopolyesters", "biodegradable polyester"]
  source: "chem_v3_u4_c29_pdf319_1202"
- term: polylactic acid
  slug: polylactic-acid
  definition: "PLA, the biodegradable polyester made from lactic acid obtained from corn starch. Used for biodegradable plastic bags and in surgery for internal stitches."
  ms_accepts: ["biodegradable polyester from lactic acid", "lactic acid obtained from corn starch", "used for bags and surgical stitches"]
  ms_avoids: ["omitting the corn-starch source", "saying it is an addition polymer"]
  aliases: ["PLA", "polylactide"]
  source: "chem_v3_u4_c29_pdf319_1202"
