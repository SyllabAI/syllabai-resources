# glossary — u2:c15 (ms layer: every entry needs ms_accepts; definition ≤40 words)
# All sources are chunkRefs into the parse of record (chunks_v3) — provenance law.
- term: ore
  slug: ore
  definition: "A sample of rock that contains enough of a metal-containing mineral for it to be worthwhile to extract the metal. Most metals are extracted from ores found in the Earth's crust."
  ms_accepts: ["rock containing enough metal or metal compound to make extraction worthwhile", "source rock from which a metal is economically extracted"]
  ms_avoids: ["defining an ore as any rock containing a metal", "omitting the worthwhile/economic half of the definition"]
  aliases: ["ores"]
  source: "chem_v3_u2_c15_pdf169_0631"
- term: mineral
  slug: mineral
  definition: "An individual metal compound found in rock, such as an oxide or sulfide of the metal. Minerals in real rock are mixed with unwanted material."
  ms_accepts: ["an individual compound of a metal found in the Earth's crust", "e.g. iron oxides or sulfides as minerals of iron"]
  ms_avoids: ["using mineral and ore as identical terms — an ore is the rock, the mineral is the compound", "calling native (uncombined) metals minerals"]
  aliases: ["minerals"]
  source: "chem_v3_u2_c15_pdf169_0631"
- term: native
  slug: native
  definition: "Describes a metal found naturally as the uncombined element, requiring no chemical extraction. Gold is found native; silver and copper are, much more rarely."
  ms_accepts: ["exists naturally as the uncombined element", "found as the element itself, not in compounds"]
  ms_avoids: ["saying native metals are just very pure extracted metals", "attributing native occurrence to density or physical settling"]
  aliases: ["found native", "uncombined element"]
  source: "chem_v3_u2_c15_pdf169_0631"
- term: roasting
  slug: roasting
  definition: "Heating a metal sulfide ore in air to convert it to the oxide, with sulfur dioxide released as the sulfur leaves. 2ZnS(s) + 3O₂(g) → 2ZnO(s) + 2SO₂(g)."
  ms_accepts: ["heating the sulfide in air to form the oxide", "sulfide + oxygen → oxide + sulfur dioxide"]
  ms_avoids: ["calling any heating of an ore roasting — the reactant must be a sulfide converting to oxide", "omitting sulfur dioxide as the sulfur product"]
  aliases: ["roast"]
  source: "chem_v3_u2_c15_pdf169_0631"
- term: reduction
  slug: reduction
  definition: "Loss of oxygen by a substance — or, in the electron definition, gain of electrons. Obtaining a metal from its oxide is reduction of the metal compound."
  ms_accepts: ["loss of oxygen / gain of electrons", "the metal oxide is reduced because oxygen is removed and the metal ion gains electrons"]
  ms_avoids: ["saying reduction means the substance loses electrons", "naming the reducing agent as the reduced substance"]
  aliases: ["reduced", "reduce"]
  source: "chem_v3_u2_c15_pdf170_0636"
- term: oxidation
  slug: oxidation
  definition: "Gain of oxygen by a substance — or, in the electron definition, loss of electrons. At the anode in aluminium extraction, oxide ions are oxidised to oxygen."
  ms_accepts: ["gain of oxygen / loss of electrons", "oxide ions losing electrons at the anode"]
  ms_avoids: ["saying oxidation means gaining electrons", "labelling the cathode reaction as oxidation"]
  aliases: ["oxidised", "oxidise"]
  source: "chem_v3_u2_c15_pdf171_0640"
- term: reducing agent
  slug: reducing-agent
  definition: "The substance that removes oxygen from another substance (donating electrons in electron terms) while being oxidised itself. Carbon reduces iron(III) oxide; carbon monoxide is the blast furnace's main reducing agent."
  ms_accepts: ["the substance taking oxygen (or donating electrons), itself oxidised", "carbon (or carbon monoxide) for iron extraction"]
  ms_avoids: ["saying the reducing agent is reduced", "naming the metal as the reducing agent in its own extraction"]
  aliases: ["reducing agents"]
  source: "chem_v3_u2_c15_pdf170_0637"
- term: blast furnace
  slug: blast-furnace
  definition: "The furnace in which iron is extracted from its ore by reduction with carbon monoxide. Detailed internal chemistry is not required by the course."
  ms_accepts: ["the tower furnace where iron ore is reduced to iron", "carbon monoxide acting as the main reducing agent inside it"]
  ms_avoids: ["detailed furnace-stage descriptions the syllabus excludes", "saying the furnace itself is the reducing agent"]
  aliases: ["furnace"]
  source: "chem_v3_u2_c15_pdf170_0637"
- term: cryolite
  slug: cryolite
  definition: "A molten salt in which aluminium oxide is dissolved for electrolysis. It lowers the operating temperature from over 2000 °C to around 1000 °C, saving energy and money."
  ms_accepts: ["dissolves the aluminium oxide so electrolysis runs at about 1000 °C instead of over 2000 °C", "its purpose is to save energy, not to react"]
  ms_avoids: ["calling cryolite a catalyst", "saying cryolite lowers the melting point of the oxide itself rather than providing a lower-temperature medium"]
  aliases: ["molten cryolite"]
  source: "chem_v3_u2_c15_pdf171_0640"
- term: alloy
  slug: alloy
  definition: "A mixture of a metal with one or more other elements, usually other metals or carbon. Brass (copper and zinc) and steel (iron and carbon) are standard examples."
  ms_accepts: ["a mixture of a metal with one or more elements, usually other metals or carbon", "e.g. steel as iron mixed with carbon"]
  ms_avoids: ["calling an alloy a compound", "omitting that the base must be a metal"]
  aliases: ["alloys"]
  source: "chem_v3_u2_c15_pdf172_0642"
- term: brass
  slug: brass
  definition: "An alloy of copper and zinc. A standard named example used to test the alloy definition."
  ms_accepts: ["a mixture of copper and zinc", "an alloy whose base metal is copper and whose added element is zinc"]
  ms_avoids: ["confusing brass with bronze (copper and tin)", "giving only 'a mixture of metals' without the elements"]
  aliases: []
  source: "chem_v3_u2_c15_pdf172_0642"
- term: bronze
  slug: bronze
  definition: "An alloy of copper and tin — among the oldest engineered alloys."
  ms_accepts: ["a mixture of copper and tin", "copper hardened by the addition of tin"]
  ms_avoids: ["swapping the tin for zinc (that is brass)", "describing bronze as a pure metal"]
  aliases: []
  source: "chem_v3_u2_c15_pdf172_0644"
- term: cupronickel
  slug: cupronickel
  definition: "A mixture of copper and nickel, usually used to make 'silver' coins — silvery in appearance with no silver content."
  ms_accepts: ["copper and nickel alloy used for 'silver' coins", "coinage metal chosen for durability and appearance"]
  ms_avoids: ["saying silver coins contain silver", "mixing up the components with brass or bronze"]
  aliases: ["copper-nickel alloy"]
  source: "chem_v3_u2_c15_pdf172_0644"
- term: steel
  slug: steel
  definition: "An alloy of iron with carbon. Many steels exist with various carbon proportions and sometimes other metals; the course limits the types to mild, high-carbon and stainless."
  ms_accepts: ["iron alloyed with carbon", "alloy of iron and carbon whose properties depend on the carbon percentage"]
  ms_avoids: ["defining steel as a pure metal or as pure iron", "forgetting that carbon, not another metal, is the defining addition"]
  aliases: ["steels"]
  source: "chem_v3_u2_c15_pdf173_0646"
- term: mild steel
  slug: mild-steel
  definition: "Low-carbon steel, iron containing up to about 0.25% carbon. Strong, malleable and ductile; used for nails, car bodies, ships, girders and bridges; rusts and is about three times denser than aluminium."
  ms_accepts: ["iron with up to about 0.25% carbon", "strong, easily shaped, used for car bodies and girders — but rusts"]
  ms_avoids: ["saying mild steel contains no carbon", "claiming mild steel resists corrosion"]
  aliases: ["low-carbon steel"]
  source: "chem_v3_u2_c15_pdf173_0646"
- term: high-carbon steel
  slug: high-carbon-steel
  definition: "Steel containing about 0.6–1.2% carbon (variable), usually with small amounts of manganese. Harder and more wear-resistant than mild steel but more brittle; used for cutting tools."
  ms_accepts: ["iron with about 0.6–1.2% carbon", "harder and more wear-resistant but more brittle — cutting tools"]
  ms_avoids: ["swapping the properties with mild steel", "omitting the brittleness trade-off"]
  aliases: ["high carbon steel"]
  source: "chem_v3_u2_c15_pdf173_0646"
- term: stainless steel
  slug: stainless-steel
  definition: "An alloy of iron with chromium and often nickel. Chromium forms a strong protective oxide layer, so stainless steel is very resistant to corrosion; significantly more expensive than mild steel."
  ms_accepts: ["iron with chromium (and usually nickel)", "chromium's oxide layer protects the iron, giving corrosion resistance"]
  ms_avoids: ["attributing corrosion resistance to chromium being unreactive", "omitting chromium as the anti-rust ingredient"]
  aliases: ["stainless"]
  source: "chem_v3_u2_c15_pdf174_0648"
- term: malleable
  slug: malleable
  definition: "Can be easily hammered into various shapes. A property of mild steel that layers of ions sliding over each other explains — and that alloys lose when the lattice is disrupted."
  ms_accepts: ["can be hammered into shape", "property explained by planes of ions sliding in the regular lattice"]
  ms_avoids: ["confusing malleable with ductile (drawn into wires)", "explaining malleability via electrons rather than sliding ion layers"]
  aliases: ["malleability"]
  source: "chem_v3_u2_c15_pdf173_0646"
- term: ductile
  slug: ductile
  definition: "Can be drawn into wires. Mild steel and copper are ductile; copper's ductility joins its conductivity to earn the electrical-wire use."
  ms_accepts: ["can be drawn out into wires", "e.g. copper ductility combined with electrical conductivity for wires"]
  ms_avoids: ["confusing ductile with malleable (hammered into shape)", "attributing ductility to strong bonding rather than sliding layers"]
  aliases: ["ductility"]
  source: "chem_v3_u2_c15_pdf173_0646"
- term: reactivity series
  slug: reactivity-series
  definition: "The ranked list of metals by reactivity, with carbon as the reference point that splits extraction methods: metals below it are reduced by carbon, metals above it require electrolysis."
  ms_accepts: ["metals in order of reactivity with carbon marking the carbon-reduction/electrolysis boundary", "K, Na, Ca, Mg, Al above (C); Zn, Fe, Cu below (C)"]
  ms_avoids: ["listing metals alphabetically", "omitting carbon's reference role in extraction decisions"]
  aliases: ["activity series"]
  source: "chem_v3_u2_c15_pdf170_0637"
