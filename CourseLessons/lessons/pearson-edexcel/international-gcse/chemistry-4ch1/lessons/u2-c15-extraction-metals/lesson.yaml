learning_objective: Know that most metals are extracted from ores found in the Earth’s
  crust and that unreactive metals are often found as the uncombined element; Explain
  how the method of extraction of a metal is related to its position in the reactivity
  series, illustrated by carbon extraction for iron and electrolysis for aluminium;
  Be able to comment on a metal extraction process, given appropriate information
  (detailed knowledge of the processes used in the extraction of a specific metal
  is not required); Explain the uses of aluminium, copper, iron and steel in terms
  of their properties (the types of steel will be limited to low-carbon (mild), high-carbon
  and stainless); Know that an alloy is a mixture of a metal and one or more elements,
  usually other metals or carbon; Explain why alloys are harder than pure metals
