# lint rules — chemistry (chem@0.1.0)
# Grows ONLY via findings (lint-gap / lint-false-positive). Removing a ban
# requires a finding proving the ban wrong (VALIDATION.md §3).

banned_phrases:
  - "free electrons"                       # say: delocalised electrons
  - "sea of electrons"                     # unqualified model-speak at IGCSE
  - "particles expand"                     # misconception: spaces increase, particle size does not
  - "the equilibrium shifts to use up"     # teleology banned at IGCSE; say: the position of equilibrium moves so that...

banned_regex:
  - '\(l\)'                                # OCR artifact: state symbol (l) vs identity (I) — review-checked
  - '[\uFFFD]'                             # mojibake replacement char
