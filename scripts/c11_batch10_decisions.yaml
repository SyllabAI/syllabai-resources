command_kinds:
- code: 4CH1-4.23
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the alkene functional group — a carbon-carbon double bond
    (C=C) shown as two lines between the two carbon atoms
- code: 4CH1-4.24
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the alkene general formula CnH2n
- code: 4CH1-4.25
  verb: explain
  guide_class: EXPLAIN_HOW
  demanded_substance: why alkenes are UNSATURATED — the C=C bond can open so each
    carbon forms additional single bonds with incoming atoms (they make more
    bonds than the saturated alkane surface allows)
- code: 4CH1-4.26
  verb: understand
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: drawing structural and displayed formulae for alkenes with
    up to four carbon atoms (ethene, propene, but-1-ene — the note's first-four
    table)
- code: 4CH1-4.27
  verb: describe
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: the alkene+bromine addition reaction — bromine atoms add
    across C=C to give a dibromoalkane (ethene + bromine -> dibromoethane); the
    same process works for any halogen and any alkene
- code: 4CH1-4.28
  verb: describe
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: the bromine-water test — orange bromine water decolourises
    with an alkene (bromine adds across C=C) and stays orange with an alkane;
    bromine water is used as it is safer and easier to handle than bromine
- code: 4CH1-4.29C
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the alcohol functional group — hydroxyl (-OH), the part of
    alcohol molecules responsible for their characteristic reactions
- code: 4CH1-4.30C
  verb: understand
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: drawing structural and displayed formulae for methanol,
    ethanol, propan-1-ol and butan-1-ol (the first four alcohols); naming via
    the alkane system with the final e replaced by ol
- code: 4CH1-4.31C
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the three oxidation routes of ethanol — combustion
    (burning in air, to carbon dioxide and water), aerobic oxidation (microbial,
    to ethanoic acid), and treatment with an oxidising agent (heated potassium
    dichromate(VI) in sulfuric acid, [O] notation, orange-to-green)
- code: 4CH1-4.32C
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the two ethanol manufacture routes — hydration of ethene
    (steam, ~300C, 60-70 atm, concentrated phosphoric acid catalyst) and
    fermentation of glucose (yeast, 25-35C optimum 30C, absence of oxygen)
- code: 4CH1-4.33C
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: why fermentation runs in the absence of air (anaerobic
    respiration — oxygen would give aerobic oxidation instead) and at an optimum
    temperature (~30C — too low slows the enzymes, too high denatures them)
- code: 4CH1-4.34C
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the carboxylic-acid functional group — carboxyl (-COOH);
    the general formula CnH2n+1COOH (RCOOH) with the n-counts-the-alkyl-chain
    caveat
- code: 4CH1-4.35C
  verb: understand
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: drawing structural and displayed formulae for unbranched-
    chain carboxylic acids (methanoic, ethanoic, propanoic, butanoic — alkan +
    oic acid naming)
- code: 4CH1-4.36C
  verb: describe
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: the reactions of aqueous carboxylic acids — with metals
    (salt + hydrogen, e.g. magnesium ethanoate) and with carbonates (salt + water
    + carbon dioxide); the salts end in -anoate
- code: 4CH1-4.37C
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: vinegar is an aqueous solution of ethanoic acid (~5% acid
    by volume)
