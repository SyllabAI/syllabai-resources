section_overrides:
  types-of-number::7:
    current_code: 4MA1-1.1G
    disposition: REATTRIBUTE
    override_code: 4MA1-1.4B
    tier_wording_source: ledger
    evidence: >-
      the section defines square numbers (repeated multiplication, the first 15,
      powers of 2) — the Foundation wording of 1.4B per the C30 ledger ('calculate
      squares, square roots, cubes and cube roots'; the store's operative 1.4B
      wording is the Higher surds text); 1.1G is the odd/even/prime/factors/
      multiples terminology and the note-level join stands via its terminology
      sections — the same class as the R6 ord-9 square-roots ruling (ords 7-8 were
      unsampled there). R9 row 41dcd33bd8bca1d9
  types-of-number::8:
    current_code: 4MA1-1.1G
    disposition: REATTRIBUTE
    override_code: 4MA1-1.4B
    tier_wording_source: ledger
    evidence: >-
      the section defines cube numbers — the Foundation wording of 1.4B per the C30
      ledger ('calculate squares, square roots, cubes and cube roots'); 1.1G is the
      terminology code; the note-level join stands — the same class as the R6
      ord-9 ruling and its ord-7 sibling in this round. R9 row 0df9dfd058a1ec92
  ratios-and-fdp::2:
    current_code: 4MA1-1.7B
    disposition: REATTRIBUTE
    override_code: 4MA1-1.7E
    tier_wording_source: store
    evidence: >-
      the section teaches harder ratio questions COMBINED with fractions and
      percentages (finding fractions/percentages of ratio quantities) — 1.7E 'solve
