      reverse-percentage sections — the same class as the operator's R1 ord-2
      override on this note (percentage-of-an-amount -> 1.6E). R9 row
      bcba14c9e69b6c10
  range-and-quartiles::4:
    current_code: 4MA1-6.2B
    disposition: REATTRIBUTE
    override_code: 4MA1-6.2C
    tier_wording_source: store
    evidence: >-
      the section procedurally FINDS quartiles (lower/upper quartiles, the L+H/n
      methods on discrete data) — 6.2C 'find the interquartile range from a
      discrete data set' is the surface; 6.2B's Higher demand is the CONCEPT of a
      measure of spread (its C30 ledger Foundation wording names mean/median/mode/
      range, not quartiles) and the note-level join stands via its spread-concept
      sections. R9 row 26b042684607e045
  related-calculations::2:
    current_code: 4MA1-1.8D
    disposition: DEMOTE_TO_WORKLIST
    override_code: null
    evidence: >-
      DEMOTE — the scope §4 R1 surface-3 menu's second action, exercised for the
      first time in the loop. The section defines inverse operations and
      related-fact derivation (3x5=15 -> 15/3=5, sqrt(9)=3); 1.8D's demand is
      'use estimation to evaluate approximations to numerical calculations' and the
      section is not estimation; no canonical 188 row teaches arithmetic inverse
      operations (the only 'inverse' wordings in the ratified 188 are 1.2H
      multiplicative inverses, 2.5A inverse proportion and 3.2D inverse functions
      — none is this surface). The note-level join STANDS (see
      note_level_adjudications), so a section-level REATTRIBUTE has no target and
      a RETAIN would knowingly re-create the scope difference for the R13 re-gate
      to reject again: the honest disposition is the menu's DEMOTE — the chunk
      leaves the anchored surface for the unresolved-span worklist, recorded with
      this reason, never forced. R9 row 988bcf024c79e126

note_level_adjudications:
  contract: >-
    questions the R9 record left open or raised, adjudicated this round on the
    notes' full rendered text (not the sampled sections alone); recorded so the
    R11 join re-run and the R12 re-build land exactly one truth
  related-calculations-note-join:
    question: >-
      the R9 fresh root (row 988bcf024c79e126) recorded 'the note-level join 1.8D
      looks like a T-SPEC-era name-fragment approximation' — the note-level join
      question was therefore OPEN at R10
    ruling: THE NOTE-LEVEL JOIN STANDS
    evidence: >-
      the note's ord-3 section ('What types of related calculations are there?',
      2423 chars) carries genuine estimation-to-check content: an Exam Hint ('Use
      estimation to check your answer is sensible. Rounding numbers to one
      significant figure can help you estimate the correct order of magnitude.
      E.g. If the answer should be closer to 20 or 2 or 200') and a full worked
      example ('Explain how you can use estimation to check your answer for part
      (iii) — Estimate 68.8 ÷ 4.3 by rounding each number to one significant
      figure; 70 ÷ 4 = 17.5') — that is 1.8D's demand ('use estimation to evaluate
      approximations to numerical calculations') taught verbatim; 1.8D is NOT a
      C30 ledger code (Foundation-only, the same estimation wording at both
      tiers), so the R9 reject is not a wording-tier artifact; the defective
      surface is the ord-2 inverse-operations SECTION alone, which DEMOTEs (see
      section_overrides)
    consequence: >-
      the note keeps its 1.8D anchor (ords 0,1,3 stay anchored; ord 0 is the
      heading-only class resolved by the convention); the R11 census is UNCHANGED
      at 198 joined / 5 unresolved / 120 distinct codes except as the re-points
      move them

heading_only_convention:
  decision: c42-heading-only-convention-1
  record: graph/reports/C42_R10_HEADING_ONLY_CONVENTION.md
  ruling_summary: >-
    a heading-only chunk (norm(chunk text) == norm(heading) — the chunk's rendered
    text is exactly its heading) is a STRUCTURAL slice of the corpus's own
    spec_point span, not a semantic defect: its chunk→SP row carries the SPAN's
    standing (the span marker IS the corpus's own claim of what the content
    teaches), resolved fail-closed by the convention's four-branch evidence
    ladder; never again a per-row ad-hoc HOLD
  rows_on_the_r9_sheet: 13 (11 fresh HOLDs + 2 carried R1-era heading-only
    RETAIN HOLDs — listed in
    graph/reports/C42_R10_REPAIR_PROPOSALS.json surface3)
  operator_sign_off: retained (the C12/C13 operator-delegate convention; the
    decision is reviewable and reversible by the operator before R5)

