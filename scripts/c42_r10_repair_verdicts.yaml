verdicts:
  spcpt_GVgyB5BVfNDYGf8M:
    note_title: Expanding Triple Brackets
    prior_code: 4MA1-2.2E
    disposition: CORRECT
    corrected_code: 4MA1-2.2A
    tier_wording_source: store
    evidence: >-
      2.2A 'expand the product of two or more linear expressions' (Higher) is
      verbatim the note's teaching (ord-1 dossier — expanding the product of THREE
      linear expressions by the grid method with worked examples; the note-title
      head ord 0 is the heading-only class resolved by the convention); 2.2E's
      operative Higher wording is 'use algebra to support and construct proofs' —
      unrelated content — and its C30 ledger Foundation wording ('expand the
      product of two simple linear expressions') covers TWO brackets, not three,
      so the both-tier check exonerates neither tier of 2.2E: the note-level join
      is a T-SPEC resolution error the C40/R4 samples never drew (R9 fresh row
      998c7d61c8cfb1a8, root note-level-class). The store's 2.2A wording is the
      exact surface; the sibling expanding-double-brackets note keeps 2.2E
      coverage alongside Algebraic Proof, and substitution.json already joins
      2.2A (the re-point adds a second note to a covered code)
  spcpt_pqWsmktWyMCRfTk6:
    note_title: Simplifying Algebraic Fractions
    prior_code: 4MA1-1.2A
    disposition: CORRECT
    corrected_code: 4MA1-2.2C
    tier_wording_source: store
    evidence: >-
      2.2C 'manipulate algebraic fractions where the numerator and/or the
      denominator can be numeric, linear or quadratic' (Higher) is verbatim the
      note's teaching (ord-2 dossier — simplifying ALGEBRAIC fractions by full
      factorisation and cancelling common factors incl. common brackets); 1.2A is
      numerical-fraction equivalence/simplifying and the R6 repair of Basic
      Fractions (numerical) does not extend to this note — the note-level join is
      a T-SPEC P1_name_fragment_join resolution error, new catch at R9 (fresh row
      6ab17e03c20b4d95, root note-level-class). CORROBORATION: all three sibling
      notes in the same corpus tree (adding-and-subtracting-algebraic-fractions,
      multiplying-and-dividing-algebraic-fractions,
      solving-algebraic-fractions) join H-2.2C correctly — this note is the
      outlier; 1.2A keeps coverage via the R6-repaired Basic Fractions note

