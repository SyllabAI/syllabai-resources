schema: c42-r10-repair-verdicts/1.0
task: T-C42
stage: r10-r1-shaped-verdict-round-over-the-r9-defect-inventory
contract: >-
  graph/reports/C42_IGCSE_MATHS_A_K2B_REWORK_SCOPE.md §4 R1 mechanics + §7 loop
  ("the rework lane repeats R1-shaped rounds only by explicit operator instruction");
  the DEMOTE-to-worklist disposition is the scope §4 R1 surface-3 menu's second
  action ("REATTRIBUTE / DEMOTE-to-worklist / RETAIN per row"), exercised here for
  the first time in the loop
directive: >-
  an R1-shaped round over the R9 inventory (then R7/R8/R9 again), the
  heading-only-chunk convention decision (2026-10-03, zai-web) — fired over the
  R9 re-gate's defect inventory (10 reject rows in
  scripts/c42_r9_fresh_verdicts.yaml; the R9 gate FAILED at exact-stratum
  76.8% < 90%); lane numbering follows the loop's iteration-2 precedent (the
  'R2/R3/R4 re-run' directive executed as R6/R7/R8): this round is R10, the
  join re-run is R11, the substrate re-build is R12, the re-gate is R13; R5
  stays reserved for the §18 apply (operator gate 3)
review_date: '2026-10-03'
reviewer: >-
  Super Z (GLM agent), operator-delegate under the fired R10 directive; the human
  operator retains final sign-off; per the anti-forgery rule nothing here promotes store
  rows (the substrate stays SUGGESTED and the C41-promoted 73 edges are untouched)
method: >-
  per-row adjudication over the R9 fresh verdicts' root causes + canonical-surface
  citations + the ratified 188-point store wordings + the C30 tier-dedupe ledger's
  Foundation wordings + the notes' own chunk content (the related-calculations
  note-level question was adjudicated on the note's full rendered text, not the
  sampled section alone); the deterministic candidates of
  scripts/c42_r10_repair_proposals.py were PROPOSAL-ONLY inputs and bound nothing
  (their top-1s are deliberately noisy); PMT excluded as source
key_finding: >-
  the R9 rejects split three ways: 2 are NOTE-LEVEL-CLASS T-SPEC resolution errors
  the C40/R4/R9 exact-sample never drew before (a triple-brackets note on an
  algebra-for-proofs code — whose Foundation wording covers two brackets only, so
  the R1 standing instruction's both-tier check itself exonerates neither tier of
  2.2E — and an algebraic-fractions note on a numerical-fractions code, whose three
  sibling notes all join 2.2C correctly); 7 are SECTION-level scope differences of
  exactly the R1/R6 classes (two ledger-wording surfaces, three verbatim Higher
  surfaces, one Foundation verbatim surface, one IQR procedure); and 1 (the
  unresolved-class section) triggered a NOTE-LEVEL ADJUDICATION that went the OTHER
  way from the R9 root's suspicion: the related-calculations note-level join to
  1.8D STANDS on the note's ord-3 estimation-to-check surface (rounding to one
  significant figure, order-of-magnitude sense checks — the 1.8D demand verbatim),
  so the note keeps its anchor and the defective SECTION alone is DEMOTED to the
  worklist (no canonical 188 row teaches arithmetic inverse operations — the only
  'inverse' wordings in the ratified 188 are multiplicative inverses 1.2H, inverse
  proportion 2.5A and inverse functions 3.2D). 2 codes are CORRECTED into the
  ratified 188, 0 are cleared (the counts stay 222/214/8), 7 section-level rows
  are REATTRIBUTE'd, 1 section-level row is DEMOTEd to the worklist (recorded,
  never forced), and the heading-only chunk class is resolved by the round's
  convention decision c42-heading-only-convention-1
  (graph/reports/C42_R10_HEADING_ONLY_CONVENTION.md) rather than by per-row
  re-points — the class is a STRUCTURAL class (~204 of 862 anchored rows), not a
  defect class
dispositions:
  CORRECT: the code changes to the corrected_code (canonical 188 member)
  UNRESOLVED: >-
    no canonical row teaches the note's content — the wrong code is CLEARED
    (resolved_code -> null), never forced (NOT exercised this round)
