      demand is 'divide a quantity in a given ratio or ratios' and the note-level
      join stands via its divide-in-a-ratio sections. R9 row 9ae9976901a946fe
  converting-between-fdp::1:
    current_code: 4MA1-1.2G
    disposition: REATTRIBUTE
    override_code: 4MA1-1.6C
    tier_wording_source: store
    evidence: >-
      the section teaches percentage -> decimal (divide by 100) — 1.6C 'express a
      percentage as a fraction and as a decimal' is the surface verbatim; 1.2G's
      demand is the fraction->decimal/percentage direction and the note-level join
      stands via its other direction sections. R9 row e54fc84c271915b3
  classifying-stationary-points::2:
    current_code: 4MA1-3.4C
    disposition: REATTRIBUTE
    override_code: 4MA1-3.4D
    tier_wording_source: store
    evidence: >-
      the section classifies turning points USING GRAPH SHAPES (positive/negative
      parabolas, cubics) — 3.4D 'distinguish between maxima and minima by
      considering the general shape of the graph only' is the surface verbatim, the
      same class as the operator's own R6 ord-3 ruling on
      problem-solving-with-differentiation; 3.4C demands determination BY
      DIFFERENTIATION and the note-level join stands via its
      differentiation-method sections. R9 row db3eb3cb32adf399
  basic-percentages::1:
    current_code: 4MA1-1.6F
    disposition: REATTRIBUTE
    override_code: 4MA1-1.6A
    tier_wording_source: ledger
    evidence: >-
      the section defines what a percentage IS (parts per hundred, the percent
      symbol, a conversions preview) — the Foundation wording of 1.6A per the C30
      ledger ('understand that percentage means number of parts per 100'; the
      store's operative 1.6A wording is the Higher repeated-percentage-change
