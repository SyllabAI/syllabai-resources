section_overrides:
  basic-probability::1:
    mapping_id: a5b737e510606829
    current_code: 4MA1-6.3A
    disposition: DEMOTE_TO_WORKLIST
    override_code: null
    tier_wording_source: store
    evidence: >-
      THE FIRED DEFECT (1 of 2) — the R38 fresh REJECT, now verdicted (the
      R36 a107f5041769fdd9 shape generalized to a 2-row batch: the
      of-record judgment's disposition lands as the repair round's
      carrier). The section's verbatim content (read from the corpus at
      R38 and re-verified live this round via the c40 reader; chunk sha
      74b5c6214777c054 matching the substrate): the heading "What is
      probability?" and the probability-scale bullets — "Probability
      describes the **likelihood** of something happening", "In real-life
      you might use words such as **impossible, unlikely **and**
      certain**", "In maths we use the **probability scale** to describe
      probability", "This means giving it a number between **0 and 1**"
      with the scale calibration ("**0** means **impossible**",
      "Between** 0 and 0.5** means **unlikely**", "**0.5** means** even
      chance**", "Between **0.5 and 1** means **likely**", "**1** means
      **certain**"), and "Probabilities can be given as **fractions**,
      **decimals** or **percentages**" — with the note's own
      probability-scale figure ("The probability scale goes from 0 to 1").
      6.3A's demand is "draw and use tree diagrams" — and the chunk
      exercises NONE of it: no tree diagram, no branch structure, no
      outcomes layout, no successive-event space anywhere in the section
      (the negative pins live-verified this round: the 'tree' AND
      'diagram' fragments ABSENT from the chunk text). THE NO-TARGET FACT
      (live-verified this round against the ratified 188): the ONLY
      wording carrying "tree diagram" is 6.3A itself; 6.3B (Higher) is
      "determine the probability that two or more independent events will
      occur" (combined events — unrelated); 6.3D is "apply probability to
      simple problems" (this section applies nothing — it introduces the
      scale); 6.3E is the sample-space/event concepts (absent here); the
      non-6.3 "scale" hits are measuring instruments (4.4A), scale
      drawings (4.5C) and enlargements (5.2J/5.2L) — a REATTRIBUTE has no
      canonical target in the 188 (the R18 no-target class; the R35
      a107f5041769fdd9 precedent). THE LEDGER FACT (live-verified this
      round, CORRECTING the R38 note's prose): 6.3A IS a C30 ledger row —
      two-tier, higher_preferred true, Higher "draw and use tree
      diagrams" (the operative demand, exactly what the R38 verdict
      judged; the row's tier signature IS STORE_HIGHER) and Foundation
      "understand the language of probability" (non-operative for the
      Higher course store). The tier-artifact escape is closed on the
      higher_preferred rule. RECORDED SCOPING (not a target): the
      ledger's 6.3B Foundation wording is "understand and use the
      probability scale" — the closest Foundation-tier shape for this
      chunk's content; the 188 registry is the Higher specification, so
      this creates no REATTRIBUTE target; the chunk's content stays
      available for exactly such a future Foundation-shaped lane or a new
      operator anchor. THE ANCHOR SHAPE CONSIDERED AND REJECTED: every
      sign-off of record (the R30 H3 discharges) rests on a VERBATIM
      demand match — the chunk teaches the joined code's demand word for
      word — whereas this row's pin is a coarse-join mislabel (the
      label's fidelity, not the content's — the R29 4.11C root's class);
      an operator-authored anchor would place a non-6.3A surface on the
      validated 6.3A set against the row's own of-record REJECT,
      spending operator authority to bless exactly the mismatch the
      re-gate returned. THE DISPOSITION: DEMOTE_TO_WORKLIST — the R30
      grouping DEMOTE batch class (content does not resolve to the pinned
      code's demand and no better home exists), the loop's SEVENTH DEMOTE
      as the first row of a 2-row batch over promoted rows; the row
      LEAVES the promoted set at the R40-shaped rebuild (the amendment's
      excluded entry), lands unresolved-span via the c40 DEMOTE
      convention with its chunk identity intact (the W3 invariant —
      projected re-key sha16("demoted|<note_path>|1") = 09f012e4cabef0cc),
      RECORDED never forced, waiting on fresh notes coverage or a new
      operator anchor; the corpus note is untouched. Consequence
      projection: 6.3A keeps 17 anchored rows (the tree-diagrams note's
      quartet ords 0-3 — the code's own dedicated surface — plus the
      combined/conditional notes' 8 rows and basic-probability's own ords
      0/2/3/4/5), so covered 133 -> 133 projected — a precision
      correction on the validated surface, NOT a coverage change.
  calculations-with-the-mean::1:
    mapping_id: d545cd5f5aeae9a9
    current_code: 4MA1-6.2B
    disposition: DEMOTE_TO_WORKLIST
    override_code: null
    tier_wording_source: store
    evidence: >-
      THE FIRED DEFECT (2 of 2) — the R38 fresh REJECT, now verdicted.
      The section's verbatim content (read from the corpus at R38 and
      re-verified live this round via the c40 reader; chunk sha
      22c1475d80a7d6df matching the substrate): the heading "How do I
      solve harder problems involving the mean?" and the mean-surface
      bullets — "Remember what the mean is", "**Mean = total of values ÷
      number of values**", "It is a** formula** involving three
      quantities", "if you know any two, you can find the other one", "A
      question may require you to work **backwards** from a **known
      mean**", "It helps to rearrange the formula", "**Total of values =
      mean × number of values**", "Find the **total **of the values
      **before and after** to help with question that involve:
      **missing** values, **adding in**, or **taking out**, a value" —
      with the Exam Hint callout ("It can help to think of the mean as a
      formula which you can rearrange") and the full worked example (24
      students at mean 1.56 m; a 25th joins at mean 1.57 m; the new
      student's height 39.25 - 37.44 = 1.81 m). 6.2B's demand is
      "understand the concept of a measure of spread" — and the chunk
      exercises NONE of it: no range, no quartiles, no interquartile
      range, no dispersion of any kind (the negative pins live-verified
      this round: 'spread', 'interquartile' and 'quartile' ABSENT from
      the chunk text; the fragment 'range' occurs ONLY as a substring of
      "rearrange"/"Rearrange" — recorded honestly, it is not a spread
      surface). THE NO-TARGET FACT (live-verified this round against the
      ratified 188): no code's wording carries the mean/central-tendency
      surface — the word-boundary scan over the 188 for mean/average hits
      ONLY 4.4F "understand and use the relationship between average
      speed, distance and time" (unrelated); the 6.2 family is entirely
      spread/data-handling-shaped (6.2A "estimate the median from a
      cumulative frequency diagram", 6.2B the spread concept, 6.2C "find
      the interquartile range from a discrete data set", 6.2D "estimate
      the interquartile range from a cumulative frequency diagram"); the
      6.1 family is histograms/cumulative frequency — a REATTRIBUTE has
      no canonical target (the R18 no-target class; the R35
      a107f5041769fdd9 precedent). THE LEDGER FACT (live-verified this
      round, CORRECTING the R38 note's prose): 6.2B IS a C30 ledger row —
      two-tier, higher_preferred true, Higher "understand the concept of
      a measure of spread" (the operative demand, exactly what the R38
      verdict judged; the row's tier signature IS STORE_HIGHER) and
      Foundation "calculate the mean, median, mode and range for a
      discrete data set". The tier-artifact escape is closed on the
      higher_preferred rule — AND RECORDED HONESTLY: the chunk DOES teach
      calculating the mean (a PARTIAL match to the FOUNDATION wording's
      'calculate the mean' fragment; it teaches none of median, mode or
      range), so the content is Foundation-shaped as much as
      Higher-mislabeled — which STRENGTHENS the DEMOTE (the chunk was
      never the Higher 6.2B spread surface) and the content stays
      available for exactly such a future Foundation-shaped lane or a new
      operator anchor. THE ANCHOR SHAPE CONSIDERED AND REJECTED: no
      VERBATIM demand match exists (the chunk does not teach the spread
      concept); an operator-authored anchor would place a non-6.2B
      surface on the validated 6.2B set against the row's own of-record
      REJECT (the R36 reasoning verbatim). THE DISPOSITION:
      DEMOTE_TO_WORKLIST — the R30 grouping DEMOTE batch class, the
      loop's EIGHTH DEMOTE as the second row of the 2-row batch; the row
      LEAVES the promoted set at the R40-shaped rebuild, lands
      unresolved-span via the c40 DEMOTE convention with its chunk
      identity intact (the W3 invariant — projected re-key
      sha16("demoted|<note_path>|1") = 80d783fb13def4e2), RECORDED never
      forced; the corpus note is untouched. Consequence projection: 6.2B
      keeps 23 anchored rows (averages-from-tables 7, the mean note's own
      ord 0 structural slice, comparing-distributions 5,
      mean-median-and-mode 5, range-and-quartiles 5), so covered 133 ->
      133 projected — a precision correction, NOT a coverage change.

