command_kinds:
- code: 4CH1-4.1
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the hydrocarbon definition WITH the only qualifier — a compound of hydrogen and
    carbon only (metal carbonates, CO2 and CO excluded by convention)
- code: 4CH1-4.2
  verb: understand
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: representing organic molecules with empirical, molecular, general, structural and
    displayed formulae (what each shows — simplest ratio / actual number / family ratio in n / omitted
    bonds with brackets / every atom and bond)
- code: 4CH1-4.3
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: homologous series (same general formula + same functional group + similar chemical
    properties + gradation + CH2 increments), functional group, isomerism
- code: 4CH1-4.4
  verb: understand
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: IUPAC naming via stem (meth-/eth-/prop-/but-/pent-/hex- = 1-6 carbons) + suffix
    (-ane/-ene/-anol/-anoic acid/-amine/-yl -anoate); numbers locate the functional group; di- for two
    groups
- code: 4CH1-4.5
  verb: understand
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: writing the possible structural/displayed formulae of an organic molecule given
    its molecular formula (isomer enumeration, e.g. the C3H6 propene/cyclopropane pair)
- code: 4CH1-4.6
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: classifying organic reactions as substitution (one functional group replaced by
    another), addition (molecules combine, no other products) and combustion (burning in oxygen)
- code: 4CH1-4.7
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: crude oil is a mixture of hydrocarbons (unrefined, not useful as-is; the fractions
    are the valuable part)
- code: 4CH1-4.8
  verb: describe
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: industrial fractional distillation — heat crude oil to vaporise, vapours enter the
    fractionating column (hot bottom, cooler top), high-boiling fractions condense low, low-boiling fractions
    rise and condense high
- code: 4CH1-4.9
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the six main fractions and their uses — refinery gases (domestic heating/cooking),
    gasoline/petrol (car fuel), kerosene/paraffin (jet fuel), diesel (diesel engines), fuel oil (ships/power
    stations), bitumen (roads/roofs)
- code: 4CH1-4.10
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the trends down the fractions with increasing chain length — darker colour, higher
    boiling point, greater viscosity (thicker, flows less easily), lower volatility
- code: 4CH1-4.11
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: a fuel is a substance that, when burned, releases heat energy (exothermic); fossil
    fuels from crude oil
- code: 4CH1-4.12
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: complete combustion (excess oxygen) -> carbon dioxide + water; incomplete combustion
    (insufficient oxygen) -> carbon monoxide (+ soot/carbon particulates) + water
- code: 4CH1-4.13
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: why CO is poisonous — it binds (irreversibly) to the oxygen-transport molecules
    in red blood cells (haemoglobin), reducing the blood's capacity to carry oxygen
- code: 4CH1-4.14
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: nitrogen oxides (NO, NO2) form when nitrogen and oxygen react at the high pressure
    and temperature inside internal combustion engines (and blast furnaces)
- code: 4CH1-4.16
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: SO2 (from fossil-fuel combustion) dissolves in rainwater to form sulfuric acid;
    NO2 from engines forms nitrous and nitric acids — both contribute to acid rain
- code: 4CH1-4.17
  verb: describe
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: catalytic cracking — heat long-chain fractions to 600-700 C to vaporise, pass the
    vapours over a hot powdered aluminium oxide (silica/alumina/zeolite) catalyst, bonds break = thermal
    decomposition; products are shorter alkanes AND alkenes
- code: 4CH1-4.18
  verb: explain
  guide_class: EXPLAIN_HOW
  demanded_substance: why cracking is necessary — long-chain fractions (fuel oil, bitumen) are supplied
    in excess while short-chain fractions (petrol, kerosene, diesel) are in higher demand; cracking converts
    surplus into useful molecules (alkenes for polymers/ethanol)
- code: 4CH1-4.19
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the alkane general formula CnH2n+2
- code: 4CH1-4.20
  verb: explain
  guide_class: EXPLAIN_HOW
  demanded_substance: why alkanes are classified as saturated — they have only single carbon-carbon bonds,
    no double bonds
- code: 4CH1-4.21
  verb: understand
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: drawing the structural and displayed formulae for alkanes up to five carbons (methane
    CH4 to pentane C5H12)
- code: 4CH1-4.22
  verb: describe
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: the alkane+halogen substitution reaction — alkanes react with halogens in the presence
    of ultraviolet radiation (methane + bromine -> bromomethane + hydrogen bromide; chlorine gives chloromethane);
    products are halogenoalkanes
