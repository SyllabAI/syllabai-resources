      and the tier-artifact escape is closed. 1.8D is ALREADY COVERED (the
      related-calculations note's 3 HUMAN_VALIDATED rows ords 0/1/3 — the
      R10 STANDING join; verified this round) so this REATTRIBUTE is a scope
      correction, NOT a coverage gain: covered 133 -> 133 projected. The row
      REMAINS in the promoted set (the R5 promotion judged the section's
      teaching value; the repair corrects its code — the R26/R30 supersedes
      convention). Root cause (the R32 record's own): the corpus note
      carries BOTH its rounding half AND its estimation half on the ONE
