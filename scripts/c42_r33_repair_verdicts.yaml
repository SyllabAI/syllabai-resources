    current_code: 4MA1-1.8B
    disposition: REATTRIBUTE
    override_code: 4MA1-1.8D
    tier_wording_source: store
    evidence: >-
      THE FIRED DEFECT — the R32 fresh REJECT, now verdicted (the R30
      4.11C-trio shape: the of-record judgment's disposition lands as the
      repair round's carrier). The section's verbatim content (read from the
      corpus this round): the over/underestimate discrimination tables — for
      addition a+b and multiplication a x b: 'a (rounded up) and/or b
      (rounded up) | Overestimate', 'a (rounded down) and/or b (rounded
      down) | Underestimate'; for subtraction a-b and division a / b: the
      mixed-direction rows Overestimate/Underestimate and both
      same-direction rows 'Not easy to tell' — and the worked example
      'Calculate an estimate for (17.3 x 3.81) / 11.5. State, with a reason,
      whether the estimate is an overestimate or an underestimate'
      (17.3->20, 3.81->4, 11.5->10, 20x4/10 = 8) whose own final answer is
      'This is an overestimate as the numerator was rounded up and the
      denominator was rounded down'. That arc — form an estimate, then
      EVALUATE it (over/under, with reason) — is 1.8D 'use estimation to
      evaluate approximations to numerical calculations' VERBATIM (the
      estimate-evaluation surface of the demand). 1.8B's demand is 'round to
      a given number of significant figures or decimal places' and the
      section teaches NONE of it: no rounding exercise is set to a given
      degree — the rounding is presupposed (the method sections are ords
