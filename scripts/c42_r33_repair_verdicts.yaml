  rounding-and-estimation::7:
    mapping_id: b5c13a3e2908b8d1
    current_code: 4MA1-1.8B
    disposition: REATTRIBUTE
    override_code: 4MA1-1.8D
    tier_wording_source: store
    evidence: >-
      The sibling exposure, adjudicated on its OWN chunk. The section 'How
      do I estimate?' (561 chars) reads verbatim: 'Round each number in the
      question to a sensible degree, then perform the calculation'; 'The
      exam question will usually tell you what to round each number to
      before carrying out any calculations'; 'The general rule is to round
      numbers to 1 significant figure' (7.8 -> 8, 18 -> 20,
      3.65 x 10^-4 -> 4 x 10^-4, 1080 -> 1000); 'In certain cases it may be
      more sensible (or easier) to round to something convenient'
      (16.2 -> 15, 9.1 -> 10, 1180 -> 1200); 'Avoid rounding values to
