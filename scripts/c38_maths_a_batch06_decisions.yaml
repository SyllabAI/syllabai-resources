command_kinds:
- code: 4MA1-2.2D
  verb: complete
  guide_class: APPLY_PROCEDURE
  demanded_substance: completing the square for a given quadratic expression — the
    half-the-middle-term walk (divide the coefficient of x by 2, square it, add and
    subtract), reading the completed form (x + p)² + q, and using the completed form to
    read turning points
- code: 4MA1-2.2E
  verb: use
  guide_class: APPLY_PROCEDURE
  demanded_substance: using algebra to support and construct proofs — representing integers
    as algebraic terms (2n for even, 2n + 1 for odd, kn for multiples), applying the
    algebraic toolkit (expansion, factorising, collecting) inside a proof chain, and
    finishing with a full-sentence conclusion that copies the question's wording
- code: 4MA1-2.2F
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: understanding the concept of a quadratic expression and factorising
    such expressions limited to x² + bx + c — the ax² + bx + c form recognition, the
    pair-of-numbers search (multiply to c, add to b), the inspection/grouping/grid methods,
    and the difference-of-two-squares and common-factor special cases
- code: 4MA1-2.3A
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: understanding the manipulation of formulae or equations to change the
    subject in the harder cases the Higher wording names — the subject appearing twice
    (factorise the collected terms) and a power of the subject occurring (collect, then
    apply the inverse power with plus-or-minus care)
- code: 4MA1-2.3B
  verb: use
  guide_class: APPLY_PROCEDURE
  demanded_substance: using correct notational conventions for algebraic expressions and
    formulae — the expression/equation/formula distinctions, bracket conventions for
    negative quantities, and the acceptable equivalent forms of a rearranged answer
- code: 4MA1-2.3C
  verb: substitute
  guide_class: APPLY_PROCEDURE
  demanded_substance: substituting positive and negative integers, decimals and fractions
    for words and letters in expressions and formulae — the bracket-the-negative
    convention, the order-of-operations discipline (BIDMAS) under substitution, and
    calculator versus by-hand evaluation
- code: 4MA1-2.3D
  verb: use
  guide_class: APPLY_PROCEDURE
  demanded_substance: using formulae from mathematics and other real-life contexts expressed
    initially in words or diagrammatically — reading a worded or diagrammatic formula into
    symbols, then evaluating it in context (mixing quantities, BMI-style quotients,
    temperature conversions)
- code: 4MA1-2.3E
  verb: derive
  guide_class: APPLY_PROCEDURE
  demanded_substance: deriving a formula or expression — turning worded relationships into
    expressions step by step (3 more than, 4 times as many), choosing which unknown to call
    x for cleaner algebra, and composing the derived parts into the demanded formula
- code: 4MA1-2.3F
  verb: change
  guide_class: APPLY_PROCEDURE
  demanded_substance: changing the subject of a formula where the subject appears once —
    clearing fractions first by multiplying through by the denominator, then applying the
    inverse operations in the correct order, and reading equivalent acceptable forms
- code: 4MA1-2.4A
  verb: solve
  guide_class: APPLY_PROCEDURE
  demanded_substance: solving linear equations with integer or fractional coefficients where
    the unknown appears on either side or both sides — inverse operations on both sides,
    expanding brackets and clearing fractions as the setup moves, and the
    divide-every-term discipline
- code: 4MA1-2.4B
  verb: set
  guide_class: APPLY_PROCEDURE
  demanded_substance: setting up simple linear equations from given data — turning worded
    relationships and shape properties into a formed equation (the is-equal-to test for
    the equals sign), then solving and answering in context
- code: 4MA1-2.5A
  verb: set
  guide_class: APPLY_PROCEDURE
  demanded_substance: setting up problems involving direct or inverse proportion and
    relating algebraic solutions to graphical representations — the standard pair y = kx
    and y = k/x, the four-step find-k walk (identify, substitute, rewrite, use), the
    power-and-root variants, and the reciprocal reading that ties the inverse curve to the
    direct-proportion graph of 1/x
