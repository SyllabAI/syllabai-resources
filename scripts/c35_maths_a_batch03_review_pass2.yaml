    The percentages MS also carries question-specific wrong-answer rows ("Liam claims...",
    "Helen is incorrect", "Ibrar is wrong", an answer "incorrect as the question asks for
    the percentage decrease") — why do only the Q10/Q11 rows mint?
  resolution: >-
    The contract mints on CLASS documentation, not per-question traps: the Q10/Q11 rows
