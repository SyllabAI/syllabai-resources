    knowledge for Higher papers), and the practical demand genuinely consumes both. The
    DAG stays acyclic (both targets root out at SETS-AND-SUBSETS). CONFIRM unchanged.
- id: FP-B03-2
  class: FALSE-POSITIVE-CHECK
  question: >-
    Is VENN-REPRESENTATION REQUIRES_PREREQUISITE CARDINAL-NOTATION directionally sound,
    given the n(A) row lives on the set-notation page whose notation half anchors 1.5B
    itself?
  resolution: >-
    Yes — the 1.5B wording itself names "the number of elements in sets" as the second
    demand arm, and n(A) is exactly the notation that arm uses; the consumer→notation
    direction matches the page's own worked example (write down n(A) FROM the diagram).
    The reverse direction would rest the notation on the diagram, which the substrate's
    own split contradicts (the notation half — including the n(A) row — anchors 1.5B).
    The pair-back holds at the 1.5B endpoint. CONFIRM unchanged.
- id: FP-B03-3
  class: PROVENANCE-CHECK
  question: >-
    M2 (percentage-quotient-inversion) rides 1.6D but the percentages MS Q10/Q11 rows
    assess percentage-of-another-number demands whose closest ratified row is 1.6E (B04)
