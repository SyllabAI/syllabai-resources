    note_path: notes/4-geometry-and-trigonometry/3d-pythagoras-and-trigonometry/3d-pythagoras-and-trigonometry.json
    chunk_ordinal: 4
    heading: How do I find the angle between a line and a plane?
    root: R21 fresh REJECT — adjacent-surface scope difference WITH a canonical target
    rationale: >-
      The section teaches finding the ANGLE BETWEEN A LINE AND A PLANE
      (identify the plane, draw the line, form a right-angled triangle whose
      height is perpendicular to the plane, use SOHCAHTOA) — the R21 root's
      own reading, re-verified against the section's verbatim content this
      round. 4.8F's Higher demand in the ratified 188 is 'apply
      trigonometrical methods to solve problems in three dimensions,
      including finding the angle between a line and a plane' — the
      including-clause names this exact task VERBATIM; the store's operative
      wording for 4.8F carries it. The joined code 4.8D's demand is 'use
      Pythagoras' theorem in three dimensions' and the section teaches NO
      Pythagoras (no a^2 + b^2 = c^2 anywhere; the method is trigonometric
      end to end). Not a tier artifact: 4.8D AND 4.8F are BOTH absent from
      the C30 ledger (verified this round — Higher-only rows), and 4.8F is a
      distinct ratified row, not a tier variant of 4.8D. The proposals
      scorer's top-1 for this row is 4.8F @ 0.2707 (the only 4.8x candidate
      above 0.19 in the packet — the next-best is 4.5D constructions at
      0.1966, a noise ranking) — convergence with the R21 root's citation.
      The note-level join to 4.8D STANDS via the note's Pythagoras sections
      (ord 0 CONFIRMed at R4, ord 1 at R13 and R17, ord 5 at R13 — the 3D
      Pythagoras formula section ord 2 and the mixed-problems section ord 5
      carry the 4.8D surface). REATTRIBUTE, never forced onto the store from
      this round: the map lands for the R24-shaped rebuild.
  eb26022693be3948:
    verdict: REATTRIBUTE
    from_code: 4MA1-2.2F
    to_code: 4MA1-2.2B
    action: REATTRIBUTE
    note_path: notes/2-equations-formulae-and-identities/factorising/difference-of-two-squares.json
    chunk_ordinal: 3
    heading: How can the difference of two squares be made harder?
    root: R21 fresh REJECT — limit-scope difference WITH a canonical target
    rationale: >-
      The section teaches the difference of two squares made HARDER — squared
      variables 4m^2 - 9n^2, OTHER POWERS r^8 - t^6, repeated DOTS to fully
      factorise a^4 - b^4, common factor first 2x^2 - 18 — re-verified against
      the section's verbatim content this round. r^8 - t^6 and a^4 - b^4 are
      NOT quadratic expressions, while 2.2F's demand is explicitly capped
      '(limited to x^2 + bx + c)' (the store's operative wording carries the
      cap). The un-limited canonical surface EXISTS: 2.2B, whose C30 ledger
      Higher-operative wording is 'understand the concept of a quadratic
      expression and be able to factorise such expressions' WITHOUT the cap —
      verified verbatim against the ledger row this round (bare code 2.2B,
      higher_preferred true, foundation text 'collect like terms' — a distinct
      shared-tier row whose Higher wording carries the un-limited demand). Not
      a tier artifact: 2.2F is absent from the ledger (Higher-only, verified)
      and 2.2B's Higher surface — not its Foundation surface — is what the
      section teaches (the section is Higher-corpus content). The proposals
      scorer's top-1 for this row is 2.2B @ 0.2355 (next-best 2.3A at 0.1817,
      noise) — convergence with the R21 root's citation. The note-level join
      to 2.2F STANDS via the note's within-limit basic DOTS sections (ord 1
      'What is the difference of two squares?' CONFIRMed at R9 and R17; ord 2
      the basic a^2 - b^2 factorisation rides the same within-limit surface).
      REATTRIBUTE, map-landed for the R24-shaped rebuild.
  5fd48f084383be11:
    verdict: REATTRIBUTE
    from_code: 4MA1-2.6B
    to_code: 4MA1-3.3E
    action: REATTRIBUTE
    note_path: notes/3-sequences-functions-and-graphs/graphs-of-functions/graphical-solutions.json
    chunk_ordinal: 1
    heading: How do I find the coordinates of points of intersection?
    root: R21 fresh REJECT — adjacent-surface scope difference WITH a canonical target (the R17 fdp class in this note)
    rationale: >-
      The section's worked instance is a LINEAR + NON-LINEAR pair — plot
      y = x^2 + 3x + 1 and y = 2x + 1 on the same axes, they meet twice,
      coordinates (-1, -1) and (0, 1) — re-verified against the section's
      verbatim content this round. That is 3.3E's Higher demand VERBATIM
      ('find the intersection points of two graphs, one linear (y) and one
      non-linear (y), and recognise that the solutions correspond' — the
      store's operative wording carries it), while the joined code 2.6B's
      demand is 'interpret the equations AS LINES and the common solution as
      the point of intersection' and the section's only example is not a pair
      of lines. Tier facts PRECISELY stated (see dated_corrections DC-R22-01):
      2.6B is absent from the C30 ledger (Higher-only, verified); 3.3E IS
      PRESENT in the ledger as a shared-tier row (higher_preferred true) whose
      Higher wording is the target demand verbatim and whose Foundation
      wording ('determine the coordinates of the midpoint of a line segment...')
      is a DIFFERENT surface — so the section rides 3.3E's Higher-operative
      surface and is not a tier-variant artifact; if anything the ledger
      presence STRENGTHENS the target citation. The proposals scorer's top-1
      for this row is 3.3E @ 0.3125 (next-best 3.3H at 0.1961, noise) —
      convergence with the R21 root's citation. The note-level join to 2.6B
      STANDS via the note's lines-based sections (ord 0 CONFIRMed at R13, ord
      3 at R9, ord 2 sampled fresh at R21 — the two-lines surface verbatim).
      REATTRIBUTE, map-landed for the R24-shaped rebuild.
