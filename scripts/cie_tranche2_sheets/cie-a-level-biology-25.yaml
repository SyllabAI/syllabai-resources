    via: section-topic:18
  - code: 18.1.2
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.1.2
    text: 'describe the classification of organisms into three domains: Archaea, Bacteria and Eukarya'
    via: section-topic:18
  - code: 18.1.3
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.1.3
    text: state that Archaea and Bacteria are prokaryotes and that there are differences between them, limited to
      differences in membrane lipids, ribosomal RNA and composition of cell walls
    via: section-topic:18
  - code: 18.1.4
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.1.4
    text: describe the classification of organisms in the Eukarya domain into the taxonomic hierarchy of kingdom,
      phylum, class, order, family, genus and species
    via: section-topic:18
  - code: 18.1.5
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.1.5
    text: outline the characteristic features of the kingdoms Protoctista, Fungi, Plantae and Animalia
    via: section-topic:18
  - code: 18.1.6
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.1.6
    text: outline how viruses are classified, limited to the type of nucleic acid (RNA or DNA) and whether this
      is single stranded or double stranded
    via: section-topic:18
  - code: 18.2.1
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.2.1
    text: define the terms ecosystem and niche
    via: section-topic:18
  - code: 18.2.2
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.2.2
    text: 'explain that biodiversity can be assessed at different levels, including: habitats'
    via: section-topic:18
  - code: 18.2.3
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.2.3
    text: explain the importance of random sampling in determining the biodiversity of an area
    via: section-topic:18
  - code: 18.2.4
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.2.4
    text: describe and use suitable methods to assess the distribution and abundance of organisms in an area, limited
      to frame quadrats, line transects, belt transects and mark-release- recapture using the Lincoln index (the
      formula for the Lincoln index will be provided, as shown in the Mathematical requirements) continued
    via: section-topic:18
  - code: 18.2.5
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.2.5
    text: use Spearman’s rank correlation and Pearson’s linear correlation to analyse the relationships between
      two variables, including how biotic and abiotic factors affect the distribution and abundance of species (the
      formulae for these correlations will be provided, as shown in the Mathematical requirements)
    via: section-topic:18
  - code: 18.2.6
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.2.6
    text: use Simpson’s index of diversity ( D ) to calculate the biodiversity of an area, and state the significance
      of different values of D (the formula for Simpson’s index of diversity will be provided, as shown in the Mathematical
      requirements)
    via: section-topic:18
  - code: 18.3.1
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.3.1
    text: 'explain why populations and species can become extinct as a result of:'
    via: section-topic:18
  - code: 18.3.2
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.3.2
    text: outline reasons for the need to maintain biodiversity
    via: section-topic:18
  - code: 18.3.3
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.3.3
    text: outline the roles of zoos, botanic gardens, conserved areas (including national parks and marine parks),
      ‘frozen zoos’ and seed banks, in the conservation of endangered species
    via: section-topic:18
  - code: 18.3.4
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.3.4
    text: describe methods of assisted reproduction used in the conservation of endangered mammals, limited to IVF,
      embryo transfer and surrogacy
    via: section-topic:18
  - code: 18.3.5
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.3.5
    text: explain reasons for controlling invasive alien species
    via: section-topic:18
  - code: 18.3.6
    id: CIE_A_LEVEL_BIOLOGY_2025_2027:18.3.6
    text: outline the role in conservation of the International Union for Conservation of Nature (IUCN) and the
      Convention on International Trade in Endangered Species of Wild Fauna and Flora (CITES)
    via: section-topic:18
