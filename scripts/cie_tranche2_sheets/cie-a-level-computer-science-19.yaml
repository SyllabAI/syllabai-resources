    via: section-topic:20
  - code: 20.2.3
    id: CIE_A_LEVEL_COMPUTER_SCIENCE_2024_2025:20.2.3
    text: Teacher guidance Equipment and facilities Computer science is a practical subject and the Cambridge AS
      and A Level syllabus places emphasis on the use of procedural high-level programming languages. Centres must
      ensure that their equipment and facilities are adequate for candidates to be able to satisfy the requirements
      of the syllabus. The hardware facilities needed will depend on the number of candidates, but should be sufficient
      for all candidates to have enough time to practise their programming skills.
    via: section-topic:20
  - code: 20.2.4
    id: CIE_A_LEVEL_COMPUTER_SCIENCE_2024_2025:20.2.4
    text: Hardware Candidates need to have access to a system with direct-access file capability on backing store
      and hardcopy facilities.
    via: section-topic:20
  - code: 20.2.5
    id: CIE_A_LEVEL_COMPUTER_SCIENCE_2024_2025:20.2.5
    text: 'Software Candidates should have experience of using a high-level programming language, chosen by the
      centre, from the following list:'
    via: section-topic:20
  - code: 20.2.6
    id: CIE_A_LEVEL_COMPUTER_SCIENCE_2024_2025:20.2.6
    text: Java (console mode)
    via: section-topic:20
  - code: 20.2.7
    id: CIE_A_LEVEL_COMPUTER_SCIENCE_2024_2025:20.2.7
    text: Visual Basic (console mode)
    via: section-topic:20
  - code: 20.2.8
    id: CIE_A_LEVEL_COMPUTER_SCIENCE_2024_2025:20.2.8
    text: Python (console mode).
    via: section-topic:20
  - code: 20.2.9
    id: CIE_A_LEVEL_COMPUTER_SCIENCE_2024_2025:20.2.9
    text: Books The British Computer Society (BCS) book list for schools and colleges are suitable for use as reference.
      Teachers will need to consult several books to cover the whole syllabus adequately. There is a suggested book
      list on our website.
    via: section-topic:20
  - code: 20.2.10
    id: CIE_A_LEVEL_COMPUTER_SCIENCE_2024_2025:20.2.10
    text: Practical skills Computing is a practical subject and a range of practical exercises should supplement
      the study of most parts of the syllabus.
    via: section-topic:20
  - code: 20.2.11
    id: CIE_A_LEVEL_COMPUTER_SCIENCE_2024_2025:20.2.11
    text: It is important that centres encourage candidates, as early as possible in the course, to develop a systematic
