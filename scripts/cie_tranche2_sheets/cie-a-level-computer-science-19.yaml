  - code: 20.2.3
    id: CIE_A_LEVEL_COMPUTER_SCIENCE_2024_2025:20.2.3
    text: Teacher guidance Equipment and facilities Computer science is a practical subject and the Cambridge AS
      and A Level syllabus places emphasis on the use of procedural high-level programming languages. Centres must
      ensure that their equipment and facilities are adequate for candidates to be able to satisfy the requirements
      of the syllabus. The hardware facilities needed will depend on the number of candidates, but should be sufficient
      for all candidates to have enough time to practise their programming skills.
    via: section-topic:20
  - code: 20.2.4
    id: CIE_A_LEVEL_COMPUTER_SCIENCE_2024_2025:20.2.4
