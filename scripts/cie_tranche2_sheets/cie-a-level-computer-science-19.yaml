  - code: 4.3.3
    id: CIE_A_LEVEL_COMPUTER_SCIENCE_2024_2025:4.3.3
    text: 'AND #n / Bn / &n Bitwise AND operation of the contents of ACC with the operand AND <address> Bitwise
      AND operation of the contents of ACC with the contents of <address> XOR #n / Bn / &n Bitwise XOR operation
      of the contents of ACC with the operand XOR <address> Bitwise XOR operation of the contents of ACC with the
      contents of <address> OR #n / Bn / &n Bitwise OR operation of the contents of ACC with the operand OR <address>
      Bitwise OR operation of the contents of ACC with the contents of <address> LSL #n Bits in ACC are shifted
      logically n places to the left. Zeros are introduced on the right hand end LSR #n Bits in ACC are shifted
      logically n places to the right. Zeros are introduced on the left hand end <label>: <opcode> <operand> Labels
      an instruction <label>: <data> Gives a symbolic address <label> to the memory location with contents <data>'
    via: section-topic:4
  - code: 4.3.4
    id: CIE_A_LEVEL_COMPUTER_SCIENCE_2024_2025:4.3.4
    text: 'All questions will assume there is only one general purpose register available (Accumulator) ACC denotes
      Accumulator IX denotes Index Register <address> can be an absolute or symbolic address # denotes a denary
      number, e.g. #123 B denotes a binary number, e.g. B01001010 & denotes a hexadecimal number, e.g. &4A'
