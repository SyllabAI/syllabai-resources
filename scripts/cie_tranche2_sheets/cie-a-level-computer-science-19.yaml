    text: Visual Basic (console mode)
    via: section-topic:20
  - code: 20.2.8
    id: CIE_A_LEVEL_COMPUTER_SCIENCE_2024_2025:20.2.8
    text: Python (console mode).
    via: section-topic:20
  - code: 20.2.9
    id: CIE_A_LEVEL_COMPUTER_SCIENCE_2024_2025:20.2.9
    text: Books The British Computer Society (BCS) book list for schools and colleges are suitable for use as reference.
      Teachers will need to consult several books to cover the whole syllabus adequately. There is a suggested book
      list on our website.
    via: section-topic:20
  - code: 20.2.10
    id: CIE_A_LEVEL_COMPUTER_SCIENCE_2024_2025:20.2.10
