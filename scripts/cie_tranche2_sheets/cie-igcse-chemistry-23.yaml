  - code: 10.1.1
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.1.1
    text: Describe chemical tests for the presence of water using anhydrous cobalt( II ) chloride and anhydrous
      copper( II ) sulfate
    via: section-topic:10
  - code: 10.1.2
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.1.2
    text: Describe how to test for the purity of water using melting point and boiling point
    via: section-topic:10
  - code: 10.1.3
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.1.3
    text: Explain that distilled water is used in practical chemistry rather than tap water because it contains
      fewer chemical impurities
    via: section-topic:10
  - code: 10.1.4
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.1.4
    text: 'State that water from natural sources may contain substances, including:'
    via: section-topic:10
  - code: 10.1.5
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.1.5
    text: 'State that some of these substances are beneficial, including: minerals for life'
    via: section-topic:10
  - code: 10.1.6
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.1.6
    text: 'State that some of these substances are potentially harmful, including: cause disease deoxygenation of
      water and damage to aquatic life Details of the eutrophication process are not required'
    via: section-topic:10
  - code: 10.1.7
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.1.7
    text: 'Describe the treatment of the domestic water supply in terms of:'
    via: section-topic:10
  - code: 10.2.1
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.2.1
    text: State that ammonium salts and nitrates are used as fertilisers
    via: section-topic:10
  - code: 10.2.2
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.2.2
    text: Describe the use of NPK fertilisers to provide the elements nitrogen, phosphorus and potassium for improved
      plant growth
    via: section-topic:10
  - code: 10.3.1
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.3.1
    text: State the composition of clean, dry air as approximately 78% nitrogen, N , 21% oxygen, O
    via: section-topic:10
  - code: 10.3.2
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.3.2
    text: '2 and the remainder as a mixture of noble gases and carbon dioxide, CO limited to: combustion of carbon-containing
      fuels incomplete combustion of carbon-containing fuels vegetation and waste gases from digestion in animals
      fuels which contain sulfur compounds'
    via: section-topic:10
  - code: 10.3.3
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.3.3
    text: 'State the adverse effect of these air pollutants, limited to: dioxide leading to increased global warming,
      which leads to climate change problems and cancer to increased global warming, which leads to climate change
      smog and respiratory problems'
    via: section-topic:10
  - code: 10.3.7
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.3.7
    text: 'Describe how the greenhouse gases carbon dioxide and methane cause global warming, limited to: thermal
      energy'
    via: section-topic:10
  - code: 10.3.4
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.3.4
    text: 'State and explain strategies to reduce the effects of these environmental issues, limited to: in livestock
      farming, decreasing use of fossil fuels, increasing use of hydrogen and renewable energy, e.g. wind, solar
      vehicles, reducing emissions of sulfur dioxide by using low-sulfur fuels and flue gas desulfurisation with
      calcium oxide'
    via: section-topic:10
  - code: 10.3.5
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.3.5
    text: Describe photosynthesis as the reaction between carbon dioxide and water to produce glucose and oxygen
      in the presence of chlorophyll and using energy from light
    via: section-topic:10
  - code: 10.3.6
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.3.6
    text: State the word equation for photosynthesis, carbon dioxide + water → glucose + oxygen
    via: section-topic:10
  - code: 10.3.8
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.3.8
    text: Explain how oxides of nitrogen form in car engines and describe their removal by catalytic converters,
      e.g. 2CO + 2NO → 2CO + N
    via: section-topic:10
  - code: 10.3.9
    id: CIE_IGCSE_CHEMISTRY_2023_2025:10.3.9
    text: State the symbol equation for photosynthesis, 6CO + 6H O → C H O + 6O
    via: section-topic:10
