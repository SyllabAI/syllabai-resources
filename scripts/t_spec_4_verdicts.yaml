#
# Evidence standard: every resolve verdict is a VERBATIM join between the
# SME tag's committed definition (spec_point_index.json) and the course's
# own registry statement (Official-Specifications/parsed/<qual>/...):
#   V1_definition_fragment_in_statement — the committed definition is a
#     token-subset of the statement text (SME page quotes part of one
#     statement);
#   V2_statement_contained_in_definition — the statement lead line (and its
#     sub_items, bullet-by-bullet) is token-contained in the committed
#     definition (SME page concatenates the full statement + bullets);
#   V2_statement_contained_in_definition_multi — the definition contains
#     TWO full statements; resolved 1:1 to the first (T-SPEC-3 xylem/phloem
#     precedent) with the second recorded as twin_code.
# Validation is punctuation-normalised at the token edges only (the SME
# pages carry trailing periods inside bullets, e.g. "white dwarf." — the
# containment proof is otherwise exact); the fail-closed apply re-proves
# every containment at run time.
#
# One operator override (chemistry T-SPEC-2e precedent, clearly marked):
#   spcpt_Pgxd3BfhwppqFHHm "Galactic redshift" — the SME tag page publishes
#   NO definition text (scrape artifact: definition "nan"; upstream ticket
#   #11). Resolved to 8.17P on SME's own topic slug 8-3-3-galactic-red-shift
#   plus 11/11 on-topic anchored parts; re-verdict when SME publishes the
#   definition.
#
# Honest pendings (no-guess discipline; zero content anchors; block nothing):
#   2 video-resource tags (linear + SDA pages) + 30 SDA page-only tags, all
#   publishing no definition text — upstream ticket #11.
#
# PMT (PhysicsAndMathsTutor) is EXCLUDED as an evidence source (operator
# instruction 2026-09-18); no PMT content was consulted for any verdict.

