# T-SPEC-3 — biology family spec-point resolution record (2026-09-19)
#
# Extends the chemistry T-SPEC chain (T-SPEC-1/2/2b/2c/2e) to the biology
# IGCSE family: igcse-biology-19, igcse-biology-modular-24-unit-1,
# igcse-biology-modular-24-unit-2, igcse-science-double-award-17-biology.
#
# Evidence standard: every resolve verdict is a VERBATIM join — the SME tag's
# committed definition (spec_point_index.json) is byte-level the official
# statement text (or a contained sub-paragraph of it). The fail-closed apply
# re-proves every containment at run time; nothing below is opinion.
#
# Two SME-internal causes produced the honest tail:
#   (a) SME split statement 1.1 (MRS GREN characteristics) into nine
#       per-characteristic tags, each carrying the FULL statement as its
#       definition text — the stage-1 name-similarity scorer refused them
#       ("merged/paraphrased beyond safe threshold") because the tag NAME
#       is one word of a long statement.
#   (b) the kingdom tags (Plants/Animals/Fungi/Protoctists) each carry one
#       kingdom paragraph of statement 1.2 verbatim — same refusal cause.
#   (c) Xylem & Phloem is a genuinely merged id spanning TWO statements
#       (phloem 2.53/3.3/2.53 + xylem 2.54/3.4/2.54): resolved 1:1 to the
#       phloem statement (first sentence of the committed definition) with
#       the xylem statement recorded as twin, and per-part supersede
#       verdicts so each part carries only the codes its own text exercises.
#
# Registry-coverage repairs (ids present in spec_point_index.json but absent
# from spec_point_map.json's mappings+unmapped partition — found during
# T-SPEC-3 diagnostics):
#   spcpt_nNMTzc3PZPpMmSx9 (Comparing Mitosis & Meiosis) — indexed in all
#     three linear/modular/SDA courses, absent from all three maps.
#   spcpt_KW2X5RdVFhDMwSws (Table summarising ultrafiltration, ...) —
#     indexed in bio-19 + mod-u2, absent from both maps; no definition and
#     no content anchors: recorded UNRESOLVED (no-guess), blocks nothing.
#
# PMT (PhysicsAndMathsTutor) is EXCLUDED as an evidence source (operator
# instruction 2026-09-18); no PMT content was consulted for any verdict.

