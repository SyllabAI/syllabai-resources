  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: how elements are arranged in the Periodic Table (in order of increasing atomic number, in groups and periods)
- code: 4CH1-1.19
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: deducing the electronic configurations of the first 20 elements (shell filling 2, 8, 8 then the fourth shell) from their Periodic Table positions
- code: 4CH1-1.20
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: using electrical conductivity and the acid-base character of oxides to classify elements as metals or non-metals
- code: 4CH1-1.21
  verb: identify
  guide_class: UNDERSTAND_RELATION
  demanded_substance: identifying an element as a metal or a non-metal according to its position in the Periodic Table (metals left, non-metals right of the zig-zag dividing line)
- code: 4CH1-1.22
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: relating the electronic configuration of a main group element to its Periodic Table position (period = occupied shells, group = outer electrons)
- code: 4CH1-1.23
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: why elements in the same group of the Periodic Table have similar chemical properties (same number of outer electrons)
- code: 4CH1-1.24
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: why the noble gases (Group 0) do not readily react (full outer shells of electrons)

