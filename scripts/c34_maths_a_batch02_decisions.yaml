command_kinds:
- code: 4MA1-1.2E
  verb: express
  guide_class: APPLY_PROCEDURE
  demanded_substance: expressing a given number as a fraction of another number — writing
    the comparison of two quantities as a single fraction
- code: 4MA1-1.2F
  verb: use
  guide_class: APPLY_PROCEDURE
  demanded_substance: common denominators to add and subtract fractions and mixed numbers —
    equivalent-fraction rewriting over a shared denominator, combining numerators, and
    converting mixed numbers before operating
- code: 4MA1-1.2G
  verb: convert
  guide_class: APPLY_PROCEDURE
  demanded_substance: converting a fraction to a decimal or a percentage — the
    over-powers-of-ten route and the decimal-then-multiply-by-100 route
- code: 4MA1-1.2H
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: unit fractions as multiplicative inverses — multiplying by 1/n as the
    inverse operation of dividing by n
- code: 4MA1-1.2I
  verb: multiply
  guide_class: APPLY_PROCEDURE
  demanded_substance: multiplying and dividing fractions and mixed numbers — numerator x
    numerator over denominator x denominator, cancelling common factors first, reciprocal
    flip for division, mixed numbers converted to improper form first
- code: 4MA1-1.3A
  verb: convert
  guide_class: APPLY_PROCEDURE
  demanded_substance: converting recurring decimals into fractions — the algebraic method
    (write x equals the decimal, multiply by powers of 10 to align the recurring trail,
    subtract, divide)
- code: 4MA1-1.3B
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: place value in the decimals subtopic context — the positional value of
    digits across the decimal point (the wording is byte-identical to 1.1B's; see B02-ID-01)
- code: 4MA1-1.3C
  verb: order
  guide_class: APPLY_PROCEDURE
  demanded_substance: ordering decimals — comparing by place-value columns and equalizing
    decimal places to determine order
- code: 4MA1-1.3D
  verb: convert
  guide_class: APPLY_PROCEDURE
  demanded_substance: converting a decimal to a fraction or a percentage — the
    digits-over-power-of-ten route and the multiply-by-100 route (the mirror of 1.2G; see
    B02-ID-02)
- code: 4MA1-1.3E
  verb: recognise
  guide_class: UNDERSTAND_RELATION
  demanded_substance: recognising that a terminating decimal is a fraction — a terminating
    decimal's digits over the matching power of ten is exactly a fraction
- code: 4MA1-1.4A
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: the meaning of surds — square roots of non-square integers, left in
    exact form, on the square-root domain (roots as the reverse of powers)
- code: 4MA1-1.4B
  verb: manipulate
  guide_class: APPLY_PROCEDURE
  demanded_substance: manipulating surds — multiplying/dividing/factorising under the root,
    collecting like surds, simplifying via square factors, and rationalising denominators
