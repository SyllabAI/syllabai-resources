# ---------------------------------------------------------------------------
# Command-kind tags (frozen guide §8) — batch-4 slice only (registry of record:
# graph/spec_command_kinds.yaml, merged with the earlier tags by the generator).
command_kinds:
- code: 4CH1-3.1
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the exothermic/endothermic classification (heat energy given out = exothermic with a temperature rise; heat energy taken in = endothermic with a temperature fall; conservation of energy; neutralisation and combustion always exothermic, displacement either)
- code: 4CH1-3.2
  verb: describe
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: simple calorimetry experiments (polystyrene-cup solution calorimetry for neutralisation, dissolving and displacement; spirit-burner combustion calorimetry; the assumptions and the main sources of error)
- code: 4CH1-3.3
  verb: calculate
  guide_class: CALCULATE
  demanded_substance: the heat energy change Q = mcΔT from a measured temperature change (solution mass from volume, c = 4.18 J/g/°C, the J-to-kJ conversion and the sign application)
- code: 4CH1-3.4
  verb: calculate
  guide_class: CALCULATE
  demanded_substance: the molar enthalpy change ΔH = Q/n in kJ/mol (and the energy released per gram) with the exothermic-negative sign convention
- code: 4CH1-3.5C
  verb: draw
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: energy level diagrams for exothermic and endothermic reactions (relative reactant/product energies on the y-axis, the up/down enthalpy-change arrows, identifying the reaction type from its diagram)
- code: 4CH1-3.6C
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: bond-breaking as an endothermic process and bond-making as an exothermic process, and the overall reaction type from the break-versus-form energy difference
- code: 4CH1-3.7C
  verb: use
  guide_class: CALCULATE
  demanded_substance: bond energies to calculate the enthalpy change of a reaction (sum the reactant bonds broken, sum the product bonds formed, energy in minus energy out; balancing numbers counted per bond)
- code: 4CH1-3.8
  verb: investigate
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: the temperature-changes practical (a calorimetry study of salts dissolving, neutralisation, displacement and combustion; plotting results to find the biggest temperature change)
- code: 4CH1-3.9
  verb: describe
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: rate experiments (gas collection by downward displacement for surface area and catalyst effects, the disappearing-cross thiosulfate method for concentration, magnesium-acid timing for temperature)
- code: 4CH1-3.10
  verb: describe
  guide_class: KNOW_TERM
  demanded_substance: the effects of changes in surface area, concentration or pressure, temperature and catalyst on the rate of reaction (steeper initial gradient, horizontal sooner, same final amount of product — a recall demand per the note's own examiner tip)
- code: 4CH1-3.11
  verb: explain
  guide_class: UNDERSTAND_RELATION
  demanded_substance: "the rate-factor effects in terms of particle collision theory (concentration/pressure: more particles per volume; surface area: more exposed particles; temperature: more kinetic energy — each yielding more frequent successful collisions per second)"
- code: 4CH1-3.12
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the catalyst definition (a substance that increases the rate but is chemically unchanged at the end — not altered, not consumed, same mass before and after, not part of the equation)
- code: 4CH1-3.13
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: how a catalyst works (it provides an alternative pathway with a lower activation energy)
- code: 4CH1-3.14C
  verb: draw
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: reaction profile diagrams showing ΔH and activation energy (the peak as the activation energy, the reactant-to-product energy difference as ΔH, the catalyst's lowered peak)
- code: 4CH1-3.15
  verb: investigate
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: the marble-chips practical (the effect of chip size and of acid concentration on the rate of the calcium carbonate + hydrochloric acid reaction, gas volume in a fixed time)
- code: 4CH1-3.16
  verb: investigate
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: the catalytic-decomposition practical (the effect of different solids on the rate of hydrogen peroxide decomposition, comparing gas volumes and relative rates on one graph)
- code: 4CH1-3.17
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: that some reactions are reversible, indicated by the ⇌ symbol in equations (forward and reverse reactions occurring at the same time)
- code: 4CH1-3.18
  verb: describe
  guide_class: KNOW_TERM
  demanded_substance: the named reversible reactions (thermal decomposition of ammonium chloride with recombination on cooling; the dehydration of hydrated copper(II) sulfate to the white anhydrous salt and its rehydration, with the colour changes)
- code: 4CH1-3.19C
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: that a reversible reaction can reach dynamic equilibrium in a sealed container (a closed system in which nothing enters or leaves)
- code: 4CH1-3.20C
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the characteristics of a reaction at dynamic equilibrium (forward and reverse reactions occur at the same rate; concentrations of reactants and products remain constant)
- code: 4CH1-3.21C
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: why a catalyst does not affect the position of equilibrium (it increases the rates of the forward and reverse reactions equally via the lower-activation-energy pathway, so equilibrium is reached faster with the same concentrations)
- code: 4CH1-3.22C
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the effect of temperature and pressure changes on the position of equilibrium (temperature increase shifts to the endothermic direction; pressure increase shifts to the side producing fewer gas molecules; no effect when the gas-molecule counts are equal)

