  a107f5041769fdd9:
    verdict: REJECT
    note: "THE FRESH REJECT of this re-gate — the defect inventory returned to the operator. The section 'How do I express one number as a percentage of another?' teaches the FORWARD express-as-percentage surface verbatim: 'Start by writing one number as a fraction of the other', the decimal equivalent (7/20 = 0.35 = 35/100), 'So 7 is 35% of 20', and the worked examples (the 150/1200 deposit as a percentage of the trip price; the 35%-of-a-40-square grid shading — itself a forward percentage-of-amount). 1.6F's demand is 'use reverse percentages' — recovering an ORIGINAL amount before a percentage change, or a WHOLE from a part and its percentage — and the chunk exercises NONE of it: no original-value recovery, no pre-change amount, no whole-from-part reversal anywhere in the section. The ratification context (recorded, not evidence): the ratified 188 carries NO dedicated express-one-number-as-a-percentage code (1.6C is the CONVERSE direction — percentage to fraction/decimal; 1.6E is simple percentage problems) — the same coarse-join family shape as the note's own ord 3 ('How else can I find a percentage of an amount?', also labeled 1.6F, also a forward surface) — the label's scope breadth, the R29 4.11C root's class (the label's fidelity, not the content's). NOT a tier artifact (1.6F absent from the C30 ledger — single-tier, verified this round). Disposition rides the NEXT-OPERATOR-DECISIONS menu: a future R36-shaped repair round would adjudicate the row (a REATTRIBUTE has no canonical target in the 188 — the honest shapes are an operator-authored anchor or the DEMOTE convention, each the operator's call); the re-gate itself moves NOTHING."
    tier_signature: STORE_HIGHER
  959730b370ef9bb3:
    verdict: CONFIRM
    note: "the section is 5.1G's own proof surface verbatim: 'To show that the points A, B and C are collinear — prove that two line segments are parallel and show that there is at least one point that lies on both segments', with the worked vector forms ('if you show that BC = 2AB then the line segments AB and BC are parallel and they have a common point, B — so A, B and C must be collinear'; the AC = 3AB variant) and the closing statement of the theorem itself ('If A, B, C are collinear, AB is parallel to AC and BC') — 'apply vector methods for simple geometrical proofs' exercised on its canonical collinearity surface word for word (parallel-plus-connected is the method; the proof target is the geometric fact). Not a tier artifact (5.1G absent from the C30 ledger — single-tier, verified this round)."
    tier_signature: STORE_HIGHER
  710a06b6fead71af:
    verdict: CONFIRM
    note: "the section is 1.10B's volume-conversion surface verbatim: 'You need to cube the unit conversion rates' with the basic conversions 1 cm^3 = 1000 mm^3, 1 m^3 = 1 000 000 cm^3, 1 km^3 = 1 000 000 000 m^3, the cube-visualisation ('1 m^3 is a cube measuring 1 m x 1 m x 1 m ... in cm this would be 100 x 100 x 100'), and the worked example converting 2.54 m^3 to cm^3 (= 2 540 000 cm^3) — 'carry out calculations using standard units of mass, length, area, volume and capacity' exercised on its volume/cubed-units surface word for word (the worked example's part (a), 8254 mm^2 to cm^2, even touches the area half of the same demand). Not a tier artifact (1.10B absent from the C30 ledger — single-tier, verified this round)."
    tier_signature: STORE_HIGHER
