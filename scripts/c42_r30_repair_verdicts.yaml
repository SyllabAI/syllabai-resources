  multiple-ratios::0:
    mapping_id: 1dfc65df88b35d69
    code: 4MA1-1.7B
    ruling: SIGN_OFF
    tier_wording_source: store
    evidence: >-
      The heading-only chunk 'Multiple ratios' (15 chars) rides the note whose
      content row e1f6857029232571 (ord 1, 'How do I combine two ratios to
      make a three-part ratio?') teaches 1.7B's demand verbatim — read from
      the corpus this round: the combine-two-ratios method lands 'We can now
      use this to share the 85 animals in the ratio 4:6:7 — there are 17
      parts in total (4 + 6 + 7 = 17), each part is worth 5 animals
      (85 / 17 = 5), there are 20 cows (4 x 5), 30 sheep (6 x 5), and 35 pigs
      (7 x 5)' — DIVIDING A QUANTITY IN GIVEN RATIOS, which is 1.7B 'divide a
      quantity in a given ratio or ratios' verbatim (the note is NAMED
      multiple-ratios; the plural 'ratios' of the wording is the note's whole
      point). The heading-only row is the note's own structural slice on its
      own SP (the note sits in ratio-problem-solving; the corpus's own
      spec_point block anchors it). Not a tier artifact: 1.7B is absent from
      the C30 dedupe ledger (single-tier row; the store's operative wording
      IS the demand). The H3 hold existed for lack of sampling evidence (no
      content-row CONFIRM of note+1.7B ever landed in a draw); this sign-off
      substitutes the round's own verified reading for the absent draw
      evidence — the R5 apply record's named escape hatch.
  relative-and-expected-frequency::4:
    mapping_id: 2d44bcf00f589c18
    code: 4MA1-6.3J
    ruling: SIGN_OFF
    tier_wording_source: store
    evidence: >-
      The heading-only chunk 'Expected frequency' (18 chars) rides the note
      whose content row b4aa201fc25dfe77 (ord 5, 'What is expected
      frequency?') teaches 6.3J's demand verbatim — read from the corpus this
      round: ''Expected frequency' refers to the number of times you would
      expect a particular outcome to occur — it is found by multiplying the
      probability by the number of trials ... Sometimes you need to calculate
      the relative frequency first ... 0.25 x 100 = 25, you would expect to
      get heads 25 times from 100 throws' — UNDERSTANDING the term (the
      definition) AND USING it (the calculations), which is 6.3J 'understand
      and use the term 'expected frequency'' verbatim, both halves. Not a
      tier artifact: 6.3J is absent from the C30 dedupe ledger (single-tier;
      the store's operative wording IS the demand). The H3 hold existed for
      lack of sampling evidence; this sign-off substitutes the round's own
      verified reading (the R5 escape hatch).
  expanding-single-brackets::0:
    mapping_id: 56905a113334dcd1
    code: 4MA1-2.2C
    ruling: SIGN_OFF
    tier_wording_source: ledger_foundation
    evidence: >-
      The heading-only chunk 'Expanding one bracket' (21 chars) rides the note
      whose content row 14203482e0b046b0 (ord 1, 'How do I expand a
      bracket?') teaches the C30 ledger's FOUNDATION wording of 2.2C VERBATIM
      — read from the corpus this round: ''Expanding the brackets means
      multiplying the outside term by each term on the inside ... 3x(x+2)
      expands to 3x x x + 3x x 2 which simplifies to 3x^2 + 6x'' —
      'multiply a single term over a bracket' is 2.2C's Foundation-walk
      demand word for word (C30 ledger row 2.2C: foundation.text 'multiply a
      single term over a bracket', verified this round). The store's
      Higher-operative wording for 2.2C ('manipulate algebraic fractions ...')
      is a DIFFERENT surface — carried by the note family's dedicated rows
      (algebraic-fractions, adding-and-subtracting-algebraic-fractions,
      multiplying-and-dividing-algebraic-fractions,
      solving-algebraic-fractions — 10 further 2.2C rows verified this
      round) — so this row is the R1 WORDING-TIER-ARTIFACT class: the join is
      correct at Foundation tier, and the precedent is the R25 review's
      4.8B SOHCAHTOA ruling ('the join is correct at Foundation tier',
      CONFIRMed on both tier wordings). The sign-off accepts the join ON THAT
      RECORDED BASIS: the chunk teaches the joined code's Foundation-walk
      demand verbatim; the Higher-operative demand is not displaced (the
      fraction rows carry it); no better Higher-operative code exists
      (2.2A's 'expand the product of two or more linear expressions' does not
      name the single-bracket surface, and the official spec's own
      Foundation walk places this demand at 2.2C). The H3 hold existed for
      lack of sampling evidence; the sign-off substitutes the round's own
      verified both-tier reading (the R5 escape hatch), with the tier-artifact
      caveat recorded here and in the promotion entry.

