schema: c42-r30-repair-verdicts/1.0
task: T-C42
stage: r30-operator-delegate-dispositions
contract: >-
  the R30 disposition round over the R29 re-gate's NEXT-OPERATOR-DECISIONS
  menu — the loop's EIGHTH R1-shaped repair round and the SECOND over the
  promoted surface, fired by the operator directive 'Fix all of these
  yourself. Validate by yourself.' (2026-10-12, zai-web, gateway trace
  1a130272fc8acc11). The directive delegates the per-item rulings of the R29
  record's menu ((a) the 4.11C fresh-defect ruling; (b) the 4 H3 per-row
  sign-offs; (c) the ord-3 extension candidate + the promoted-surface
  same-class candidates + the rational/irrational corpus gap) to the lane as
  OPERATOR-DELEGATE verdicts (the R26 precedent shape), and its 'Validate by
  yourself' clause IS the explicit operator instruction the standing
  explicit-instruction-only law requires for the validation re-gate (R32).
  Every verdict below is adjudicated against BOTH tier wordings (the store's
  Higher-operative wording AND the C30 ledger foundation.text) and the
  chunk's own verbatim content, re-read from the corpus this round; targets
  are verified inside the ratified 188 (graph/igcse-maths-a/
  specification_points.yaml); ZERO silent movement — the dispositions land as
  the R30 map + amendment carriers and the store moves ONLY at the R31-shaped
  rebuild consuming them.
review_date: '2026-10-12'
operator_directive: 'Fix all of these yourself. Validate by yourself. (2026-10-12, zai-web, gateway trace 1a130272fc8acc11)'

section_overrides:
  equations-and-problem-solving::1:
    mapping_id: 9fb36c39006e0531
    current_code: 4MA1-4.11C
    disposition: REATTRIBUTE
    override_code: 4MA1-2.7C
    tier_wording_source: store
    evidence: >-
      The R29 fresh REJECT is CONFIRMED as a cross-section mis-join and the
      canonical target is VERDICTED. The section's verbatim content: 'Problem
      solving means you are given a specific situation (real life or
      constructed) and you need to form and solve equations to find answers to
      the questions asked'; 'The equations can be any type that are in the
      course, including Linear, e.g. 2(x+4)=3x; Quadratic, e.g. x^2-7x+12=0';
      'Answers must always be given in context'. 4.11C's official demand is
      'use areas and volumes of similar figures in solving problems'
      (Geometry and trigonometry section 4.11, verified in the parsed official
      spec) and the chunk teaches NONE of it — zero similar-figure,
      area-ratio or volume-ratio content (the R29 root, re-verified this
      round). The canonical target EXISTS: 2.7C 'form and solve quadratic
      equations from data given in a context' — the chunk's own demand
      sentence is the form-and-solve-from-context demand ('form and solve
      equations' from 'a specific situation' with 'answers in context'), the
      quadratic type is NAMED with a worked instance (x^2-7x+12=0), and the
      note's own arc completes the quadratic forming from context in the
      sibling ord-2 worked example (the cube net). The linear instance is
      carried elsewhere in the store by the six dedicated 2.4B rows
      (forming-and-solving-equations + forming-equations-from-shapes notes,
      verified this round); 2.4B's narrower 'set up simple linear equations'
      does not reach the chunk's quadratic half, so 2.7C is the honest single
      target. 2.7C is currently UNCOVERED — its only store row is the
      uncovered-SP DEFER placeholder f081d3d51385cb8f
      (== sha16('unmapped|4MA1-2.7C'), verified) — so this REATTRIBUTE is a
      projected coverage GAIN (the R12/R16/R20/R24/R26 coverage-gain
      precedent; computed, never asserted, at the R31 rebuild). The row REMAINS
      in the promoted set (the R5 promotion judged the section's teaching
      value; the repair corrects its code — the R26 supersedes convention).
  equations-and-problem-solving::2:
    mapping_id: d5d49762dd5a4eef
    current_code: 4MA1-4.11C
    disposition: REATTRIBUTE
    override_code: 4MA1-2.7C
    tier_wording_source: store
    evidence: >-
      The section's verbatim content: 'Many questions will require you to
      solve quadratic equations ... bring all the terms to one side to get
      "= 0" ... you are often free to choose which quadratic method to use ...
      If you get two solutions, you may need to justify which solution is
      correct'; 'You may have unfamiliar equations to solve — such as
      multiplying both sides by x in 12/x = 7-x to form a quadratic'; and the
      worked example: a cube net with side x cm whose 'difference between the
      volume of the cube and the surface area of the net is eight times the
      perimeter of the net' => 'Show that x^2 - 6x - 112 = 0'. The chunk's
      whole arc — FORM a quadratic from data given in a context (the net's
      constraints; the 12/x bullet's 'to form a quadratic') and SOLVE it — is
      2.7C 'form and solve quadratic equations from data given in a context'
      VERBATIM (the worked example is that demand exercised end to end). The
      method-choice bullet ('choose which quadratic method') is the generic
      solve half of the same demand — 2.7A/2.7B are the method-SPECIFIC
      surfaces and the chunk teaches no specific method, so neither is the
      honest single target (2.7A is already carried by four dedicated
      solving-quadratic-equations rows, verified this round). The R29 root's
      reading ('solving quadratic equations — a section-2 algebra surface,
      itself not 4.11C') is confirmed; zero similar-figure content. The row
      REMAINS in the promoted set at its amended code (the R26 supersedes
      convention).
  equations-and-problem-solving::0:
    mapping_id: 23098694b70397d8
    current_code: 4MA1-4.11C
    disposition: REATTRIBUTE
    override_code: 4MA1-2.7C
    tier_wording_source: store
    evidence: >-
      The sibling exposure the R29 root disclosed (ord 0, heading-only
      'Equations & problem-solving', 15 chars). With ords 1 and 2 both
      verdicted REATTRIBUTE 4.11C -> 2.7C, the note's SP family center is
      2.7C and the heading-only row rides it — the R10 related-calculations
      note-level precedent of ords riding the note's SP family (the R29 fresh
      verdict a1510bc4ed0196b2 cites the same precedent). The row REMAINS in
      the promoted set at its amended code.
  factorising-by-grouping::0:
    mapping_id: 7f9612c10eaaaa2e
    current_code: 4MA1-2.2F
    disposition: DEMOTE_TO_WORKLIST
    override_code: null
    tier_wording_source: store
    evidence: >-
      The R26 same-class candidate, now verdicted — the DEMOTE batch the R26
      record projected (its census remark: 'verdict a future round's
      same-class repair (a 3-row DEMOTE batch ...) or leave as-is'). The
      heading-only chunk 'Factorising by grouping' (15 chars) rides the note
      whose EVERY section teaches grouping of four-term two-variable
      expressions; the R26 full-note census found NO ord teaching 2.2F's
      within-cap demand and this round re-verifies the class against the
      corpus: ord 1's worked body 3x(t+4) + 2(t+4) -> (t+4)(3x+2) and the
      formed-common-bracket case xy + 3x + 5y + 15 -> x(y+3) + 5(y+3) (read
      verbatim this round) — no x^2 + bx + c expression anywhere. 2.2F's
      demand (both the Higher-operative wording and the C30 ledger text,
      'understand the concept of a quadratic expression and be able to
      factorise such expressions (limited to x^2 + bx + c)') does not reach
      four-term two-variable grouping; 2.2B's un-limited wording factors
      QUADRATIC expressions and a two-variable four-term expression is not a
      quadratic expression; no other 2.2 row (2.2A expand-products, 2.2C
      algebraic fractions, 2.2D complete-the-square, 2.2E proofs) teaches
      factorising-by-grouping — REATTRIBUTE has no canonical target, and a
      RETAIN would knowingly re-create the scope difference for the next
      re-gate to reject again (the R18 labeling-primer precedent). The honest
      disposition is the menu's DEMOTE: the row leaves the promoted surface
      and lands unresolved-span with chunk identity intact (the W3 invariant),
      the loop's FIFTH DEMOTE and the SECOND+THIRD+FOURTH-of-a-batch — the
      R26 ord-2 DEMOTE's own class, now completed across the note. 2.2F keeps
      its coverage via 14 remaining rows (17 minus the 3-row batch, verified
      row-by-row this round: the factorising-quadratics note's 7 rows and the
      difference-of-two-squares note's within-limit DOTS surface).
  factorising-by-grouping::1:
    mapping_id: b7602c675bf3a406
    current_code: 4MA1-2.2F
    disposition: DEMOTE_TO_WORKLIST
    override_code: null
    tier_wording_source: store
    evidence: >-
      The R26 same-class candidate, now verdicted: 'How do I factorise
      expressions with a common bracket?' teaches 3x(t+4) + 2(t+4) ->
      (t+4)(3x+2) via the common-bracket method ('The whole bracket, (t+4),
      can be "taken out" like a common factor' — read verbatim this round) —
      four-term two-variable grouping, not a quadratic expression, so 2.2F's
      limited x^2 + bx + c cap and 2.2B's quadratic-expression wording both
      miss it and no canonical 188 row teaches it (the R26 census + this
      round's re-verification). DEMOTE — the R18 precedent: no target, RETAIN
      re-creates the defect. See the ::0 entry for the batch disposition.
  factorising-by-grouping::3:
    mapping_id: 2ea85d1d97ebae38
    current_code: 4MA1-2.2F
    disposition: DEMOTE_TO_WORKLIST
    override_code: null
    tier_wording_source: store
    evidence: >-
      The R26 same-class candidate, now verdicted: 'Does it matter what order
      I group in?' re-groups xy + 3x + 5y + 15 and works ab + 3b + 2a + 6
      (the R26 census, re-verified this round) — four-term two-variable
      grouping, outside 2.2F's cap and 2.2B's wording, no canonical target.
      DEMOTE — see the ::0 entry for the batch disposition.
  3d-pythagoras-and-trigonometry::3:
    mapping_id: 75244f93401689fe
    current_code: 4MA1-4.8D
    disposition: REATTRIBUTE
    override_code: 4MA1-4.8F
    tier_wording_source: store
    evidence: >-
      The R24 'ord-3 promoted-surface extension candidate (3d-pythagoras
      SOHCAHTOA-3D)', now verdicted — and the verdict DISSOLVES the extension
      question: the surface is IN CAP at 4.8F. The section's verbatim content:
      'Again, look for right-angled triangles to use with SOHCAHTOA — you may
      need combinations of triangles that lead to the missing side or angle'
      (read from the corpus this round). The chunk teaches USING
      trigonometric ratios (SOHCAHTOA) inside three-dimensional figures to
      find missing sides and angles — 'apply trigonometrical methods to solve
      problems in three dimensions' (4.8F's official wording, whose
      including-clause 'finding the angle between a line and a plane' is
      illustrative, not exhaustive) — and teaches NO Pythagoras (no a^2 + b^2
      = c^2 anywhere). 4.8D's demand is 'use Pythagoras' theorem in three
      dimensions': exactly the R22 ord-4 class (the R5 apply record's own
      reject note for that row: the method is trigonometric end to end, the
      joined code's demand is Pythagoras). The canonical target EXISTS and the
      R5 record itself cited it: 4.8F — where the note's sibling ord 4
      ('How do I find the angle between a line and a plane?') already sits
      SUGGESTED since the R22 re-attribution. The 'extension' framing
      dissolves: SOHCAHTOA-in-3D is not beyond-spec content, it is 4.8F's
      demand verbatim; the candidate was an adjacency mis-join onto the
      note's Pythagoras code, not an out-of-cap surface. NOT a tier artifact
      (4.8D and 4.8F are distinct Higher-only rows in the ratified 188; the
      R5 record verified both absent from the C30 ledger). The row REMAINS in
      the promoted set at its amended code (the R26 supersedes convention).
      4.8D keeps 4 rows (verified this round); 4.8F gains its second row.
  drawing-straight-line-graphs::5:
    mapping_id: d58b7f9f0fa551d3
    current_code: 4MA1-3.3F
    disposition: REATTRIBUTE
    override_code: 4MA1-3.3I
    tier_wording_source: store
    evidence: >-
      The R26 same-class candidate, now verdicted. The section's verbatim
      content: 'Instead of rearranging, equations in the form ax + by = c ...
      can also be plotted by considering the x and y intercepts — substitute
      in x = 0 to find the y-intercept ... y = 0 to find the x-intercept ...
      The points (0, 6) and (10, 0) can then be plotted and joined with a
      straight line', with 'Always plot at least 3 points' and the worked
      example plotting two lines from tables of values. The chunk's demand is
      GENERATING POINTS and PLOTTING straight-line (linear) graphs — 3.3I
      'recognise, generate points and plot graphs of linear and quadratic
      functions' on its linear surface VERBATIM (the intercept pairs and
      value tables ARE the generated points). 3.3F's Higher-operative demand
      is 'calculate the gradient of a straight line given the coordinates of
      two points' and NO two-point gradient calculation appears anywhere in
      the section (the R25 root's finding for the sibling ord 4, re-verified
      for this section this round); the C30 ledger's Foundation wording for
      3.3F ('draw and interpret straight line conversion graphs') is a
      different surface the section also does not teach (no conversion
      graphs) — not a tier artifact in either direction. The rearrangement
      inside the worked example is the 3.3H surface the sibling ord 4 already
      carries (R26), but the section's headline demand is the plotting, and
      the note's own ord 1 ('How do I draw a straight line from a table of
      values?') already rides 3.3I — the note's SP family center for its
      drawing surface. The row REMAINS in the promoted set at its amended
      code.
  drawing-straight-line-graphs::0:
    mapping_id: 91a5080f8b390de6
    current_code: 4MA1-3.3F
    disposition: REATTRIBUTE
    override_code: 4MA1-3.3I
    tier_wording_source: store
    evidence: >-
      The FOURTH H3 HOLD row (the R5-apply hold set), resolved NOT by sign-off
      but by re-homing — the sign-off question on 3.3F dissolves because the
      join itself fails scrutiny. The chunk is the heading-only structural
      slice 'Drawing linear graphs' (20 chars) riding the note whose taught
      surfaces are drawing/plotting linear graphs (ords 1-5: tables of values
      @3.3I, y = mx + c drawing @3.3H x2, rearrangement @3.3H since R26,
      intercept plotting @3.3I by this round's ::5 verdict) — the note teaches
      NO two-point gradient calculation anywhere, and 3.3F's Higher-operative
      demand is exactly that ('calculate the gradient of a straight line given
      the coordinates of two points'); the note-level join to 3.3F is the
      corpus's own annotation of record and STANDS untouched at the join
      layer (the R14/R18/R22/R23/R26 convention), but the STORE rows move:
      the heading-only row rides the note's SP family to 3.3I (the R10
      related-calculations precedent), where the note's ord 1 is the
      note's own 3.3I row. The row STAYS SUGGESTED (a re-homed hold is not a
      sign-off; its promotion remains the section-7 gate-3 question every
      SUGGESTED row carries), re-keying to its 3.3I identity at the R31
      rebuild. 3.3F keeps its coverage via the conversion-graphs note's 4
      promoted rows (verified this round — they carry 3.3F's Foundation
      ledger surface verbatim per the R26 record).

