census_remarks:
  - remark: >-
      THE RATIONAL/IRRATIONAL CORPUS GAP — CLOSED AS A RECORDED DECISION (the
      R26 record's remark, carried through R28/R29): the types-of-number ord-1
      section defines rational numbers (a/b form, b != 0; examples 0, 3, 1/3,
      3/7, -7/3) and irrational numbers (pi, sqrt(2), cube root of 5) — the
      integers half re-homed to 1.1A at R26 (landed R28) — while NO canonical
      188 row classifies rational vs irrational numbers (verified against the
      1.1A-1.1H block at R26; re-verified this round against the full
      registry: no official_wording in the ratified 188 names rational or
      irrational classification). THE DECISION: the gap is ACKNOWLEDGED as
      beyond-spec corpus content and the census remark is CLOSED. The
      ratified 188 is the official PDF-direct parse (canonical-builder-2.0,
      sha-pinned) — the official specification's own scope defines the code
      set, and the store's coverage model is coverage OF the official spec,
      not of the corpus; inventing a 189th row would falsify the
      official-spec alignment and break the G4/code-domain invariants every
      round's check battery asserts. The corpus's rational/irrational
