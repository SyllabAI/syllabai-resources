command_kinds:
- code: 4MA1-1.6E
  verb: solve
  guide_class: APPLY_PROCEDURE
  demanded_substance: solving simple percentage problems including percentage increase and
    decrease — the multiplier route (finding 115% of 80 as 1.15 × 80; decreasing by 15% as
    0.85 × 80), the add/subtract-the-found-percentage route, and the percentage-change and
    profit-or-loss formulas read through the before/after multiplier
- code: 4MA1-1.6F
  verb: use
  guide_class: APPLY_PROCEDURE
  demanded_substance: using reverse percentages — spotting a find-the-original question,
    writing before × p = after with the multiplier p of the change, and rearranging by
    division (Before = After ÷ Multiplier), including the unitary 10%-then-100% route the
    mark scheme demonstrates
- code: 4MA1-1.6G
  verb: use
  guide_class: APPLY_PROCEDURE
  demanded_substance: using compound interest and depreciation — the repeated-multiplier
    walk (300 × 1.05 twice as 300 × 1.05²; a car worth $16 000 at 0.85⁶) and the
    P(1 ± r/100)ⁿ formula shape, including dividing by mⁿ for the reverse problem
- code: 4MA1-1.7A
  verb: use
  guide_class: APPLY_PROCEDURE
  demanded_substance: >-
    using ratio notation — colon notation and part-whole reading,
    reduction to simplest form via common factors (ideally the HCF in one go), and the
    links to fraction notation (a part out of the whole; 27 : 32 as 27/32 of the height)
- code: 4MA1-1.7B
  verb: divide
  guide_class: APPLY_PROCEDURE
  demanded_substance: dividing a quantity in a given ratio or ratios — total parts → value
    of one part → each share, the given-one-share and difference variants, and combining
    two two-part ratios into a three-part ratio through the shared link term
- code: 4MA1-1.7C
  verb: use
  guide_class: APPLY_PROCEDURE
  demanded_substance: using the process of proportionality to evaluate unknown quantities —
    identifying the two quantities, finding the factor (new ÷ old), scaling the other
    quantity by it, and the unitary method (find one of something, then scale up)
- code: 4MA1-1.7D
  verb: calculate
  guide_class: APPLY_PROCEDURE
  demanded_substance: calculating an unknown quantity from quantities that vary in direct
    proportion — the y = kx equation route with the constant of proportionality found by
    substitution, including the power/root variants y = kx², y = k√x, y = kx³
- code: 4MA1-1.7E
  verb: solve
  guide_class: APPLY_PROCEDURE
  demanded_substance: solving word problems about ratio and proportion — the sharing walk
    applied to wordy contexts, difference-between-parts and given-one-quantity variants,
    and ratios combined with fractions and percentages in harder problems
- code: 4MA1-1.8A
  verb: solve
  guide_class: APPLY_PROCEDURE
  demanded_substance: solving problems using upper and lower bounds where values are given
    to a degree of accuracy — choosing the right bound combination per operation (UB + UB,
    UB × UB, UB ÷ LB, …) and answering the contextual question (will it fit; minimum
    number of panels) from the bounded extremum
- code: 4MA1-1.8B
  verb: round
  guide_class: APPLY_PROCEDURE
  demanded_substance: rounding to a given number of significant figures or decimal places —
    the place-value/next-digit rule, zeros as place-keepers for large numbers and between
    the decimal point and the first significant figure, and the exact-decimal/required-
    accuracy conventions
- code: 4MA1-1.8C
  verb: identify
  guide_class: APPLY_PROCEDURE
  demanded_substance: identifying upper and lower bounds where values are given to a degree
    of accuracy — halving the degree of accuracy, half-up for the upper bound and half-down
    for the lower bound, and stating the error interval LB ≤ x < UB
- code: 4MA1-1.8D
  verb: use
  guide_class: APPLY_PROCEDURE
  demanded_substance: using estimation to evaluate approximations to numerical calculations
    — rounding each value to one sensible figure (usually 1 s.f., never to 0 as a
    denominator), performing the rounded calculation, and the over/underestimate direction
    from which way each value moved
