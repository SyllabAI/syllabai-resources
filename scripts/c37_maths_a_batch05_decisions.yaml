command_kinds:
- code: 4MA1-1.9A
  verb: solve
  guide_class: APPLY_PROCEDURE
  demanded_substance: solving problems involving standard form — converting to and from
    a × 10ⁿ form, multiplying and dividing in standard form by adding and subtracting the
    indices, addition and subtraction via the matched-power rewrite, and rewriting a
    non-standard calculator answer (3 820 000 = 3.82 × 10⁶; 243 × 10²⁰ = 2.43 × 10²²)
- code: 4MA1-1.10A
  verb: use
  guide_class: APPLY_PROCEDURE
  demanded_substance: using and applying number in everyday personal, domestic or community
    life — the value-for-money comparison walk (find the price of one item by dividing both
    quantities by the same scale factor, compare across deals, state the cheaper as better
    value with the reason)
- code: 4MA1-1.10B
  verb: carry
  guide_class: APPLY_PROCEDURE
  demanded_substance: carrying out calculations using standard units of mass, length, area,
    volume and capacity — the metric conversion tables, the squared and cubic conversion
    rates (square/cube the unit conversion rate — 1 m² = 10 000 cm², 1 m³ = 1 000 000 cm³),
    and the calculations-using-bounds arm (the upper/lower-bound-per-operation table and
    the contextual walks) inherited from held B04-H-07
- code: 4MA1-1.10C
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: understanding and carrying out calculations using time and money,
    including converting between currencies — keyword reading (total/difference),
    two-decimal-place money rounding conventions, larger-amount rounding judgement, and the
    multiply-or-divide exchange-rate decision made safe by the less-than sanity check
- code: 4MA1-1.11A
  verb: use
  guide_class: APPLY_PROCEDURE
  demanded_substance: using a scientific electronic calculator to determine numerical
    results — direct input of expressions, the square-root/power/fraction buttons, the
    standard-form button, and the display-tolerance awareness (different calculator displays
    score full marks)
- code: 4MA1-2.1A
  verb: use
  guide_class: APPLY_PROCEDURE
  demanded_substance: using index notation involving fractional, negative and zero powers —
    the negative power as reciprocal, the fractional power as root-then-power (cube root
    then square, or the other way around), and zero-power behaviour
- code: 4MA1-2.1B
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: understanding that algebraic expressions follow the generalised rules
    of arithmetic — order of operations applied to algebraic terms, like-term collection as
    the generalised additive arithmetic, and substitution as the arithmetic evaluation of
    the generalised expression
- code: 4MA1-2.1C
  verb: use
  guide_class: APPLY_PROCEDURE
  demanded_substance: using index notation for positive and negative integer powers
    (including zero) — the product law aᵐ × aⁿ = aᵐ⁺ⁿ (add the powers), the quotient law
    aᵐ ÷ aⁿ = aᵐ⁻ⁿ, and the zero-power behaviour w¹ × w⁰ = w
- code: 4MA1-2.1D
  verb: use
  guide_class: APPLY_PROCEDURE
  demanded_substance: using index laws in simple cases — selecting the correct law for the
    given form (product-of-powers ADDS the powers; power-of-a-power MULTIPLIES them), the
    distinction the documented wrong-answer class violates
- code: 4MA1-2.2A
  verb: expand
  guide_class: APPLY_PROCEDURE
  demanded_substance: expanding the product of two or more linear expressions — multiplying
    the outside term by each inside term, distributing over the full product (everything ×
    everything), and collecting the resulting like terms with sign care
- code: 4MA1-2.2B
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: understanding the concept of a quadratic expression and being able to
    factorise such expressions — the ax² + bx + c form, the pair-of-numbers search
    (multiply to ac, add to b), the grouping and grid factorising methods, and common-factor
    extraction as the first factorising move
- code: 4MA1-2.2C
  verb: manipulate
  guide_class: APPLY_PROCEDURE
  demanded_substance: manipulating algebraic fractions where the numerator and/or the
    denominator can be numeric, linear or quadratic — factorise-and-cancel for
    multiplication, the reciprocal flip for division, the LCD walk for addition and
    subtraction, and fraction clearing when solving
