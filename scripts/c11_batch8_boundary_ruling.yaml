  (the store''s practical:false flags), so NO practical owns any batch-8 SP
  and no PR->concept edges are authored (the PR-07/PR-08 lane was batch 7).' 

boundary_edge_ruling:
  rule: 'the FN-B1-2/FN-B2-2 cross-batch discipline at the S2-h boundary:
    boundary EDGES are sanctioned ONLY into the exact-owner nodes below, ONLY
    for the stated dependency surfaces; boundary MINTING is forbidden; if any
    batch-8 term ever matches an existing node outside this sanctioned set,
    the boundary edge is MANDATORY and the mint FORBIDDEN (fail-closed at
    preverify/G03/c11.4). All THREE sanctioned targets are EXISTING-OWNER
    nodes (batch 3''s CON-ION-CHARGE-RULES x2 and batch 1''s
    CON-PURE-SUBSTANCE) — batch 8 closes NO deferrals (batch 6 closed the
    last two: B5-H-10 and the iron-route note) and creates none: the batch-8
    audit surfaces either resolve in-batch, ride the three sanctioned edges,
    or are held/future-noted (B8-H-01..09, the future_boundary_notes).'
  sanctioned_targets:
    - for_sps:
        - 4CH1-2.48
      owner: batch 3
      surface: 'the 2.48 anion tests are organised by ION identity — the spec
        bullets name the anions with their charges (Cl-, Br-, I- via acidified
        silver nitrate; SO4 2- via acidified barium chloride; CO3 2- via
        hydrochloric acid + the gas evolved) and the note''s equations
        (CO3 2- + 2H+ -> CO2 + H2O; Ba 2+ + SO4 2- -> BaSO4) presuppose the
        named-ion/charge vocabulary applied as given, never re-taught by the
        2.48 note; the target is the "common ions / ion charges" owner (the
        named-ion table with the deduction rule — batch 3; the B7-E-10 class)'
      target: 4CH1-CON-ION-CHARGE-RULES
    - for_sps:
        - 4CH1-2.47
      owner: batch 3
      surface: 'the 2.47 cation tests are likewise organised by ION identity —
        the spec bullets name NH4+, Cu2+, Fe2+ and Fe3+ (the NaOH precipitate
        table equations Cu2+ + 2OH- -> Cu(OH)2 etc. and the NH4+ + OH- ->
        NH3 + H2O ionic equation) — the same named-ion/charge vocabulary
        applied as given (the second edge into the batch-3 owner; the batch-5
        x2-into-one-owner precedent)'
      target: 4CH1-CON-ION-CHARGE-RULES
    - for_sps:
        - 4CH1-2.50
      owner: batch 1
      surface: 'the 2.50 physical purity test works BECAUSE pure substances
        have fixed boiling points — the note teaches the impurity effect
        inline ("Any impurities present will usually tend to raise the
        boiling point and depress the melting point of pure substance"),
        which IS the batch-1 owner''s surface ("Pure substance (chemical
        sense) and fixed melting/boiling points"; aliases "pure", "purity")
        applied as the test''s principle — the USED_WITHOUT_RETEACHING class'
      target: 4CH1-CON-PURE-SUBSTANCE
  max_boundary_edges: 3
