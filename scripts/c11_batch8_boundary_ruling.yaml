  (SP-family nodes: 2.44 the five named gas tests as ONE family node / 2.45+2.46
  the flame-test family as ONE node (procedure + cation colours — the B7-ID-01
  one-family precedent; the note teaches the colours INSIDE the technique as one
  identification method) / 2.47 the cation tests (NaOH precipitate colours +
  the NH4+ ammonia-gas route) as ONE family node / 2.48 the anion tests
  (halides, sulfate, carbonate) as ONE family node / 2.49 the anhydrous
