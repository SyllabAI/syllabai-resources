section_overrides:
  types-of-number::1:
    mapping_id: 81c0b59852d5d4b6
    current_code: 4MA1-1.1G
    disposition: REATTRIBUTE
    override_code: 4MA1-1.1A
    tier_wording_source: store
    evidence: >-
      The section teaches INTEGERS, RATIONAL and IRRATIONAL numbers
      (integers are whole numbers, positive/negative/zero, the example set
      -3 to 3; rational numbers in a/b form with b != 0, examples 0, 3, 1/3,
      3/7, -7/3; irrational numbers pi, sqrt(2), cube root of 5) — the R25
      root's own reading, re-verified against the section's verbatim chunk
      evidence this round (the R25 review sheet's 539-char self-slice). 1.1G's
      demand is the vocabulary set 'use the terms odd, even, prime numbers,
      factors and multiples' and the section teaches NONE of those terms —
      the clean adjacent-surface reject. The canonical target EXISTS and the
      R25 root cited it: 1.1A 'understand and use integers (positive,
      negative and zero)' — the section's integer definition AND its
      -3-to-3 example set are that demand VERBATIM (the store's operative
      wording carries it, verified this round). Not a tier artifact: 1.1G is
      absent from the C30 ledger (Higher-only) and 1.1A is absent TOO (also
      Higher-only) — verified this round; the section is Higher-corpus
      content riding the Higher wording. The proposals scorer's top-1 for
      this row is 1.1A @ 0.1859 — convergence with the R25 root's citation —
      while the row's current code 1.1G outscores it 0.1981 (the vocabulary
      tokens of 1.1G's wording ride the R25 note text into the score): a
      scorer artifact by construction, exactly the R14/R18
      mass-conversion-near-miss observation class — the verdict adjudicates
      on the root evidence + the verbatim wordings, not on the scorer. The
      note-level join to 1.1G STANDS via the note's vocabulary sections
      (ords 0/2/3/4/5/6 — 'What are multiples?', 'What are factors?', 'How
      do I find factors?', 'What are prime numbers?' are 1.1G's demand
      verbatim; ord 10 'What are cube roots?' rides the same anchor, sampled
      and confirmed in the promoted surface). CONSEQUENCE: 1.1A GAINS chunk
      coverage at the next substrate re-build (the R12/R16/R20/R24
      coverage-gain precedent — 1.1A is currently uncovered, its DEFER row
      da25da48e0be5c64 resolving into an anchored row); 1.1G keeps 7 of its
      8 rows. The rational/irrational remainder of the section has NO
      canonical 188 row (the R14 mass-conversion absence class — the
      1.1A-1.1H block contains no rational/irrational classification row):
      recorded as a corpus-gap census remark for the operator, NOT
      adjudicated. REATTRIBUTE, map-landed for the R28-shaped rebuild; the
      promotions amendment supersedes the row's pinned code 1.1G -> 1.1A
      (the row stays in the promoted set — the R5 promotion judged the
      section's teaching value, the repair corrects its code).
  introduction-to-vectors::3:
    mapping_id: 7fdded0b9245e1c3
    current_code: 4MA1-5.1D
    disposition: REATTRIBUTE
    override_code: 4MA1-5.1C
    tier_wording_source: store
    evidence: >-
      The section teaches SCALAR MULTIPLICATION of a column vector (a scalar
      is a number not a vector — no direction; multiply top and bottom
      components by the scalar; 3 x (2, -1) = (6, -3) componentwise) — the
      R25 root's own reading, re-verified against the section's verbatim
      chunk evidence this round (the R25 review sheet's 621-char self-slice).
      5.1D's demand is 'add and subtract vectors' and the section contains
      NO vector addition or subtraction. The canonical target EXISTS and the
      R25 root cited it: 5.1C 'multiply vectors by scalar quantities' — the
      demand VERBATIM (the store's operative wording carries it, verified
      this round). Not a tier artifact: 5.1D AND 5.1C are BOTH absent from
      the C30 ledger (verified this round — Higher-only rows), and 5.1C is a
      distinct ratified row, not a tier variant of 5.1D. The proposals
      scorer's top-1 for this row is 5.1C @ 0.1762, BEATING the current
      code's 0.1545 — clean convergence with the R25 root's citation (the
      R22 corroboration class). The note-level join to 5.1D STANDS via the
      note's add/subtract sections (ord 2 'How do I add and subtract column
      vectors?' is 5.1D's demand verbatim — promoted, confirmed in the R5
      surface; ords 0/1 the vector-notation basics; ord 4 'How do I write an
      expression as a single column vector?' rides the same anchor
      unsampled). CONSEQUENCE: 5.1C GAINS chunk coverage at the next
      substrate re-build (5.1C is currently uncovered, its DEFER row
      2332964a4f1b02ca resolving into an anchored row); 5.1D keeps 4 of its
      5 rows. REATTRIBUTE, map-landed for the R28-shaped rebuild; the
      promotions amendment supersedes the row's pinned code 5.1D -> 5.1C.
  drawing-straight-line-graphs::4:
    mapping_id: e6ed72481e8ffc2e
    current_code: 4MA1-3.3F
    disposition: REATTRIBUTE
    override_code: 4MA1-3.3H
    tier_wording_source: store
    evidence: >-
      The section teaches REARRANGING a linear equation into y = mx + c form
      (3x + 5y = 30 -> subtract 3x -> 5y = -3x + 30 -> divide by 5 -> y =
      -3/5 x + 6) and reading off the gradient -3/5 and the y-intercept 6 to
      make plotting easier — the R25 root's own reading, re-verified against
      the section's verbatim chunk evidence this round (the R25 review
      sheet's 526-char self-slice). 3.3F's demand is 'calculate the gradient
      of a straight line given the coordinates of two points' and NO
      two-point gradient calculation appears anywhere in the section; the
      C30 ledger's Foundation wording for 3.3F ('draw and interpret straight
      line conversion graphs') is a DIFFERENT surface the section also does
      not teach (no conversion graphs present) — so the reject is not a
      tier artifact in either direction, precisely as the R25 root stated.
      The canonical target EXISTS and the R25 root cited it: 3.3H
      'recognise that equations of the form y = mx + c are straight line
      graphs with gradient m and intercept on the y-axis at the point (0,c)'
      — the section teaches exactly that recognition via rearrangement
      (rearrange into y = mx + c, identify gradient m and intercept c;
      the store's operative wording carries it, verified this round). Not a
      tier artifact: 3.3H is absent from the C30 ledger (Higher-only,
      verified). The proposals scorer's top-1 for this row is 3.3H @ 0.2752,
      BEATING the current code's 0.2159 — the strongest convergence of the
      round. The note-level join to 3.3F STANDS via the note's remaining 3.3F
      surface (ord 5 'How can I plot equations in the form ax + by = c?'
      rides the anchor unsampled — see the census remark; the ord-0 H3 HOLD
      is the convention's own fail-closed branch) AND the conversion-graphs
      note's 4 promoted rows (the ledger's Foundation 3.3F surface verbatim).
      Note the 3.3H hold question does not arise: the ord-4 REATTRIBUTE is
      not a content-row CONFIRM of note+3.3F, so it creates NO H2 un-hold
      evidence for the drawing-straight-line-graphs ord-0 hold. CONSEQUENCE:
      3.3H ALREADY carries coverage (7 promoted rows, incl. this note's ords
      2/3) — code census STATIONARY for 3.3H, which gains one more anchored
      row; 3.3F keeps 6 of its 7 rows. REATTRIBUTE, map-landed for the
      R28-shaped rebuild; the promotions amendment supersedes the row's
      pinned code 3.3F -> 3.3H.
  factorising-by-grouping::2:
    mapping_id: 70f0b027f3f1528f
    current_code: 4MA1-2.2F
    disposition: DEMOTE_TO_WORKLIST
    override_code: null
    tier_wording_source: store
    evidence: >-
      DEMOTE — the scope §4 R1 surface-3 menu's second action, FOURTH
      exercise (R10 related-calculations ord 2, R14 unit-conversions ord 2,
      R18 basic-angle-properties ord 1, here) and the FIRST of a PROMOTED
      row, recorded never forced. The section teaches FACTORISING BY
      GROUPING of a FOUR-TERM, TWO-VARIABLE expression (xy + 3x + 5y + 15 ->
      first pair common factor x -> x(y + 3); second pair common factor 5 ->
      5(y + 3); the common bracket (y + 3) spotted -> (y + 3)(x + 5)) — the
      R25 root's own reading, re-verified against the section's verbatim
      chunk evidence this round (the R25 review sheet's 496-char self-slice).
      2.2F's demand is explicitly capped 'understand the concept of a
      quadratic expression and be able to factorise such expressions
      (limited to x^2 + bx + c)' and the section's expression is not a
      quadratic in one variable at all; even 2.2B's un-limited Higher
      wording ('a quadratic expression') does not reach it — the R25 root's
      own enumeration stands re-verified: no other 2.2x row teaches grouping
      (2.2A expanding / 2.2C algebraic fractions / 2.2D completing the
      square / 2.2E proofs all miss) and no canonical 188 row anywhere
      teaches four-term two-variable grouping per se. Not a tier artifact
      (2.2F is absent from the C30 ledger — Higher-only, verified). The
      proposals packet documents the ABSENCE finding in scorer form: the
      row's current code 2.2F @ 0.1944 tops the including-current packet and
      the top-excluding candidate 2.8C @ 0.1937 is noise — nothing in the
      ratified 188 beats ~0.19, exactly the R18 labeling-primer class (the
      scorer confirming the absence of any better surface). The R25 menu
      offered 'the DEMOTE menu or an operator re-anchor'; the fired
      directive named NO re-anchor, so the menu's DEMOTE is the disposition —
      a RETAIN would knowingly re-create the scope difference for the next
      re-gate to reject again. The note-level join to 2.2F STANDS at the
      join layer (byte-untouched resolution — see the census remark for the
      honest scoping note on this note's anchor). CONSEQUENCE: the row
      LEAVES the promoted surface and the anchored surface at the next
      substrate re-build — the promotions amendment EXCLUDES it (832 -> 831)
      and the c40 DEMOTE convention lands it unresolved-span (23 -> 24);
