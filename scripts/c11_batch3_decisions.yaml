# Command-kind tags (frozen guide §8) — batch-3 slice only (registry of record:
# graph/spec_command_kinds.yaml, merged with the earlier tags by the generator).
command_kinds:
- code: 4CH1-1.37
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: how ions are formed by electron loss or gain (the full-outer-shell motive; metals lose electrons to become cations, non-metals gain electrons to become anions)
- code: 4CH1-1.38
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the charges of the listed ions (Group 1/2/3 metals, Group 5/6/7 non-metals, Ag+, Cu2+, Fe2+, Fe3+, Pb2+, Zn2+, H+, OH-, NH4+, CO3 2-, NO3-, SO4 2-) and the charge-deduction rule from outer electrons
- code: 4CH1-1.39
  verb: write
  guide_class: PRODUCE_EQUATION
  demanded_substance: writing formulae for compounds formed between the listed ions (charge cancellation, direct comparison and swap-and-drop, brackets around compound ions)
- code: 4CH1-1.40
  verb: draw
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: dot-and-cross diagrams showing the formation of ionic compounds by electron transfer (Group 1/2/3 with Group 5/6/7 combinations, outer electrons only, bracketed charges)
- code: 4CH1-1.41
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: ionic bonding in terms of electrostatic attraction between oppositely charged ions acting in all directions
- code: 4CH1-1.42
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: why compounds with giant ionic lattices have high melting and boiling points (strong electrostatic forces between oppositely charged ions, large amounts of thermal energy, charge-magnitude effect)
- code: 4CH1-1.43
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: that ionic compounds do not conduct electricity when solid but do conduct when molten and in aqueous solution
- code: 4CH1-1.44
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: that a covalent bond is formed between atoms by the sharing of a pair of electrons
- code: 4CH1-1.45
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: covalent bonds in terms of electrostatic attraction between the shared pair of electrons and the nuclei of the atoms involved
- code: 4CH1-1.46
  verb: understand
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: using dot-and-cross diagrams to represent covalent bonds in diatomic molecules (H2, O2, N2, halogens, hydrogen halides), inorganic molecules (H2O, NH3, CO2) and organic molecules (CH4, C2H6, C2H4)
- code: 4CH1-1.47
  verb: explain
  guide_class: UNDERSTAND_RELATION
  demanded_substance: why substances with simple molecular structures are gases or liquids, or solids with low melting and boiling points (weak intermolecular forces between molecules)
- code: 4CH1-1.48
  verb: explain
  guide_class: UNDERSTAND_RELATION
  demanded_substance: why the melting and boiling points of simple molecular substances generally increase with increasing relative molecular mass (more electrons, stronger intermolecular forces)
- code: 4CH1-1.49
  verb: explain
  guide_class: UNDERSTAND_RELATION
  demanded_substance: why substances with giant covalent structures are solids with high melting and boiling points (huge numbers of strong covalent bonds requiring lots of energy)
- code: 4CH1-1.50
  verb: explain
  guide_class: UNDERSTAND_RELATION
  demanded_substance: how the structures of diamond, graphite and C60 fullerene influence their physical properties, including electrical conductivity and hardness
- code: 4CH1-1.51
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: that covalent compounds do not usually conduct electricity
- code: 4CH1-1.52C
  verb: know
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: representing a metallic lattice by a 2-D diagram (regular pattern of positive metal ions with delocalised electrons)
- code: 4CH1-1.53C
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: metallic bonding in terms of electrostatic attraction between positive metal ions and delocalised electrons
- code: 4CH1-1.54C
  verb: explain
  guide_class: UNDERSTAND_RELATION
  demanded_substance: typical physical properties of metals (electrical conductivity, malleability) explained by metallic bonding and the layer structure
- code: 4CH1-1.55C
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: why covalent compounds do not conduct electricity (no freely moving charged particles in solid, liquid or gas)
- code: 4CH1-1.56C
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: why ionic compounds conduct electricity only when molten or in aqueous solution (ions fixed in the solid lattice, free to move when molten or dissolved)
- code: 4CH1-1.57C
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: that anion and cation are the terms for negative and positive ions respectively (and their migration to anode/cathode during electrolysis)
- code: 4CH1-1.58C
  verb: describe
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: experiments to investigate electrolysis with inert electrodes, of molten compounds (including lead(II) bromide) and aqueous solutions (including sodium chloride, dilute sulfuric acid and copper(II) sulfate), with prediction of the products
- code: 4CH1-1.59C
  verb: write
  guide_class: PRODUCE_EQUATION
  demanded_substance: ionic half-equations representing the reactions at the electrodes during electrolysis and why these reactions are classified as oxidation or reduction
- code: 4CH1-1.60C
  verb: investigate
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: the electrolysis-of-aqueous-solutions practical (electrolysis cell, collection and identification of the products at each electrode via gas tests)

