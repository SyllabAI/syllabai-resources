      squeaky pop), oxygen (glowing splint -> relights), carbon dioxide
      (bubble through limewater -> cloudy white), ammonia (damp red litmus
      paper -> blue; avoid touching the tube sides), chlorine (damp blue
      litmus -> red then bleached white)'
  - code: 4CH1-2.45
    verb: describe
    guide_class: DESCRIBE_EXPERIMENT
    demanded_substance: 'the flame-test technique: clean the wire loop in
      dilute acid, heat in the blue Bunsen flame until no colour change, dip
      into the solid sample/solution, place in the edge of the blue flame,
      observe — with the contamination reason (mixed/masked colours) and the
      blue (non-luminous, hottest) flame requirement'
  - code: 4CH1-2.46
    verb: know
    guide_class: KNOW_TERM
    demanded_substance: 'the five cation flame colours as the identification
      table: Li+ red, Na+ yellow, K+ lilac, Ca2+ orange-red, Cu2+ blue-green'
  - code: 4CH1-2.47
    verb: describe
    guide_class: DESCRIBE_EXPERIMENT
    demanded_substance: 'the aqueous-cation tests: a few drops of sodium
      hydroxide solution added to the solution (Cu2+ blue precipitate, Fe2+
      pale green, Fe3+ brown — precipitate = insoluble hydroxide) and the
      ammonium-ion route (add NaOH and warm; identify the ammonia gas evolved
      by the damp red litmus test)'
  - code: 4CH1-2.48
    verb: describe
    guide_class: DESCRIBE_EXPERIMENT
    demanded_substance: 'the aqueous-anion tests: halides (acidify with nitric
      acid, add silver nitrate — AgCl white / AgBr cream / AgI yellow
      precipitates), sulfate (acidify with dilute hydrochloric acid, add
      barium chloride — white BaSO4 precipitate), carbonate (add dilute acid,
      bubble the gas through limewater — cloudy; effervescence seen)'
