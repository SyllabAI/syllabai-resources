- code: 4CH1-1.1
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: particle-level description of the three states (arrangement, movement, closeness and energy of particles) with the simple sphere model
- code: 4CH1-1.2
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: names of the interconversion processes (melting, freezing, boiling, condensation, sublimation) and how each is achieved (energy changes at the melting/boiling point)
- code: 4CH1-1.3
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: interpreting diffusion and dilution-of-coloured-solution experiment results as evidence for the particle model (tiny, moving particles)
- code: 4CH1-1.4
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: definitions of the terms solvent, solute, solution and saturated solution
- code: 4CH1-1.5C
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: solubility in the units g per 100 g of solvent and its dependence on temperature (solids, gases) and pressure (gases)
- code: 4CH1-1.6C
  verb: understand
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: plotting and interpreting solubility curves (g per 100 g of water against temperature, reading and scaling values)
- code: 4CH1-1.7C
  verb: investigate
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: the practical method for finding the solubility of a solid at a specific temperature (saturate, evaporate, heat to constant mass, calculate)
- code: 4CH1-1.8
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: classifying a substance as an element, compound or mixture (including from particle diagrams)
- code: 4CH1-1.9
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: fixed and sharp melting/boiling points of pure substances vs ranges for mixtures, and using melting/boiling data to distinguish them
- code: 4CH1-1.10
  verb: describe
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: the experimental separation techniques (simple distillation, fractional distillation, filtration, crystallisation, paper chromatography) and what each separates
- code: 4CH1-1.11
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: reading a chromatogram (number and position of spots, reference spots) to infer the composition and purity of a mixture
- code: 4CH1-1.12
  verb: understand
  guide_class: CALCULATE
  demanded_substance: calculation of Rf values from chromatogram distances and their use to identify components of a mixture

