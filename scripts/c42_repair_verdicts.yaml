key_finding: the C30 tier-dedupe ledger's Foundation wordings resolve most of the 45
  note-level rejects as WORDING-TIER ARTIFACTS — joins whose code was already correct at
  Foundation tier (e.g. 2.2B-F 'collect like terms', 6.3D-F 'find probabilities from a
  Venn diagram', 4.8A-F 'Pythagoras'' theorem in two dimensions') that the C40 fill
  rejected against the Higher-operative wording alone. R4's re-fill MUST consult both
  tier wordings (store operative wording + ledger foundation.text per code) or it will
  re-reject these joins. 21 joins are AFFIRMED on that evidence; 22 are CORRECTED; 2 are
  UNRESOLVED (no canonical row exists); the residual stays UNRESOLVED per its own
  PDF-verified reason.
dispositions:
  AFFIRM: the current code is correct — ledger Foundation wording evidence; no code change
  CORRECT: the code changes to the corrected_code (canonical 188 member)
  UNRESOLVED: no canonical row teaches the note's content — the wrong code is CLEARED
    (resolved_code -> null), never forced
