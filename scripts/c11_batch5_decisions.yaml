# ---------------------------------------------------------------------------
# Command-kind tags (frozen guide §8) — batch-5 slice only (registry of record:
# graph/spec_command_kinds.yaml, merged with the earlier tags by the generator).
command_kinds:
- code: 4CH1-2.1
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: how the SIMILARITIES in the reactions of lithium, sodium and potassium with water provide evidence for their recognition as one family of elements (the shared metal-hydroxide + hydrogen pattern, alkaline solutions formed)
- code: 4CH1-2.2
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: 'how the DIFFERENCES between the reactions of the first three alkali metals with air and water provide evidence for the reactivity trend in Group 1 (vigour increasing down the group: fizzing/movement for Li, rapid movement and dissolving for Na, lilac flame for K; tarnishing faster down the group)'
- code: 4CH1-2.3
  verb: use
  guide_class: UNDERSTAND_RELATION
  demanded_substance: 'using the Group 1 trends to predict properties of other alkali metals (rubidium, caesium, francium: more vigorous reactions with air and water; lithium least / francium most reactive; soft grey solid, shiny when freshly cut, denser and lower-melting than potassium)'
- code: 4CH1-2.4C
  verb: explain
  guide_class: EXPLAIN_HOW
  demanded_substance: the Group 1 reactivity trend in terms of electronic configurations (one outer electron lost to form 1+ ions; shells increase down the group so the outer electron is further from the nucleus, attraction weakens, less energy is needed to lose it — more reactive down the group)
- code: 4CH1-2.5
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the colours, physical states at room temperature and trends in physical properties of the halogens (fluorine yellow gas, chlorine pale yellow-green gas, bromine red-brown liquid, iodine grey solid; MP/BP increase and states go gas-liquid-solid and colours darken down the group; diatomic molecules)
- code: 4CH1-2.6
  verb: use
  guide_class: UNDERSTAND_RELATION
  demanded_substance: using the Group 7 trends to predict properties of other halogens (reactivity decreases down the group; metal halides via the -1 halide ion and metal valency; non-metal hydrogen halides; slower/less vigorous reactions further down)
- code: 4CH1-2.7
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: how halogen/halide displacement reactions provide evidence for the Group 7 reactivity trend (a more reactive halogen displaces a less reactive halogen from its halide solution; chlorine displaces bromine and iodine, bromine displaces iodine; orange/brown product colours)
- code: 4CH1-2.8C
  verb: explain
  guide_class: EXPLAIN_HOW
  demanded_substance: the Group 7 reactivity trend in terms of electronic configurations (seven outer electrons, halide -1 ions formed by GAINING an electron; shells increase down the group so the outer shell is further from the nucleus, attraction weakens, gaining an electron is harder — less reactive down the group; fluorine most reactive)
- code: 4CH1-2.9
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the approximate percentages by volume of the four most abundant gases in dry air (nitrogen ~80%, oxygen ~20%, argon ~1%, carbon dioxide ~0.04%)
- code: 4CH1-2.10
  verb: understand
  guide_class: UNDERSTAND_RELATION
  demanded_substance: how to determine the percentage by volume of oxygen in air using metal (iron wool in a burette) or non-metal (phosphorus in a bell jar) reactions with a fixed volume of air (oxygen consumed, water rises, initial/final volumes, percentage calculation)
- code: 4CH1-2.11
  verb: describe
  guide_class: KNOW_TERM
  demanded_substance: the combustion of elements in oxygen for magnesium, hydrogen and sulfur (intense white flame / white MgO powder; exothermic, water produced; blue flame / colourless poisonous SO2 gas — with the symbol equations; combustion always exothermic, classifiable as oxidation)
- code: 4CH1-2.12
  verb: describe
  guide_class: KNOW_TERM
  demanded_substance: the formation of carbon dioxide from thermal decomposition of metal carbonates, including copper(II) carbonate (metal carbonate -> metal oxide + CO2 on heating; green CuCO3 darkens to black CuO; CO2 tested with limewater turning milky)
- code: 4CH1-2.13
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: that carbon dioxide is a greenhouse gas and that increasing atmospheric amounts may contribute to climate change (greenhouse gases maintain Earth's temperature; CO2 sources include combustion of fuels and thermal decomposition of carbonates)
- code: 4CH1-2.14
  verb: determine
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: 'the practical determination of the approximate percentage of oxygen in air using a metal or a non-metal (the iron-wool burette method: 3-4 days, water level rise, initial/final air volumes, volume of oxygen, percentage = oxygen/initial x 100 ~ 20%)'

