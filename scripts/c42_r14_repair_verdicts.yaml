section_overrides:
  properties-of-2d-shapes::2:
    current_code: 4MA1-4.2C
    disposition: REATTRIBUTE
    override_code: 4MA1-4.1D
    tier_wording_source: store
    evidence: >-
      the section names the TYPES of triangles (equilateral, isosceles, scalene,
      right-angled) with their side/angle properties — 4.1D 'understand the
      terms isosceles, equilateral and right-angled triangles and the angle
      properties of these triangles' is the surface verbatim (the store's
      operative 4.1D wording, a Foundation code — no tier artifact); 4.2C's
      demand is the parallelogram/rectangle/square/rhombus/trapezium/kite
      family and triangles are not in it; the note-level join stands via its
      quadrilateral sections (ords 3-7, the R13-recorded finding; ord 1 common
      2D shapes is an r4-carried CONFIRM). R13 row 8d1dc5c6897f21cd
  properties-of-2d-shapes::8:
    current_code: 4MA1-4.2C
    disposition: REATTRIBUTE
    override_code: 4MA1-4.6A
    tier_wording_source: ledger
    evidence: >-
      the section teaches CIRCLE terminology (circumference, diameter, radius,
      centre) — the Foundation wording of 4.6A per the C30 ledger ('recognise
      the terms centre, radius, chord, diameter, circumference, tangent, arc,
      sector and segment of a circle'; the store's operative 4.6A wording is
      the Higher internal/external intersecting-chord properties text);
      4.2C's demand is the parallelogram-family properties and circles are not
      in it; the note-level join stands via its quadrilateral sections (ords
      3-7). R13 row 04b62ae1a6fbd346
  two-way-tables::2:
    current_code: 4MA1-6.1B
    disposition: REATTRIBUTE
    override_code: 4MA1-6.3E
    tier_wording_source: store
    evidence: >-
      the section finds PROBABILITIES from a two-way table (totals, row/column
      fractions) — the sample-space determination surface, 6.3E 'understand
      the concepts of a sample space and an event, and how the probability of
      an event happening can be determined from the sample space' verbatim (a
      two-way table IS the sample-space representation; the store's operative
      6.3E wording, a Foundation code); 6.1B's Higher demand is constructing
      cumulative frequency diagrams and its Foundation wording covers
      tabulation methods for statistical diagrams (which carries the note's
      ords 0-1 — what two-way tables are and how to construct them, ord 0
      resolved by the standing convention) — the note-level join stands via
      its tabulation sections. R13 row 3b7f3ef5aa7f26de
  sharing-in-a-ratio::1:
    current_code: 4MA1-1.7E
    disposition: REATTRIBUTE
    override_code: 4MA1-1.7B
    tier_wording_source: store
    evidence: >-
      the section teaches SHARING an amount in a given ratio (add the parts,
      value of one part, scale) — 1.7B 'divide a quantity in a given ratio or
      ratios' verbatim; 1.7E's demand is 'solve word problems about ratio and
      proportion' and the note carries that surface on its word-problem
      sections (ord 3 CONFIRMed fresh in the same R13 draw) — the exact
      inverse of the R9 ratios-and-fdp ord-2 finding (which moved
      ratios-and-fdp ord 2 from 1.7B to 1.7E; this moves sharing-in-a-ratio
      ord 1 from 1.7E to 1.7B); the note-level join stands via its
      word-problem sections. R13 row e770b78477bf94bf
  unit-conversions::2:
    current_code: 4MA1-4.10F
    disposition: DEMOTE_TO_WORKLIST
    override_code: null
    evidence: >-
      DEMOTE — the scope §4 R1 surface-3 menu's second action (exercised first
      at R10, exercised again here). The section converts UNITS OF MASS (1 g =
      1000 mg, 1 kg = 1000 g, 1 tonne = 1000 kg); 4.10F's demand is 'convert
      between units of volume within the metric system' and the section is not
      volume; no canonical 188 row teaches metric mass conversion per se (the
      nearest surface is 1.10B 'carry out calculations using standard units of
      mass, length, area, volume and capacity', which is calculations WITH
      standard units, not unit conversion; 4.9A's ledger Foundation wording
      covers linear and area units only, per the R6 ord-1 ruling that already
      moved this note's lengths section to 4.9A). The note-level join STANDS
      (ords 0, 3 carry genuine volume/capacity content — ord 3 CONFIRMed fresh
      at R13; ord 1 is the R6 4.9A ruling), so a section-level REATTRIBUTE has
      no target and a RETAIN would knowingly re-create the scope difference
      for the R17 re-gate to reject again: the honest disposition is the
      menu's DEMOTE — the chunk leaves the anchored surface for the
      unresolved-span worklist, recorded with this reason, never forced. R13
      row bccde73549e9e0e6

