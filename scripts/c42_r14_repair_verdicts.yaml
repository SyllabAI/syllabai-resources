verdicts:
  spcpt_XWbj3PG2n8tdWF2w:
    note_title: Composite Functions
    prior_code: 4MA1-3.3I
    disposition: CORRECT
    corrected_code: 4MA1-3.2D
    tier_wording_source: store
    evidence: >-
      3.2D 'understand and find the composite function fg and the inverse
      function f-1' (Higher) is verbatim the note's teaching: the note carries
      composite-function content end to end and nothing else — its five chunk
      headings are 'Composite functions' (ord 0, the heading-only class
      resolved by the standing convention), 'What is a composite function?',
      'What notation is used for composite functions?', 'How do I substitute
      numbers into composite functions?' and 'How do I find composite functions
      algebraically?' — definition, fg notation, numeric substitution, algebraic
      composition, zero plotting content anywhere; 3.3I's demand is 'recognise,
      generate points and plot graphs of linear and quadratic functions' and
      the note teaches none of it — a T-SPEC resolution error (the anchor row
      is tier P1_name_fragment_join, score 1.0, T-SPEC-7 operator-verdict
      name-fragment join, PMT excluded) that the C40/R4/R9 exact samples never
      drew (R13 fresh row f709e1f7f397909e, root note-level-class; the note's
      rows hid in the exact stratum's unsampled 80% until the R13 re-seeded
      draw). The store's 3.2D wording is the exact surface (a Higher code, so
      the amendment takes the H-3.2D official id per the R10 tier convention;
      3.2D is not a C30 ledger code — the both-tier check rests on the store
      wording alone, which the note matches verbatim). CORROBORATION: the
      sibling inverse-functions.json note already joins H-3.2D correctly (7
      store rows) — the re-point adds a second note to a covered code, the
      same shape as the R10 2.2A re-point. CONSEQUENCE: all 5 of the note's
      store rows re-attribute wholesale at R15/R16 with the refreshed join;
      any carried CONFIRM on the note's rows under the 3.3I join is superseded
      by the wholesale re-attribution (the R1 45-join precedent, 189 rows).
      CENSUS, NOT WORK: the anchor carries referenced_by_parts = 40 EQ part
      references that ride the wrong code downstream — per the scope §3
      discipline the EQ-side repair is a census item for a separate operator
      decision (R0 pattern), never silently absorbed into this notes-lane
      round

