      decimal or a percentage', the FORWARD direction, and the section teaches
      the inverse operation; not a tier artifact (1.2G is not a shared-tier
      code — absent from the C30 ledger, no foundation wording widens it);
      the canonical target EXISTS — 1.3D 'convert a decimal to a fraction or a
      percentage' is the section's surface verbatim (a Foundation code, bare
