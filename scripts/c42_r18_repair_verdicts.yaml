      row is its decimal->fraction sibling, the R17 root's own citation); the
      note-level join STANDS via its forward-conversion sections (ords 5/6
      teach fraction -> decimal and fraction -> percentage — the demand
      verbatim). R17 row 73324fa2b6bd3433. CONSEQUENCE: 1.3D gains chunk
      coverage at the next substrate re-build (the R12/R16 coverage-gain
      precedent: 1.6A + 1.6C at R12 via the R10 REATTRIBUTE rows, 4.1D at R16
