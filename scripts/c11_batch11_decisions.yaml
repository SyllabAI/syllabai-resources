command_kinds:
- code: 4CH1-4.38C
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: the ester functional group — R-COO-R (the -COO- ester
    link between the alkyl chain and the carboxyl carbon)
- code: 4CH1-4.39C
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: ethyl ethanoate is the ester produced when ethanol and
    ethanoic acid react in the presence of an acid catalyst (concentrated
    sulfuric acid), with a molecule of water also produced
- code: 4CH1-4.40C
  verb: understand
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: writing the structural and displayed formulae of ethyl
    ethanoate (CH3COOC2H5) — the formation equation
    CH3COOH + C2H5OH -> CH3COOC2H5 + H2O as the source surface
- code: 4CH1-4.41C
  verb: understand
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: writing structural and displayed formulae of an ester
    given the name or formula of the alcohol and carboxylic acid it is formed
    from and vice versa — the two-part naming (first part from the alcohol
    ending -yl, second part from the acid ending -oate; the pentyl butanoate
    example)
- code: 4CH1-4.42C
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: esters are volatile compounds with distinctive smells
    (sweet-smelling oily liquids) used as food flavourings and in perfumes
- code: 4CH1-4.43C
  verb: prepare
  guide_class: DESCRIBE_EXPERIMENT
  demanded_substance: the ethyl-ethanoate preparation practical — gentle heating
    (water bath or electric heater; ethanol is flammable so no Bunsen) of the
    ethanoic acid + ethanol + concentrated sulfuric acid mixture, the ester
    distilled off as soon as it forms and collected by condensation, then
    sodium carbonate (to remove acidic impurities, fizzing until no more CO2)
    and calcium chloride (to remove ethanol) purification
- code: 4CH1-4.44
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: an addition polymer is formed by joining up many small
    molecules called monomers — the process is addition polymerisation; each
    monomer is a repeat unit connected via covalent bonds
- code: 4CH1-4.45
  verb: understand
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: drawing the repeat unit of an addition polymer
    (poly(ethene), poly(propene), poly(chloroethene) i.e. PVC,
    (poly)tetrafluoroethene i.e. PTFE) — change the monomer double bond to a
    single bond, add extension (continuation) bonds outside brackets, add the
    subscript n, keep the groups in the same order
- code: 4CH1-4.46
  verb: understand
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: deducing the monomer structure from the repeat unit of an
    addition polymer and vice versa — change the repeat-unit single bond back
    to the monomer double bond, remove the end bonds and the subscript n
- code: 4CH1-4.47
  verb: explain
  guide_class: EXPLAIN_HOW
  demanded_substance: the disposal problems of addition polymers — landfill
    burden (non-biodegradable — strong C-C bonds make them unreactive and
    chemically inert so decomposers cannot break them down; sites fill up) and
    incineration (carbon dioxide as a greenhouse gas; toxic hydrogen chloride
    from chlorine-containing polymers such as PVC; carbon monoxide from
    incomplete combustion)
- code: 4CH1-4.48C
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: condensation polymerisation — a dicarboxylic acid
    (-COOH at either end) reacts with a diol (-OH at either end) producing a
    polyester and water (one water molecule per ester link; the terylene
    example; two different monomers with two functional groups, alternating
    chains)
- code: 4CH1-4.49C
  verb: understand
  guide_class: REPRESENT_DIAGRAM
  demanded_substance: writing the structural and displayed formula of a
    polyester showing the repeat unit, given the monomer formulae — including
    the ethanedioic acid + ethanediol reaction; deducing the monomers back
    from the polyester (break the C-O ester-link bond, add water — hydrolysis)
- code: 4CH1-4.50C
  verb: know
  guide_class: KNOW_TERM
  demanded_substance: some polyesters, known as biopolyesters, are
    biodegradable — synthesised from sugars and plant oils using
    microorganisms, able to biodegrade naturally after their intended purpose
